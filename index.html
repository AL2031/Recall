<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Recall — Flashcards</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/[email protected]/build/pdf.min.js"></script>
<style>
:root{--bg:#eeede9;--panel:#fff;--text:#1a1917;--sub:#69675f;--border:#dedcd4;--accent:#81b64c;--accent-dark:#6a9c3f;--accent-soft:rgba(129,182,76,.15);--ink:#fff;--danger:#c2392f;--hard:#d9a23b;--easy:#4c8bf5;--header-bg:#262421;--header-ink:#e9e8e4;--header-sub:#9c9a94;}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#171614;--panel:#211f1c;--text:#eae9e5;--sub:#a3a099;--border:#33312c;--header-bg:#1a1917;--accent-soft:rgba(129,182,76,.18);}}
:root[data-theme="dark"]{--bg:#171614;--panel:#211f1c;--text:#eae9e5;--sub:#a3a099;--border:#33312c;--header-bg:#1a1917;--accent-soft:rgba(129,182,76,.18);}
*{box-sizing:border-box;}
body{margin:0;background:var(--bg);color:var(--text);font-family:'Space Grotesk',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;}
header{position:sticky;top:0;padding:12px 16px;background:var(--header-bg);border-bottom:3px solid var(--accent);z-index:5;}
.brand{display:flex;align-items:center;gap:9px;margin-bottom:10px;}
.logo-badge{flex:none;width:26px;height:26px;border-radius:7px;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;}
.logo-badge svg{width:16px;height:16px;}
h1{margin:0;font-size:19px;font-weight:800;letter-spacing:.2px;color:var(--header-ink);}
nav{display:flex;gap:4px;overflow-x:auto;}
nav button{display:inline-flex;align-items:center;gap:6px;border:none;background:transparent;color:var(--header-sub);padding:8px 14px;border-radius:3px;font-size:14px;font-weight:600;white-space:nowrap;cursor:pointer;font-family:inherit;}
nav button svg{width:15px;height:15px;flex:none;}
nav button:hover{background:rgba(255,255,255,.08);color:var(--header-ink);}
nav button.active{background:var(--accent);color:#fff;}
main{padding:16px;max-width:720px;margin:0 auto;padding-bottom:60px;}
.card{background:var(--panel);border:1px solid var(--border);border-radius:4px;padding:16px;margin-bottom:12px;box-shadow:0 1px 2px rgba(0,0,0,.06);}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;}
button.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--accent);color:var(--ink);border:none;border-bottom:3px solid var(--accent-dark);padding:10px 16px;border-radius:3px;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit;}
button.btn svg{width:15px;height:15px;flex:none;}
button.btn:hover{background:var(--accent-dark);}
button.btn.secondary{background:transparent;color:var(--accent-dark);border:1px solid var(--border);border-bottom:1px solid var(--border);}
button.btn.danger{background:transparent;color:var(--danger);border:1px solid var(--danger);border-bottom:1px solid var(--danger);}
button.btn:disabled{opacity:.5;cursor:default;}
button.btn.grade-again{background:var(--danger);border-bottom-color:#8f2a22;}
button.btn.grade-hard{background:var(--hard);border-bottom-color:#a97a1f;}
button.btn.grade-good{background:var(--accent);border-bottom-color:var(--accent-dark);}
button.btn.grade-easy{background:var(--easy);border-bottom-color:#2e63c4;}
input,textarea,select{width:100%;padding:10px;border-radius:3px;border:1px solid var(--border);background:var(--bg);color:var(--text);font-size:14px;font-family:inherit;}
textarea{min-height:100px;resize:vertical;}
label{font-size:13px;color:var(--sub);font-weight:600;display:block;margin:10px 0 4px;}
.sub{color:var(--sub);font-size:13px;}
.hidden{display:none!important;}
.study-card{min-height:220px;display:flex;align-items:center;justify-content:center;text-align:center;font-size:19px;font-weight:600;padding:30px 16px;cursor:pointer;background:var(--bg);border-radius:3px;}
.grade-row{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:14px;}
.grade-row button{padding:12px 4px;font-size:13px;color:#fff;}
.deck-list-item{display:flex;justify-content:space-between;align-items:center;padding:12px 4px;}
.deck-list-item+.deck-list-item{border-top:1px solid var(--border);}
.chip{background:var(--accent);color:#fff;border-radius:3px;padding:2px 8px;font-size:12px;font-weight:700;}
.overflow-x{overflow-x:auto;}
table{width:100%;border-collapse:collapse;font-size:13px;}
td,th{border-bottom:1px solid var(--border);padding:6px;text-align:left;vertical-align:top;}
th{color:var(--sub);font-weight:700;}
.spinner{display:inline-block;width:14px;height:14px;border:2px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .7s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
.filelist{font-size:13px;margin-top:6px;}
.filelist span{display:inline-block;background:var(--bg);border:1px solid var(--border);border-radius:3px;padding:2px 8px;margin:2px 4px 0 0;}
details summary{font-weight:700;color:var(--accent-dark);}
.row{flex-wrap:wrap;}
.mcq-options{display:flex;flex-direction:column;gap:8px;margin-top:14px;}
.mcq-opt{width:100%;text-align:left;padding:12px 14px;border-radius:3px;border:1px solid var(--border);background:var(--panel);color:var(--text);font-size:14px;font-family:inherit;cursor:pointer;}
.mcq-opt:hover:not(:disabled){border-color:var(--accent);}
.mcq-opt:disabled{cursor:default;}
.mcq-opt.correct{background:var(--accent);color:#fff;border-color:var(--accent-dark);}
.mcq-opt.wrong{background:var(--danger);color:#fff;border-color:#8f2a22;}
.type-toggle{display:flex;gap:6px;margin:10px 0;}
.type-toggle button{flex:1;padding:8px;border:1px solid var(--border);background:var(--panel);color:var(--sub);border-radius:3px;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;}
.type-toggle button.active{background:var(--accent);color:#fff;border-color:var(--accent-dark);}
.opt-row{display:flex;align-items:center;gap:8px;margin-bottom:6px;}
.opt-row input[type=radio]{width:auto;flex:none;}
.opt-row input[type=text]{flex:1;}
.fitb-feedback{margin-top:12px;font-weight:700;text-align:center;}
.fitb-feedback.correct{color:var(--accent-dark);}
.fitb-feedback.wrong{color:var(--danger);}
.fitb-answers{font-weight:400;color:var(--sub);font-size:13px;margin-top:2px;}
.panel-header-row{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap;margin-bottom:16px;}
.panel-header{display:flex;align-items:flex-start;gap:13px;}
.panel-icon{flex:none;width:42px;height:42px;border-radius:10px;background:var(--accent-soft);color:var(--accent-dark);display:flex;align-items:center;justify-content:center;}
.panel-icon svg{width:21px;height:21px;}
.panel-title{font-size:17px;font-weight:800;margin:0 0 2px;}
.panel-sub{font-size:13px;color:var(--sub);margin:0;max-width:46ch;}
.back-link{display:inline-flex;align-items:center;gap:6px;background:none;border:none;color:var(--sub);font-size:13px;font-weight:600;cursor:pointer;padding:4px 0;font-family:inherit;}
.back-link:hover{color:var(--accent-dark);}
.back-link svg{width:14px;height:14px;}
.empty-state{display:flex;flex-direction:column;align-items:center;text-align:center;padding:36px 16px 20px;}
.empty-illustration{position:relative;width:110px;height:110px;border-radius:50%;border:2px dashed var(--border);display:flex;align-items:center;justify-content:center;margin-bottom:18px;}
.empty-illustration .ei-card{color:var(--accent);width:44px;height:44px;}
.empty-illustration .ei-spark{position:absolute;color:var(--accent);width:16px;height:16px;}
.empty-illustration .ei-spark.a{top:6px;right:10px;}
.empty-illustration .ei-spark.b{bottom:14px;left:2px;width:11px;height:11px;}
.empty-state h3{margin:0 0 6px;font-size:17px;font-weight:800;}
.empty-state p{margin:0;color:var(--sub);font-size:13px;max-width:34ch;}
.dropzone{border:1.5px dashed var(--border);border-radius:6px;padding:16px;display:flex;align-items:center;gap:12px;background:var(--bg);}
.dropzone svg{flex:none;width:20px;height:20px;color:var(--sub);}
.dropzone-btn{flex:none;background:var(--panel);border:1px solid var(--border);color:var(--text);font-size:13px;font-weight:700;padding:7px 12px;border-radius:3px;cursor:pointer;font-family:inherit;}
.dropzone-label{font-size:13px;color:var(--sub);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.type-toggle button{display:flex;flex-direction:row;align-items:center;justify-content:center;gap:7px;padding:10px 8px;}
.type-toggle button svg{width:16px;height:16px;flex:none;}
.deck-row{display:flex;align-items:center;gap:12px;padding:12px 4px;}
.deck-row+.deck-row{border-top:1px solid var(--border);}
.deck-row-icon{flex:none;width:36px;height:36px;border-radius:8px;background:var(--accent-soft);color:var(--accent-dark);display:flex;align-items:center;justify-content:center;}
.deck-row-icon svg{width:18px;height:18px;}
</style>
</head>
<body>
<header>
  <div class="brand">
    <span class="logo-badge"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2 2 7l10 5 10-5-10-5Z"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/></svg></span>
    <h1>Recall</h1>
  </div>
  <nav id="tabs">
    <button data-tab="study" class="active"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2Z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7Z"/></svg>Study</button>
    <button data-tab="decks"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2 2 7l10 5 10-5-10-5Z"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/></svg>Decks</button>
    <button data-tab="import"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 18a4.6 4.4 0 0 1-1.3-8.9A5 5 0 0 1 15.9 7a4.5 4.5 0 0 1 2.1 8.6"/><polyline points="9 15 12 12 15 15"/><line x1="12" y1="12" x2="12" y2="21"/></svg>Import</button>
    <button data-tab="ai"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2.5c.4 3.2 1.1 5.6 2.2 7.1 1.1 1.5 2.7 2.5 4.8 3.2-2.1.7-3.7 1.7-4.8 3.2-1.1 1.5-1.8 3.9-2.2 7.1-.4-3.2-1.1-5.6-2.2-7.1-1.1-1.5-2.7-2.5-4.8-3.2 2.1-.7 3.7-1.7 4.8-3.2 1.1-1.5 1.8-3.9 2.2-7.1Z"/></svg>AI Create</button>
  </nav>
</header>
<main>
  <div id="tab-study"></div>
  <div id="tab-decks" class="hidden"></div>
  <div id="tab-import" class="hidden"></div>
  <div id="tab-ai" class="hidden"></div>
</main>
<script>
const LS_KEY='recall_decks_v1';
const MODEL='openai/gpt-oss-120b', VISION_MODEL='qwen/qwen3.8-27b';
let state = load(LS_KEY, {decks:{}});
let studySession = null;
let aiFiles = [];

function load(key, fallback){ try{ return JSON.parse(localStorage.getItem(key)) || fallback; }catch(e){ return fallback; } }
function saveDecks(){ localStorage.setItem(LS_KEY, JSON.stringify(state)); }
function uid(){ return Math.random().toString(36).slice(2,10); }
function escapeHtml(s){ return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }
function ensureDeck(name){ const id=uid(); state.decks[id]={id,name,cards:[]}; saveDecks(); return id; }

const ICONS={
  layers:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2 2 7l10 5 10-5-10-5Z"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/></svg>',
  card:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><line x1="7" y1="10" x2="17" y2="10"/><line x1="7" y1="14" x2="13" y2="14"/></svg>',
  upload:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 18a4.6 4.4 0 0 1-1.3-8.9A5 5 0 0 1 15.9 7a4.5 4.5 0 0 1 2.1 8.6"/><polyline points="9 15 12 12 15 15"/><line x1="12" y1="12" x2="12" y2="21"/></svg>',
  sparkle:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2.5c.4 3.2 1.1 5.6 2.2 7.1 1.1 1.5 2.7 2.5 4.8 3.2-2.1.7-3.7 1.7-4.8 3.2-1.1 1.5-1.8 3.9-2.2 7.1-.4-3.2-1.1-5.6-2.2-7.1-1.1-1.5-2.7-2.5-4.8-3.2 2.1-.7 3.7-1.7 4.8-3.2 1.1-1.5 1.8-3.9 2.2-7.1Z"/></svg>',
  plus:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>',
  back:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>',
  list:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg>',
  check:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>',
  pencil:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>',
  trash:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>',
  file:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8Z"/><polyline points="14 2 14 8 20 8"/></svg>',
  download:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>',
  print:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 6 2 18 2 18 9"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8"/></svg>'
};
function panelHeader(icon, title, sub){
  return `<div class="panel-header"><span class="panel-icon">${ICONS[icon]}</span><div><p class="panel-title">${title}</p><p class="panel-sub">${sub}</p></div></div>`;
}

function schedule(card, rating){
  const MIN=60000,HR=60*MIN,DAY=24*HR;
  if(card.interval==null) card.interval=0;
  if(card.ease==null) card.ease=2.5;
  if(rating===0){ card.interval=10*MIN; card.ease=Math.max(1.3,card.ease-0.2); }
  else{
    if(card.interval===0){ card.interval = rating===1?8*HR:rating===2?DAY:4*DAY; }
    else{ const f = rating===1?1.2:rating===2?card.ease:card.ease*1.3; card.interval=Math.round(card.interval*f); }
    if(rating===1) card.ease=Math.max(1.3,card.ease-0.15);
    if(rating===3) card.ease=Math.min(3.0,card.ease+0.15);
  }
  card.due=Date.now()+card.interval; card.reps=(card.reps||0)+1;
}
function dueCards(d){ const now=Date.now(); return d.cards.filter(c=>!c.due||c.due<=now); }
function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]];} return a; }

// ---------- STUDY ----------
function renderStudy(){
  const el=document.getElementById('tab-study');
  const decks=Object.values(state.decks);
  if(!studySession){
    if(!decks.length){
      el.innerHTML=`<div class="card">${panelHeader('card','Study','Pick a deck to start a spaced-repetition session.')}
        <div class="empty-state"><div class="empty-illustration"><span class="ei-card">${ICONS.card}</span><span class="ei-spark a">${ICONS.sparkle}</span><span class="ei-spark b">${ICONS.sparkle}</span></div>
        <h3>No decks yet</h3><p>Create your first deck to start studying, or let AI generate one for you.</p></div></div>`;
      return;
    }
    el.innerHTML=`<div class="card">${panelHeader('card','Study','Pick a deck to start a spaced-repetition session.')}
      <label>Pick a deck</label>
      <select id="studyDeckSel">${decks.map(d=>`<option value="${d.id}">${escapeHtml(d.name)} (${dueCards(d).length} due / ${d.cards.length})</option>`).join('')}</select>
      <div class="row" style="margin-top:12px;"><button class="btn" id="startStudyBtn">${ICONS.card} Start studying</button>
      <label style="margin:0;"><input type="checkbox" id="allCardsChk" style="width:auto;"> include not-yet-due</label></div></div>`;
    document.getElementById('startStudyBtn').onclick=()=>{
      const deckId=document.getElementById('studyDeckSel').value, all=document.getElementById('allCardsChk').checked;
      const deck=state.decks[deckId], pool=all?deck.cards.slice():dueCards(deck);
      if(!pool.length){ alert('Nothing to study right now.'); return; }
      studySession={deckId, queue:shuffle(pool.map(c=>c.id)), pos:0, showBack:false, selected:null, optionOrder:null, typed:'', total:pool.length};
      renderStudy();
    };
    return;
  }
  const deck=state.decks[studySession.deckId];
  if(!deck){ studySession=null; renderStudy(); return; }
  if(studySession.pos>=studySession.queue.length){
    el.innerHTML=`<div class="card"><h3>Session complete 🎉</h3><p class="sub">Reviewed ${studySession.total} card(s).</p><button class="btn" id="doneBtn">Back</button></div>`;
    document.getElementById('doneBtn').onclick=()=>{ studySession=null; renderStudy(); }; return;
  }
  const card=deck.cards.find(c=>c.id===studySession.queue[studySession.pos]);
  if(!card){ studySession.pos++; renderStudy(); return; }
  if(card.type==='mcq') renderStudyMCQ(el, deck, card);
  else if(card.type==='fitb') renderStudyFITB(el, deck, card);
  else renderStudyBasic(el, deck, card);
}
function advanceCard(card, rating){
  schedule(card, rating); saveDecks();
  studySession.pos++; studySession.showBack=false; studySession.selected=null; studySession.optionOrder=null; studySession.typed='';
  renderStudy();
}
function renderStudyBasic(el, deck, card){
  el.innerHTML=`<div class="card"><div class="row"><span class="chip">${escapeHtml(deck.name)}</span><span class="chip">${studySession.pos+1}/${studySession.queue.length}</span></div>
    <div class="study-card" id="flipZone">${escapeHtml(studySession.showBack?card.back:card.front)}</div>
    <p class="sub" style="text-align:center;">${studySession.showBack?'':'Tap card to reveal answer'}</p>
    <div class="grade-row ${studySession.showBack?'':'hidden'}" id="gradeRow">
    <button class="btn grade-again" data-r="0">Again</button><button class="btn grade-hard" data-r="1">Hard</button>
    <button class="btn grade-good" data-r="2">Good</button><button class="btn grade-easy" data-r="3">Easy</button></div></div>`;
  document.getElementById('flipZone').onclick=()=>{ studySession.showBack=true; renderStudy(); };
  const gr=document.getElementById('gradeRow');
  if(gr) gr.querySelectorAll('button').forEach(b=>b.onclick=()=>advanceCard(card, parseInt(b.dataset.r,10)));
}
function renderStudyMCQ(el, deck, card){
  if(!studySession.optionOrder) studySession.optionOrder = shuffle(card.options.map((_,i)=>i));
  const order=studySession.optionOrder, revealed=studySession.showBack, selected=studySession.selected;
  el.innerHTML=`<div class="card"><div class="row"><span class="chip">${escapeHtml(deck.name)}</span><span class="chip">${studySession.pos+1}/${studySession.queue.length}</span></div>
    <div class="study-card" style="cursor:default;">${escapeHtml(card.front)}</div>
    <div class="mcq-options">${order.map(i=>{
      let cls='mcq-opt';
      if(revealed){ if(i===card.correctIndex) cls+=' correct'; else if(i===selected) cls+=' wrong'; }
      return `<button type="button" class="${cls}" data-i="${i}" ${revealed?'disabled':''}>${escapeHtml(card.options[i])}</button>`;
    }).join('')}</div>
    <div class="grade-row ${revealed?'':'hidden'}" id="gradeRow">
    <button class="btn grade-again" data-r="0">Again</button><button class="btn grade-hard" data-r="1">Hard</button>
    <button class="btn grade-good" data-r="2">Good</button><button class="btn grade-easy" data-r="3">Easy</button></div></div>`;
  if(!revealed){
    el.querySelectorAll('.mcq-opt').forEach(b=>b.onclick=()=>{ studySession.selected=parseInt(b.dataset.i,10); studySession.showBack=true; renderStudy(); });
  }
  const gr=document.getElementById('gradeRow');
  if(gr) gr.querySelectorAll('button').forEach(b=>b.onclick=()=>advanceCard(card, parseInt(b.dataset.r,10)));
}
function fitbMatch(card, guess){
  const norm=s=>String(s||'').trim().toLowerCase().replace(/\s+/g,' ');
  const g=norm(guess);
  return !!g && card.answers.some(a=>norm(a)===g);
}
function renderStudyFITB(el, deck, card){
  const revealed=studySession.showBack;
  const correct=revealed ? fitbMatch(card, studySession.typed) : null;
  el.innerHTML=`<div class="card"><div class="row"><span class="chip">${escapeHtml(deck.name)}</span><span class="chip">${studySession.pos+1}/${studySession.queue.length}</span></div>
    <div class="study-card" style="cursor:default;">${escapeHtml(card.front)}</div>
    <div style="margin-top:14px;">
      <input type="text" id="fitbInput" placeholder="Type your answer" ${revealed?'disabled':''} value="${escapeHtml(revealed?(studySession.typed||''):'')}" autocomplete="off">
      <div class="row" style="margin-top:8px;">
        <button class="btn" id="fitbCheckBtn" ${revealed?'disabled':''}>Check answer</button>
        <button class="btn secondary" id="fitbSkipBtn" ${revealed?'disabled':''}>I don't know</button>
      </div>
    </div>
    ${revealed?`<div class="fitb-feedback ${correct?'correct':'wrong'}">${correct?'Correct!':'Not quite.'}<div class="fitb-answers">Accepted: ${card.answers.map(a=>escapeHtml(a)).join(', ')}</div></div>`:''}
    <div class="grade-row ${revealed?'':'hidden'}" id="gradeRow">
    <button class="btn grade-again" data-r="0">Again</button><button class="btn grade-hard" data-r="1">Hard</button>
    <button class="btn grade-good" data-r="2">Good</button><button class="btn grade-easy" data-r="3">Easy</button></div></div>`;
  if(!revealed){
    const input=document.getElementById('fitbInput');
    input.focus();
    const submit=()=>{ studySession.typed=input.value; studySession.showBack=true; renderStudy(); };
    document.getElementById('fitbCheckBtn').onclick=submit;
    input.addEventListener('keydown', e=>{ if(e.key==='Enter') submit(); });
    document.getElementById('fitbSkipBtn').onclick=()=>{ studySession.typed=''; studySession.showBack=true; renderStudy(); };
  }
  const gr=document.getElementById('gradeRow');
  if(gr) gr.querySelectorAll('button').forEach(b=>b.onclick=()=>advanceCard(card, parseInt(b.dataset.r,10)));
}

function csvQuote(v){ return '"' + String(v==null?'':v).replace(/"/g,'""') + '"'; }
function downloadFile(filename, content, mime){
  const blob=new Blob([content],{type:mime||'text/csv'}); const url=URL.createObjectURL(blob);
  const a=document.createElement('a'); a.href=url; a.download=filename; a.click();
}
function cardAnswerText(c){
  if(c.type==='mcq') return c.options[c.correctIndex]||'';
  if(c.type==='fitb') return (c.answers||[]).join(' / ');
  return c.back;
}
function exportDeckCSV(id){
  const d=state.decks[id];
  const rows=d.cards.map(c=>[c.front, cardAnswerText(c)].map(csvQuote).join(','));
  downloadFile(d.name+'.csv', rows.join('\n'));
}
function exportDeckGimkit(id){
  const d=state.decks[id];
  const header=['Question','Answer 1','Answer 2','Answer 3','Answer 4','Correct Answer'].map(csvQuote).join(',');
  const rows=d.cards.map(c=>{
    let opts, correct;
    if(c.type==='mcq'){ opts=c.options.slice(0,4); while(opts.length<4) opts.push(''); correct=c.options[c.correctIndex]||''; }
    else if(c.type==='fitb'){ const a=(c.answers&&c.answers[0])||''; opts=[a,'','','']; correct=a; }
    else{ opts=[c.back,'','','']; correct=c.back; }
    return [c.front, ...opts, correct].map(csvQuote).join(',');
  });
  downloadFile(d.name+'-gimkit.csv', [header, ...rows].join('\n'));
}
function exportDeckQuizlet(id){
  const d=state.decks[id];
  const clean=s=>String(s==null?'':s).replace(/[\t\r\n]+/g,' ').trim();
  const rows=d.cards.map(c=>clean(c.front)+'\t'+clean(cardAnswerText(c)));
  downloadFile(d.name+'-quizlet.txt', rows.join('\n'), 'text/plain');
}
function printDeck(id){
  const d=state.decks[id];
  if(!d.cards.length){ alert('This deck has no cards yet.'); return; }

  win.document.write(`<!DOCTYPE html><html><head><title>${escapeHtml(d.name)} — Flashcards</title><meta charset="UTF-8">
<style>
*{box-sizing:border-box;}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;margin:28px;color:#1a1917;}
h1{font-size:19px;margin:0 0 4px;}
.meta{color:#69675f;font-size:12px;margin-bottom:20px;}

.print-toolbar button{background:#81b64c;color:#fff;border:none;border-radius:4px;padding:9px 16px;font-size:13px;font-weight:700;cursor:pointer;}
.print-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;}
.print-card{border:1px solid #ccc;border-radius:6px;padding:14px 16px;break-inside:avoid;}

.pb::before{content:'Answer: ';font-weight:700;color:#333;}
@media print{

}
</style></head><body>
<div class="print-toolbar"><button onclick="window.print()">Print</button></div>
<h1>${escapeHtml(d.name)}</h1><div class="meta">${d.cards.length} card(s)</div>
<div class="print-grid">${cardsHtml}</div>
</body></html>`);
  win.document.close();
  setTimeout(()=>{ try{ win.focus(); win.print(); }catch(e){} }, 350);

function renderImport(){
  const el=document.getElementById('tab-import'), decks=Object.values(state.decks);
  el.innerHTML=`<div class="card">${panelHeader('upload','Import Cards','Paste cards, upload files, or import from Anki/Quizlet.')}
    <label>Import into</label><select id="impDeckSel">${decks.map(d=>`<option value="${d.id}">${escapeHtml(d.name)}</option>`).join('')}<option value="__new">+ New deck</option></select>
    <input id="impNewName" class="hidden" placeholder="New deck name" style="margin-top:8px;">
    <label>Upload a file (.txt or .csv, one card per line)</label>
    <div class="dropzone">${ICONS.file}<button type="button" class="dropzone-btn" id="impChooseBtn">Choose Files</button><span class="dropzone-label" id="impFileLabel">No file chosen</span></div>
    <input type="file" id="impFileInput" multiple accept=".txt,.csv" class="hidden">
    <label>Card data</label><textarea id="impText" placeholder="Bonjour,Hello&#10;Merci,Thank you"></textarea>
    <p class="sub">One card per line, as <code>front,back</code> or tab-separated.</p>
    <button class="btn" id="impBtn" style="margin-top:10px;">${ICONS.upload} Import cards</button><p class="sub" id="impResult"></p></div>`;
  const sel=document.getElementById('impDeckSel');
  sel.onchange=()=>document.getElementById('impNewName').classList.toggle('hidden', sel.value!=='__new');
  const impFileInput=document.getElementById('impFileInput');
  document.getElementById('impChooseBtn').onclick=()=>impFileInput.click();
  impFileInput.onchange=async (e)=>{
    const files=Array.from(e.target.files);
    if(!files.length) return;
    document.getElementById('impFileLabel').textContent = files.length===1?files[0].name:files.length+' files chosen';
    const ta=document.getElementById('impText');
    for(const f of files){ const text=await readAsText(f); ta.value += (ta.value?'\n':'') + text.trim(); }
  };
  document.getElementById('impBtn').onclick=()=>{
    let deckId=sel.value;
    if(deckId==='__new'){ const nm=document.getElementById('impNewName').value.trim(); if(!nm){alert('Name the new deck first.');return;} deckId=ensureDeck(nm); }
    const lines=document.getElementById('impText').value.split('\n').map(l=>l.trim()).filter(Boolean);
    let added=0;
    lines.forEach(line=>{
      const parts=line.includes('\t')?line.split('\t'):splitCsvLine(line);
      if(parts.length>=2 && parts[0] && parts[1]){ state.decks[deckId].cards.push({id:uid(),front:parts[0].trim(),back:parts[1].trim(),interval:0,ease:2.5,due:0,reps:0}); added++; }
    });
    saveDecks(); document.getElementById('impResult').textContent=`Imported ${added} card(s).`; document.getElementById('impText').value=''; document.getElementById('impFileLabel').textContent='No file chosen'; renderDecks();
  };
}
function splitCsvLine(line){
  const out=[]; let cur='',inQ=false;
  for(let i=0;i<line.length;i++){ const ch=line[i];
    if(ch==='"'){ if(inQ&&line[i+1]==='"'){cur+='"';i++;} else inQ=!inQ; }
    else if(ch===','&&!inQ){ out.push(cur); cur=''; } else cur+=ch; }
  out.push(cur); return out;
}

// ---------- AI CREATE ----------
async function extractPdfText(file){
  const buf = await file.arrayBuffer();
  const pdf = await pdfjsLib.getDocument({data:buf}).promise;
  let text='';
  for(let p=1;p<=pdf.numPages;p++){
    const page=await pdf.getPage(p);
    const content=await page.getTextContent();
    text += content.items.map(i=>i.str).join(' ') + '\n';
  }
  return text;
}
function readAsText(file){ return new Promise((res,rej)=>{ const r=new FileReader(); r.onload=()=>res(r.result); r.onerror=rej; r.readAsText(file); }); }
function readAsDataURL(file){ return new Promise((res,rej)=>{ const r=new FileReader(); r.onload=()=>res(r.result); r.onerror=rej; r.readAsDataURL(file); }); }

function renderAI(){
  const el=document.getElementById('tab-ai'), decks=Object.values(state.decks);
  el.innerHTML=`<div class="card">${panelHeader('sparkle','Create with AI','Let AI turn your notes, files, or ideas into a complete deck.')}
    <label>Attach files (text, .md, .csv, PDF, or images)</label>
    <div class="dropzone">${ICONS.file}<button type="button" class="dropzone-btn" id="aiChooseBtn">Choose Files</button><span class="dropzone-label" id="aiFileLabel">No file chosen</span></div>
    <input type="file" id="aiFileInput" multiple accept=".txt,.md,.csv,.pdf,image/*" class="hidden">
    <div class="filelist" id="aiFileList"></div>
    <label>Extra notes (optional)</label>
    <textarea id="aiInput" placeholder="Any extra context or a topic to focus on"></textarea>
    <label>Card type</label>
    <div class="type-toggle">
      <button type="button" class="typeBtn active" data-type="basic">${ICONS.list}<span>Basic</span></button>
      <button type="button" class="typeBtn" data-type="mcq">${ICONS.check}<span>Multiple choice</span></button>
      <button type="button" class="typeBtn" data-type="fitb">${ICONS.pencil}<span>Fill in the blank</span></button>
    </div>
    <input type="hidden" id="aiCardType" value="basic">
    <p class="sub">The AI decides how many cards to make based on the material, and checks your existing decks to avoid duplicating cards you already have.</p>
    <label>Save into</label>
    <select id="aiDeckSel">${decks.map(d=>`<option value="${d.id}">${escapeHtml(d.name)}</option>`).join('')}<option value="__new">+ New deck</option></select>
    <input id="aiNewName" class="hidden" placeholder="New deck name" style="margin-top:8px;">
    <button class="btn" id="aiBtn" style="margin-top:10px;">${ICONS.sparkle} Generate cards</button>
    <p class="sub" id="aiStatus"></p><div id="aiPreview"></div></div>`;
  const sel=document.getElementById('aiDeckSel');
  sel.onchange=()=>document.getElementById('aiNewName').classList.toggle('hidden', sel.value!=='__new');
  const aiFileInput=document.getElementById('aiFileInput');
  document.getElementById('aiChooseBtn').onclick=()=>aiFileInput.click();
  aiFileInput.onchange=(e)=>{
    aiFiles=Array.from(e.target.files);
    document.getElementById('aiFileLabel').textContent = aiFiles.length ? (aiFiles.length===1?aiFiles[0].name:aiFiles.length+' files chosen') : 'No file chosen';
    document.getElementById('aiFileList').innerHTML=aiFiles.map(f=>`<span>${escapeHtml(f.name)}</span>`).join('');
  };
  el.querySelectorAll('.typeBtn').forEach(b=>b.onclick=()=>{
    el.querySelectorAll('.typeBtn').forEach(x=>x.classList.toggle('active', x===b));
    document.getElementById('aiCardType').value=b.dataset.type;
  });

  document.getElementById('aiBtn').onclick=async ()=>{
    const notes=document.getElementById('aiInput').value.trim();
    const cardType=document.getElementById('aiCardType').value;
    const btn=document.getElementById('aiBtn');
    btn.disabled=true; document.getElementById('aiStatus').innerHTML='<span class="spinner"></span> Reading files…';
    try{
      let combinedText = notes;
      const images = [];
      for(const f of aiFiles){
        if(f.type.startsWith('image/')) images.push(await readAsDataURL(f));
        else if(f.type==='application/pdf' || f.name.endsWith('.pdf')) combinedText += '\n\n'+await extractPdfText(f);
        else combinedText += '\n\n'+await readAsText(f);
      }
      if(!combinedText.trim() && !images.length){ alert('Attach a file or add some notes first.'); btn.disabled=false; document.getElementById('aiStatus').textContent=''; return; }

      // existing-deck context to avoid duplicates
      const existingSummary = Object.values(state.decks).map(d=>
        `Deck "${d.name}" already has ${d.cards.length} card(s), fronts include: ${d.cards.slice(0,25).map(c=>c.front).join(' | ')}`
      ).join('\n');

      document.getElementById('aiStatus').innerHTML='<span class="spinner"></span> Generating cards…';
      const promptText = cardType==='mcq' ? `You are a flashcard-writing assistant. Read the provided material and produce a set of high-quality multiple-choice questions.
Decide the number of questions yourself based on how much distinct, testable content is present (do not pad with trivial or repetitive questions).
Each question needs exactly 4 answer options with exactly one correct answer. Make the incorrect options plausible, not silly or obviously wrong.
Before finalizing, check the existing decks listed below. If a fact is already covered by an existing card, SKIP it rather than duplicating it.
Existing decks:
${existingSummary || '(none yet)'}

Material:
${combinedText.slice(0,12000)}

Respond with ONLY a JSON array like [{"question":"...","options":["...","...","...","..."],"answer":"..."}] and nothing else — no markdown, no commentary. "answer" must exactly match one of the strings in "options".`
      : cardType==='fitb' ? `You are a flashcard-writing assistant. Read the provided material and produce a set of high-quality fill-in-the-blank questions.
Decide the number of questions yourself based on how much distinct, testable content is present (do not pad with trivial or repetitive questions).
Each question is a sentence from the material with the key term or phrase replaced by ___ (three underscores). For each question, also give an "answers" array listing EVERY acceptable way to fill in that blank correctly — include reasonable synonyms, alternate spellings, abbreviations, singular/plural forms, and with/without accents, so a correct answer isn't marked wrong just for wording. Include at least 2 entries in "answers" whenever a genuine alternate wording exists.
Before finalizing, check the existing decks listed below. If a fact is already covered by an existing card, SKIP it rather than duplicating it.
Existing decks:
${existingSummary || '(none yet)'}

Material:
${combinedText.slice(0,12000)}

Respond with ONLY a JSON array like [{"question":"...___...","answers":["...","..."]}] and nothing else — no markdown, no commentary.`
      : `You are a flashcard-writing assistant. Read the provided material and produce a set of high-quality flashcards.
Decide the number of cards yourself based on how much distinct, testable content is present (do not pad with trivial or repetitive cards).
Before finalizing, check the existing decks listed below. If a fact is already covered by an existing card, SKIP it rather than duplicating it.
Existing decks:
${existingSummary || '(none yet)'}

Material:
${combinedText.slice(0,12000)}

Respond with ONLY a JSON array like [{"front":"...","back":"..."}] and nothing else — no markdown, no commentary.`;

      const useVision = images.length>0;
      const model = useVision ? (VISION_MODEL || MODEL) : MODEL;
      const content = useVision
        ? [{type:'text', text:promptText}, ...images.map(u=>({type:'image_url', image_url:{url:u}}))]
        : promptText;

      const resp = await fetch('/api/generate', {
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body: JSON.stringify({ model, messages:[{role:'user', content}], temperature:0.4 })
      });
      const data = await resp.json();
      if(!resp.ok) throw new Error(data.error || ('API error '+resp.status));
      const raw = data.choices?.[0]?.message?.content || '';
      const match = raw.match(/\[[\s\S]*\]/);
      const parsed = JSON.parse(match ? match[0] : raw);
      if(!Array.isArray(parsed) || !parsed.length) throw new Error('no cards');

      let cards;
      if(cardType==='mcq'){
        cards = parsed.map(c=>{
          const options=Array.isArray(c.options) ? c.options.map(o=>String(o).trim()).filter(Boolean) : [];
          let correctIndex=options.findIndex(o=>o.toLowerCase()===String(c.answer||'').trim().toLowerCase());
          if(correctIndex<0) correctIndex=0;
          return { type:'mcq', front:String(c.question||'').trim(), options, correctIndex };
        }).filter(c=>c.front && c.options.length>=2);
      }else if(cardType==='fitb'){
        cards = parsed.map(c=>({
          type:'fitb',
          front:String(c.question||'').trim(),
          answers: Array.isArray(c.answers) ? c.answers.map(a=>String(a).trim()).filter(Boolean) : []
        })).filter(c=>c.front && c.answers.length);
      }else{
        cards = parsed.map(c=>({ type:'basic', front:String(c.front||'').trim(), back:String(c.back||'').trim() })).filter(c=>c.front && c.back);
      }
      if(!cards.length) throw new Error('no usable cards');

      document.getElementById('aiStatus').textContent = `Generated ${cards.length} card(s). Review below, then save.`;
      const preview = document.getElementById('aiPreview');
      preview.innerHTML = cardType==='mcq'
        ? `<div class="overflow-x"><table><tr><th>Question</th><th>Options</th><th>Correct</th></tr>${cards.map(c=>`<tr><td>${escapeHtml(c.front)}</td><td>${c.options.map(o=>escapeHtml(o)).join('<br>')}</td><td>${escapeHtml(c.options[c.correctIndex])}</td></tr>`).join('')}</table></div><button class="btn" id="aiSaveBtn" style="margin-top:10px;">Save all to deck</button>`
        : cardType==='fitb'
        ? `<div class="overflow-x"><table><tr><th>Question</th><th>Accepted answers</th></tr>${cards.map(c=>`<tr><td>${escapeHtml(c.front)}</td><td>${c.answers.map(a=>escapeHtml(a)).join(', ')}</td></tr>`).join('')}</table></div><button class="btn" id="aiSaveBtn" style="margin-top:10px;">Save all to deck</button>`
        : `<div class="overflow-x"><table><tr><th>Front</th><th>Back</th></tr>${cards.map(c=>`<tr><td>${escapeHtml(c.front)}</td><td>${escapeHtml(c.back)}</td></tr>`).join('')}</table></div><button class="btn" id="aiSaveBtn" style="margin-top:10px;">Save all to deck</button>`;

      document.getElementById('aiSaveBtn').onclick=()=>{
        let deckId=sel.value;
        if(deckId==='__new'){ const nm=document.getElementById('aiNewName').value.trim(); if(!nm){alert('Name the new deck first.');return;} deckId=ensureDeck(nm); }
        const existingFronts = new Set(state.decks[deckId].cards.map(c=>c.front.toLowerCase().trim()));
        let saved=0;
        cards.forEach(c=>{
          if(!existingFronts.has(c.front.toLowerCase().trim())){
            if(c.type==='mcq'){
              state.decks[deckId].cards.push({id:uid(), type:'mcq', front:c.front, options:c.options, correctIndex:c.correctIndex, back:c.options[c.correctIndex], interval:0, ease:2.5, due:0, reps:0});
            }else if(c.type==='fitb'){
              state.decks[deckId].cards.push({id:uid(), type:'fitb', front:c.front, answers:c.answers, back:c.answers[0], interval:0, ease:2.5, due:0, reps:0});
            }else{
              state.decks[deckId].cards.push({id:uid(), type:'basic', front:c.front, back:c.back, interval:0, ease:2.5, due:0, reps:0});
            }
            saved++;
          }
        });
        saveDecks();
        document.getElementById('aiStatus').textContent = `Saved ${saved} card(s)${saved<cards.length?' ('+(cards.length-saved)+' skipped as duplicates)':''}.`;
        preview.innerHTML=''; renderDecks();
      };
    }catch(e){
      document.getElementById('aiStatus').textContent = 'Could not generate cards ('+e.message+'). Make sure GROQ_API_KEY is set on your host and try again.';
    }
    btn.disabled=false;
  };
}

const renderers={study:renderStudy, decks:renderDecks, import:renderImport, ai:renderAI};
document.getElementById('tabs').addEventListener('click', e=>{
  const b=e.target.closest('button[data-tab]'); if(!b) return;
  document.querySelectorAll('#tabs button').forEach(x=>x.classList.remove('active')); b.classList.add('active');
  Object.keys(renderers).forEach(k=>document.getElementById('tab-'+k).classList.toggle('hidden', k!==b.dataset.tab));
  renderers[b.dataset.tab]();
});
renderStudy(); renderDecks(); renderImport(); renderAI();
</script>
