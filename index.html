let setView='list';
let renamingSetId=null;
let managingSetId=null;
function cardSummary(c){
  if(c.type==='mcq'){
    return `<div><strong>${escapeHtml(c.front)}</strong></div><div class="sub">MCQ · correct: ${escapeHtml(c.options[c.correctIndex]||'')}</div>`;
  }
  if(c.type==='fitb'){
    return `<div><strong>${escapeHtml(c.front)}</strong></div><div class="sub">Fill-in-the-blank · accepted: ${escapeHtml((c.answers||[]).join(', '))}</div>`;
  }
  return `<div><strong>${escapeHtml(c.front)}</strong></div><div class="sub">${escapeHtml(c.back)}</div>`;
}
function cardEditForm(d, c){
  if(c.type==='mcq'){
    return `<div class="card" style="margin:8px 0;">
      <label>Question</label><input class="editFront" data-id="${c.id}" value="${escapeHtml(c.front)}">
      ${[0,1,2,3].map(i=>`<div class="opt-row"><input type="radio" name="editCorrect-${c.id}" value="${i}" ${i===c.correctIndex?'checked':''}>
        <input type="text" class="editOpt" data-id="${c.id}" data-idx="${i}" value="${escapeHtml(c.options[i]||'')}" placeholder="Option ${i+1}"></div>`).join('')}
      <div class="row" style="margin-top:8px;"><button class="btn" data-act="savemcq" data-id="${c.id}" data-deck="${d.id}">Save</button>
      <button class="btn secondary" data-act="canceledit">Cancel</button></div></div>`;
  }
  if(c.type==='fitb'){
    return `<div class="card" style="margin:8px 0;">
      <label>Question (use ___ for the blank)</label><input class="editFront" data-id="${c.id}" value="${escapeHtml(c.front)}">
      <label>Accepted answers (comma-separated — list every acceptable variant)</label><input class="editAnswers" data-id="${c.id}" value="${escapeHtml((c.answers||[]).join(', '))}">
      <div class="row" style="margin-top:8px;"><button class="btn" data-act="savefitb" data-id="${c.id}" data-deck="${d.id}">Save</button>
      <button class="btn secondary" data-act="canceledit">Cancel</button></div></div>`;
  }
  return `<div class="card" style="margin:8px 0;">
    <label>Front</label><input class="editFront" data-id="${c.id}" value="${escapeHtml(c.front)}">
    <label>Back</label><input class="editBack" data-id="${c.id}" value="${escapeHtml(c.back)}">
    <div class="row" style="margin-top:8px;"><button class="btn" data-act="savebasic" data-id="${c.id}" data-deck="${d.id}">Save</button>
    <button class="btn secondary" data-act="canceledit">Cancel</button></div></div>`;
}
function saveRename(deckId, value){
  const v=(value||'').trim();
  if(!v){ toast("Deck name can't be empty."); return; }
  if(!state.decks[deckId]) return;
  state.decks[deckId].name=v;
  saveDecks();
  renamingDeckId=null;
  toast('Deck renamed.');
  renderDecks();
}
function saveSetRename(setId, value){
  const v=(value||'').trim();
  if(!v){ toast("Set name can't be empty."); return; }
  if(!state.sets[setId]) return;
  state.sets[setId].name=v;
  saveDecks();
  renamingSetId=null;
  toast('Set renamed.');
  renderDecks();
}
function setRowHtml(s){
  const memberIds=new Set(s.deckIds||[]);
  const allDecks=Object.values(state.decks);
  const memberDecks=allDecks.filter(d=>memberIds.has(d.id));
  const memberDeckIds=memberDecks.map(d=>d.id);
  const due=dueCountForDeckIds(memberDeckIds);
  const cardCount=cardCountForDeckIds(memberDeckIds);
  return `<div class="set-item"><div class="deck-row">
    <span class="deck-row-icon">${ICONS.layers}</span>
    <div class="deck-info">${renamingSetId===s.id
      ? `<div class="row" style="flex-wrap:nowrap;"><input class="renameSetInput" data-id="${s.id}" value="${escapeHtml(s.name)}" style="min-height:36px;padding:6px 10px;" autocomplete="off" aria-label="Set name"><button class="btn btn-icon" style="flex:none;min-height:36px;width:36px;" data-act="setrenamesave" data-id="${s.id}" title="Save name" aria-label="Save name">${ICONS.check}</button><button class="btn secondary btn-icon" style="flex:none;min-height:36px;width:36px;" data-act="setrenamecancel" title="Cancel" aria-label="Cancel">${ICONS.back}</button></div>`
      : `<strong class="deck-name">${escapeHtml(s.name)}</strong>`}<div class="sub">${memberDecks.length} deck${memberDecks.length===1?'':'s'} · ${cardCount} cards · ${due} due</div></div>
    <div class="deck-actions">
      <button class="btn" data-act="setstudy" data-id="${s.id}">${ICONS.card} Study</button>
      <button class="btn secondary" data-act="setmanage" data-id="${s.id}" title="Choose decks in this set" aria-label="Choose decks in this set">${ICONS.layers} Decks</button>
      <details class="menu"><summary class="btn secondary btn-icon" aria-label="More set actions">${ICONS.more}</summary><div class="menu-pop">
        <button class="menu-item" data-act="setrename" data-id="${s.id}">${ICONS.pencil} Rename set</button>
        <button class="menu-item" data-act="setexport" data-id="${s.id}">${ICONS.download} Export set CSV</button>
        <button class="menu-item" data-act="setexportgimkit" data-id="${s.id}">${ICONS.download} Export set for Gimkit</button>
        <button class="menu-item" data-act="setexportquizlet" data-id="${s.id}">${ICONS.download} Export set for Quizlet</button>
        <button class="menu-item" data-act="setprint" data-id="${s.id}">${ICONS.print} Print set flashcards</button>
        <button class="menu-item" data-act="setexplain" data-id="${s.id}">${ICONS.sparkle} Add explanations to set (${exportSource(s.id).cards.filter(c=>!c.explain).length} missing)</button>
        <div class="menu-sep"></div>
        <button class="menu-item danger" data-act="setdel" data-id="${s.id}">${ICONS.trash} Delete set</button></div></details>
    </div></div>
    ${managingSetId===s.id ? `<div class="manage-panel"><p class="sub">Choose which decks belong to “${escapeHtml(s.name)}”:</p>${allDecks.length ? allDecks.map(d=>`<label><input type="checkbox" class="setDeckChk" data-set="${s.id}" data-deck="${d.id}" ${memberIds.has(d.id)?'checked':''}> ${escapeHtml(d.name)} <span class="sub">(${d.cards.length} cards)</span></label>`).join('') : `<p class="sub">Create a deck first.</p>`}</div>` : ''}</div>`;
}
function renderDecks(){
  const el=document.getElementById('tab-decks'), decks=Object.values(state.decks);

  if(deckView==='create'){
    el.innerHTML=`<div class="card">${panelHeader('plus','Create New Deck','Give your deck a name and start adding cards.')}
      <label>Deck name</label>
      <div class="row"><input id="newDeckName" placeholder="e.g. Spanish Verbs"></div>
      <button class="btn" id="addDeckBtn" style="margin-top:12px;">${ICONS.plus} Create</button></div>
      <button type="button" class="back-link" id="backToDecksBtn">${ICONS.back} Back to decks</button>`;
    document.getElementById('newDeckName').focus();
    document.getElementById('addDeckBtn').onclick=()=>{
      const v=document.getElementById('newDeckName').value.trim();
      if(!v){ toast('Give your deck a name.'); return; }
      const newId=ensureDeck(v); openDecks.add(newId); deckView='list'; renderDecks();
    };
    document.getElementById('backToDecksBtn').onclick=()=>{ deckView='list'; renderDecks(); };
    return;
  }

  if(setView==='create'){
    el.innerHTML=`<div class="card">${panelHeader('layers','Create New Set','Give your set a name, then choose which decks belong to it.')}
      <label>Set name</label>
      <div class="row"><input id="newSetName" placeholder="e.g. Midterm Review"></div>
      <button class="btn" id="addSetBtn" style="margin-top:12px;">${ICONS.plus} Create</button></div>
      <button type="button" class="back-link" id="backToDecksBtn2">${ICONS.back} Back to decks</button>`;
    document.getElementById('newSetName').focus();
    document.getElementById('addSetBtn').onclick=()=>{
      const v=document.getElementById('newSetName').value.trim();
      if(!v){ toast('Give your set a name.'); return; }
      const newId=ensureSet(v); managingSetId=newId; setView='list'; renderDecks();
    };
    document.getElementById('backToDecksBtn2').onclick=()=>{ setView='list'; renderDecks(); };
    return;
  }

  const dueTotal=decks.reduce((n,d)=>n+dueCards(d).length,0);
  const cardTotal=decks.reduce((n,d)=>n+d.cards.length,0);
  const visibleDecks=decks.filter(d=>d.name.toLowerCase().includes(deckQuery.toLowerCase().trim()));
  const sets=Object.values(state.sets);
  el.innerHTML=`<div class="panel-header-row">${panelHeader('layers','Decks','Create, manage, and study your decks.')}
      <button class="btn" id="newDeckBtn">${ICONS.plus} New deck</button></div>
    ${decks.length?`<div class="dashboard-grid"><div class="stat-card"><div class="stat-value">${decks.length}</div><div class="stat-label">Decks</div></div><div class="stat-card"><div class="stat-value">${cardTotal}</div><div class="stat-label">Cards</div></div><div class="stat-card"><div class="stat-value">${dueTotal}</div><div class="stat-label">Due now</div></div></div>`:`<div class="card"><div class="empty-state"><div class="empty-illustration"><span class="ei-card">${ICONS.card}</span><span class="ei-spark a">${ICONS.sparkle}</span><span class="ei-spark b">${ICONS.sparkle}</span></div>
      <h3>No decks yet</h3><p>Create your first deck to start studying, or let AI generate one for you.</p><div class="empty-actions"><button class="btn" id="newDeckEmpty">${ICONS.plus} Create deck</button><button class="btn secondary" id="aiDeckEmpty">${ICONS.sparkle} Generate with AI</button><button class="btn secondary" id="restoreBtnEmpty" title="Restore decks from a backup file">${ICONS.upload} Restore backup</button></div><input type="file" id="restoreFileInputEmpty" accept="application/json,.json" class="hidden"></div></div>`}
    ${decks.length?`<div class="card">
      <div class="card-head" style="align-items:flex-start;"><div><div class="block-title">Sets</div><p class="sub" style="margin:4px 0 0;max-width:52ch;">Bundle decks together to study a whole subject at once, or split a big deck into smaller sittings.</p></div>
        <button class="btn secondary" id="newSetBtn">${ICONS.plus} New set</button></div>
      ${!sets.length?`<p class="sub" style="margin:16px 0 0;">No sets yet. For example, put “Unit 1”, “Unit 2” and “Unit 3” into a “Midterm” set so you can study them together, or in smaller batches, instead of one deck at a time.</p>`
        : `<div style="margin-top:16px;">${sets.map(s=>setRowHtml(s)).join('')}</div>`}
    </div>`:''}
    ${decks.length?`<div class="deck-filter"><input id="deckSearch" placeholder="Search decks…" value="${escapeHtml(deckQuery)}" aria-label="Search decks"><span class="sub">${visibleDecks.length} shown</span></div>`:''}
    <div id="deckListWrap"></div>
    ${decks.length?`<div class="backup-note"><span class="sub">Decks live only in this browser. Back them up so you don’t lose them.</span>
      <div class="row" style="gap:8px;"><button class="btn secondary" id="backupBtn" title="Download all decks as a backup file">${ICONS.download} Back up</button><button class="btn secondary" id="restoreBtn" title="Restore decks from a backup file">${ICONS.upload} Restore</button></div>
      <input type="file" id="restoreFileInput" accept="application/json,.json" class="hidden"></div>`:''}`;
  const newSetBtn=document.getElementById('newSetBtn'); if(newSetBtn) newSetBtn.onclick=()=>{ setView='create'; renderDecks(); };
  if(renamingSetId){
    const ri=el.querySelector(`.renameSetInput[data-id="${renamingSetId}"]`);
    if(ri){
      ri.focus(); ri.select();
      ri.addEventListener('keydown', e=>{
        if(e.key==='Enter'){ e.preventDefault(); saveSetRename(renamingSetId, ri.value); }
        else if(e.key==='Escape'){ e.preventDefault(); renamingSetId=null; renderDecks(); }
      });
    }
  }
  el.querySelectorAll('[data-act="setstudy"]').forEach(b=>b.onclick=()=>startStudySet(b.dataset.id,false,null));
  el.querySelectorAll('[data-act="setrename"]').forEach(b=>b.onclick=()=>{ renamingSetId=b.dataset.id; renderDecks(); });
  [['setexport',exportDeckCSV],['setexportgimkit',exportDeckGimkit],['setexportquizlet',exportDeckQuizlet],['setprint',printDeck],['setexplain',addExplanations]].forEach(([act,fn])=>el.querySelectorAll(`[data-act="${act}"]`).forEach(btn=>btn.onclick=()=>{
    if(!exportSource(btn.dataset.id).cards.length){ toast('This set has no cards yet.'); return; } fn(btn.dataset.id); }));
  el.querySelectorAll('[data-act="setrenamesave"]').forEach(b=>b.onclick=()=>{
    const inp=el.querySelector(`.renameSetInput[data-id="${b.dataset.id}"]`);
    saveSetRename(b.dataset.id, inp?inp.value:'');
  });
  el.querySelectorAll('[data-act="setrenamecancel"]').forEach(b=>b.onclick=()=>{ renamingSetId=null; renderDecks(); });
  el.querySelectorAll('[data-act="setmanage"]').forEach(b=>b.onclick=()=>{ managingSetId = managingSetId===b.dataset.id ? null : b.dataset.id; renderDecks(); });
  el.querySelectorAll('[data-act="setdel"]').forEach(b=>b.onclick=()=>{
    showConfirm('Delete this set?','This only removes the set — its decks and cards are untouched.',()=>{
      delete state.sets[b.dataset.id];
      if(managingSetId===b.dataset.id) managingSetId=null;
      saveDecks(); toast('Set deleted.'); renderDecks();
    });
  });
  el.querySelectorAll('.setDeckChk').forEach(chk=>chk.onchange=()=>{
    const set=state.sets[chk.dataset.set]; if(!set) return;
    if(!set.deckIds) set.deckIds=[];
    if(chk.checked){ if(!set.deckIds.includes(chk.dataset.deck)) set.deckIds.push(chk.dataset.deck); }
    else { set.deckIds=set.deckIds.filter(id=>id!==chk.dataset.deck); }
    saveDecks(); renderDecks();
  });
  const newDeckBtn=document.getElementById('newDeckBtn');
  if(newDeckBtn) newDeckBtn.onclick=()=>{ deckView='create'; renderDecks(); };
  const emptyNew=document.getElementById('newDeckEmpty'); if(emptyNew) emptyNew.onclick=()=>{deckView='create';renderDecks();};
  const emptyAI=document.getElementById('aiDeckEmpty'); if(emptyAI) emptyAI.onclick=()=>switchTab('ai');
  const backupBtn=document.getElementById('backupBtn'); if(backupBtn) backupBtn.onclick=backupAllData;
  const restoreFileInput=document.getElementById('restoreFileInput');
  const restoreBtn=document.getElementById('restoreBtn'); if(restoreBtn) restoreBtn.onclick=()=>restoreFileInput.click();
  if(restoreFileInput) restoreFileInput.onchange=e=>{ const f=e.target.files[0]; e.target.value=''; if(f) handleRestoreFile(f); };
  const restoreFileInputEmpty=document.getElementById('restoreFileInputEmpty');
  const restoreBtnEmpty=document.getElementById('restoreBtnEmpty'); if(restoreBtnEmpty) restoreBtnEmpty.onclick=()=>restoreFileInputEmpty.click();
  if(restoreFileInputEmpty) restoreFileInputEmpty.onchange=e=>{ const f=e.target.files[0]; e.target.value=''; if(f) handleRestoreFile(f); };
  const search=document.getElementById('deckSearch');
  if(search){ search.oninput=()=>{deckQuery=search.value; renderDecks(); const s2=document.getElementById('deckSearch'); if(s2){s2.focus();s2.setSelectionRange(deckQuery.length,deckQuery.length);} }; }
  const wrap=document.getElementById('deckListWrap');
  if(!decks.length) return;
  if(!visibleDecks.length){ wrap.innerHTML=`<div class="card empty-state"><h3>No matching decks</h3><p>Try a different search term.</p></div>`; return; }
  wrap.innerHTML=visibleDecks.map(d=>{
    const addType=deckAddType[d.id]||'basic';
    const due=dueCards(d).length;
    return `<div class="card deck-card"><div class="deck-row">
    <span class="deck-row-icon">${ICONS.layers}</span>
    <div class="deck-info">${renamingDeckId===d.id
      ? `<div class="row" style="flex-wrap:nowrap;"><input class="renameInput" data-id="${d.id}" value="${escapeHtml(d.name)}" style="min-height:36px;padding:6px 10px;" autocomplete="off" aria-label="Deck name"><button class="btn btn-icon" style="flex:none;min-height:36px;width:36px;" data-act="renamesave" data-id="${d.id}" title="Save name" aria-label="Save name">${ICONS.check}</button><button class="btn secondary btn-icon" style="flex:none;min-height:36px;width:36px;" data-act="renamecancel" title="Cancel" aria-label="Cancel">${ICONS.back}</button></div>`
      : `<strong class="deck-name">${escapeHtml(d.name)}</strong>`}<div class="sub">${d.cards.length} card${d.cards.length===1?'':'s'} · ${due} due</div></div>
    <div class="deck-actions">
    <button class="btn" data-act="study" data-id="${d.id}">${ICONS.card} Study</button>
    <button class="btn secondary btn-icon" data-act="rename" data-id="${d.id}" title="Rename deck" aria-label="Rename deck">${ICONS.pencil}</button>
    <details class="menu"><summary class="btn secondary btn-icon" aria-label="More deck actions">${ICONS.more}</summary><div class="menu-pop">
      <button class="menu-item" data-act="export" data-id="${d.id}" title="Simple front,back CSV — a general-purpose backup format">${ICONS.download} Export CSV</button>
      <button class="menu-item" data-act="exportgimkit" data-id="${d.id}" title="Question, Answer 1-4, Correct Answer — the layout Gimkit/Kahoot/Quizizz-style spreadsheet imports expect">${ICONS.download} Export for Gimkit</button>
      <button class="menu-item" data-act="exportquizlet" data-id="${d.id}" title="Tab-separated term/definition — paste straight into Quizlet's import screen">${ICONS.download} Export for Quizlet</button>
      <button class="menu-item" data-act="print" data-id="${d.id}" title="Print flashcards">${ICONS.print} Print flashcards</button>
      <button class="menu-item" data-act="explain" data-id="${d.id}" title="Use AI to write a short explanation for each card that lacks one">${ICONS.sparkle} Add explanations (${d.cards.filter(c=>!c.explain).length} missing)</button>
      <div class="menu-sep"></div>
      <button class="menu-item danger" data-act="del" data-id="${d.id}">${ICONS.trash} Delete deck</button></div></details>
    </div></div>
    <details class="cards-details" data-deck-details="${d.id}" ${openDecks.has(d.id)?'open':''}><summary class="cards-summary">Add or edit cards (${d.cards.length})</summary>
    <div style="margin-top:10px;">
      <div class="type-toggle">
        <button type="button" class="typeBtn ${addType==='basic'?'active':''}" data-deck="${d.id}" data-type="basic">${ICONS.list}<span>Basic</span></button>
        <button type="button" class="typeBtn ${addType==='mcq'?'active':''}" data-deck="${d.id}" data-type="mcq">${ICONS.check}<span>Multiple choice</span></button>
        <button type="button" class="typeBtn ${addType==='fitb'?'active':''}" data-deck="${d.id}" data-type="fitb">${ICONS.pencil}<span>Fill in the blank</span></button>
      </div>
      <div class="addBasic ${addType==='basic'?'':'hidden'}" data-deck="${d.id}">
        <label>Front</label><input class="cf" data-id="${d.id}" placeholder="Question">
        <label>Back</label><input class="cb" data-id="${d.id}" placeholder="Answer">
        <button class="btn" style="margin-top:8px;" data-act="addcard" data-id="${d.id}">${ICONS.plus} Add card</button>
      </div>
      <div class="addMcq ${addType==='mcq'?'':'hidden'}" data-deck="${d.id}">
        <label>Question</label><input class="mq" data-id="${d.id}" placeholder="Question">
        ${[0,1,2,3].map(i=>`<div class="opt-row"><input type="radio" name="mcorrect-${d.id}" class="mcr" data-id="${d.id}" value="${i}" ${i===0?'checked':''}>
          <input type="text" class="mo" data-id="${d.id}" data-idx="${i}" placeholder="Option ${i+1}"></div>`).join('')}
        <button class="btn" style="margin-top:8px;" data-act="addmcq" data-id="${d.id}">${ICONS.plus} Add card</button>
      </div>
      <div class="addFitb ${addType==='fitb'?'':'hidden'}" data-deck="${d.id}">
        <label>Question (use ___ for the blank)</label><input class="fq" data-id="${d.id}" placeholder="The capital of France is ___.">
        <label>Accepted answers (comma-separated — list every acceptable variant)</label><input class="fa" data-id="${d.id}" placeholder="Paris, paris">
        <button class="btn" style="margin-top:8px;" data-act="addfitb" data-id="${d.id}">${ICONS.plus} Add card</button>
      </div>
      <div style="margin-top:14px;">${d.cards.map(c=> c.id===editingCardId ? cardEditForm(d,c) : `<div class="deck-list-item">
        <div style="flex:1;min-width:0;">${cardSummary(c)}</div>
        <div class="row" style="gap:6px;justify-content:flex-end;width:auto;flex:none;"><button class="btn secondary" data-act="editcard" data-id="${d.id}" data-cid="${c.id}" title="Edit card" aria-label="Edit card">${ICONS.pencil}</button>
        <button class="btn danger" data-act="delcard" data-id="${d.id}" data-cid="${c.id}" title="Delete card" aria-label="Delete card">${ICONS.trash}</button></div></div>`).join('')}</div>
    </div></details></div>`;
  }).join('');

  if(renamingDeckId){
    const ri=wrap.querySelector(`.renameInput[data-id="${renamingDeckId}"]`);
    if(ri){
      ri.focus(); ri.select();
      ri.addEventListener('keydown', e=>{
        if(e.key==='Enter'){ e.preventDefault(); saveRename(renamingDeckId, ri.value); }
        else if(e.key==='Escape'){ e.preventDefault(); renamingDeckId=null; renderDecks(); }
      });
    }
  }

  wrap.querySelectorAll('[data-deck-details]').forEach(det=>{
    det.addEventListener('toggle', ()=>{
      const id=det.dataset.deckDetails;
      if(det.open) openDecks.add(id); else openDecks.delete(id);
    });
  });
  wrap.querySelectorAll('[data-act="rename"]').forEach(b=>b.onclick=()=>{ renamingDeckId=b.dataset.id; renderDecks(); });
  wrap.querySelectorAll('[data-act="renamesave"]').forEach(b=>b.onclick=()=>{
    const inp=wrap.querySelector(`.renameInput[data-id="${b.dataset.id}"]`);
    saveRename(b.dataset.id, inp?inp.value:'');
  });
  wrap.querySelectorAll('[data-act="renamecancel"]').forEach(b=>b.onclick=()=>{ renamingDeckId=null; renderDecks(); });
  wrap.querySelectorAll('.typeBtn').forEach(b=>b.onclick=()=>{
    const deckId=b.dataset.deck, type=b.dataset.type;
    deckAddType[deckId]=type;
    wrap.querySelectorAll(`.typeBtn[data-deck="${deckId}"]`).forEach(x=>x.classList.toggle('active', x===b));
    wrap.querySelector(`.addBasic[data-deck="${deckId}"]`).classList.toggle('hidden', type!=='basic');
    wrap.querySelector(`.addMcq[data-deck="${deckId}"]`).classList.toggle('hidden', type!=='mcq');
    wrap.querySelector(`.addFitb[data-deck="${deckId}"]`).classList.toggle('hidden', type!=='fitb');
  });
  wrap.querySelectorAll('[data-act="study"]').forEach(b=>b.onclick=()=>startStudy(b.dataset.id,false));
  wrap.querySelectorAll('[data-act="del"]').forEach(b=>b.onclick=()=>{ showConfirm('Delete this deck?','This removes the deck and all of its cards from this browser.',()=>{ delete state.decks[b.dataset.id]; openDecks.delete(b.dataset.id); delete deckAddType[b.dataset.id]; Object.values(state.sets).forEach(s=>{ if(s.deckIds) s.deckIds=s.deckIds.filter(id=>id!==b.dataset.id); }); saveDecks(); toast('Deck deleted.'); renderDecks(); }); });
  wrap.querySelectorAll('[data-act="addcard"]').forEach(b=>b.onclick=()=>{
    const id=b.dataset.id, f=wrap.querySelector(`.cf[data-id="${id}"]`), bk=wrap.querySelector(`.cb[data-id="${id}"]`);
    if(!f.value.trim()||!bk.value.trim()) return;
    const front=f.value.trim(), back=bk.value.trim();
    openDecks.add(id);

function exportDeckGimkit(id){

function countImportableLines(text){
  return text.split('\n').map(l=>l.trim()).filter(Boolean).filter(line=>{

    return parts.length>=2 && parts[0].trim() && parts[1].trim();
  }).length;
}
function splitCsvLine(line){
  const out=[]; let cur='',inQ=false;
  for(let i=0;i<line.length;i++){ const ch=line[i];
    if(ch==='"'){ if(inQ&&line[i+1]==='"'){cur+='"';i++;} else inQ=!inQ; }
    else if(ch===','&&!inQ){ out.push(cur); cur=''; } else cur+=ch; }
  out.push(cur); return out;
}

async function extractPdfText(file){
  if(!window.pdfjsLib) throw new Error('PDF reader did not load. Check your connection and try again.');
  pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
  const buf = await file.arrayBuffer();
  const pdf = await pdfjsLib.getDocument({data:buf}).promise;
  let text='';
  for(let p=1;p<=pdf.numPages;p++){
    const page=await pdf.getPage(p);
    const content=await page.getTextContent();
    let line='', lastY=null;
    for(const it of content.items){
      const y=it.transform ? it.transform[5] : null;
      if(lastY!==null && y!==null && Math.abs(y-lastY)>2 && line){ text+=line.trim()+'\n'; line=''; }
      line += it.str + (it.hasEOL ? '\n' : ' ');
      if(it.hasEOL){ text+=line.replace(/\s+$/,'')+'\n'; line=''; }
      if(y!==null) lastY=y;
    }
    text += line.trim() + '\n';
  }
  return text;
}
async function extractDocxText(file){
  if(!window.mammoth) throw new Error('DOCX reader did not load. Check your connection and try again.');
  const result=await mammoth.extractRawText({arrayBuffer:await file.arrayBuffer()});
  return String(result.value||'').trim();
}

function readAsDataURL(file){ return new Promise((res,rej)=>{ const r=new FileReader(); r.onload=()=>res(r.result); r.onerror=rej; r.readAsDataURL(file); }); }

const GEN_SYSTEM = 'You are a flashcard generator that only outputs valid JSON. Never write sentences, greetings, questions, or explanations outside the JSON.';
const TOPIC_RULE = 'Make each card test a distinct learning objective; vary definitions, mechanisms, examples, applications, causes, effects, comparisons, exceptions, and implications when supported. Never pad with meaningless wording changes or present uncertain claims as facts. Output only the requested JSON object.';
function genError(kind, message){ const e=new Error(message||kind); e.kind=kind; return e; }

// ---- Card-count settings ----
// Larger but bounded batches reduce request overhead. MCQ cards have longer outputs.
const MIN_CARDS=1, MAX_CARDS=1000, BATCH_BASIC=40, BATCH_MCQ=25, BATCH_FITB=35;
function batchSizeFor(type){ return type==='mcq' ? BATCH_MCQ : type==='fitb' ? BATCH_FITB : BATCH_BASIC; }
function splitSourceIntoChunks(text, maxChars=9000){
  const source=String(text||'').replace(/\r/g,'').trim();
  if(!source) return [];
  if(source.length<=maxChars) return [source];
  const chunks=[]; let current='';
  const paragraphs=source.split(/\n{2,}/);
  const pushPiece=(piece)=>{
    let rest=piece.trim();
    if(!rest) return;
    if(rest.length>maxChars && current){ chunks.push(current); current=''; }
    while(rest.length>maxChars){
      let cut=rest.lastIndexOf(' ',maxChars);
      if(cut<Math.floor(maxChars*0.6)) cut=maxChars;
      chunks.push(rest.slice(0,cut).trim()); rest=rest.slice(cut).trim();
    }
    if(!rest) return;
    if(current && current.length+rest.length+2>maxChars){ chunks.push(current); current=''; }
    current += (current?'\n\n':'')+rest;
  };
  for(const paragraph of paragraphs) pushPiece(paragraph);
  if(current) chunks.push(current);
  return chunks.filter(Boolean);
}
const cardWord=k=>`${k} card${k===1?'':'s'}`;
// Reads and validates the "Number of cards" controls -> {mode, min, max} or {mode, error, bad:[ids]}
function readCountSetting(){
  const mode=document.getElementById('aiCountMode').value;
  if(mode==='auto') return {mode, min:0, max:Infinity};
  const num=id=>parseInt(document.getElementById(id).value,10);
  const ok=v=>Number.isInteger(v) && v>=MIN_CARDS && v<=MAX_CARDS;
  const rangeMsg=`Enter a whole number from ${MIN_CARDS} to ${MAX_CARDS}.`;
  if(mode==='exact'){
    const n=num('aiCountExact');
    return ok(n) ? {mode, min:n, max:n} : {mode, error:rangeMsg, bad:['aiCountExact']};
  }
  const lo=num('aiCountMin'), hi=num('aiCountMax');
  const bad=[]; if(!ok(lo)) bad.push('aiCountMin'); if(!ok(hi)) bad.push('aiCountMax');
  if(bad.length) return {mode, error:rangeMsg, bad};
  if(lo>hi) return {mode, error:"Minimum can't be more than maximum.", bad:['aiCountMin','aiCountMax']};
  return {mode, min:lo, max:hi};
}
function describeCount(s){

function countInstruction(noun, lo, hi, allowExpansion=false){

    return `Write up to ${hi} ${noun}s and try to reach at least ${lo}. You may use accurate, well-established related subject knowledge if the material is too limited; never repeat or pad with trivial ${noun}s.`;
  }

  return `Write up to ${hi} ${noun}s, aiming for at least ${lo}, using ONLY facts explicitly supported by the supplied material. Source fidelity is more important than the count. If fewer distinct supported items exist, return only those; never guess, add outside facts, or disguise repetition as a new card.`;

function autoCountInstruction(noun, allowExpansion=false){
  return allowExpansion
    ? `Decide a sensible number of distinct, useful ${noun}s from the supplied material and accurate related subject knowledge. Never pad with repetition.`
    : `Create as many distinct, useful ${noun}s as the supplied material explicitly supports. Do not use outside knowledge or guess; never pad with repetition.`;
}
function findBalanced(t, start){
  const open=t[start], close=open==='['?']':'}';
  let depth=0, inStr=false, esc=false;
  for(let i=start;i<t.length;i++){
    const c=t[i];
    if(inStr){ if(esc) esc=false; else if(c==='\\') esc=true; else if(c==='"') inStr=false; continue; }
    if(c==='"'){ inStr=true; continue; }
    if(c===open) depth++;
    else if(c===close){ depth--; if(depth===0) return i; }
  }
  return -1;
}
function unwrapCards(v){
  const ok=a=>Array.isArray(a) && a.every(x=>x && typeof x==='object' && !Array.isArray(x));
  if(ok(v)) return v;
  if(v && typeof v==='object'){
    if(ok(v.cards)) return v.cards;
    for(const k of Object.keys(v)) if(Array.isArray(v[k]) && v[k].length && ok(v[k])) return v[k];
  }
  return null;
}
// Pulls the cards out of a model reply even if it wrapped the JSON in prose,
// markdown fences, or <think> blocks. Returns an array, or null if none found.
function parseCardsJson(raw){
  let t=String(raw||'').replace(/<think>[\s\S]*?<\/think>/gi,'').trim();
  t=t.replace(/^```(?:json)?\s*/i,'').replace(/\s*```$/,'').trim();
  const tryParse=x=>{ try{ return JSON.parse(x); }catch(e){ return undefined; } };
  let r=unwrapCards(tryParse(t));
  if(r) return r;
  for(let i=0;i<t.length;i++){
    if(t[i]!=='[' && t[i]!=='{') continue;
    const end=findBalanced(t,i); if(end<0) continue;
    r=unwrapCards(tryParse(t.slice(i,end+1)));
    if(r && r.length) return r;
  }
  // truncated reply: keep every complete card object that was written before the cut-off
  const salvaged=[];
  for(let i=0;i<t.length;i++){
    if(t[i]!=='{') continue;
    const end=findBalanced(t,i); if(end<0) continue;
    const o=tryParse(t.slice(i,end+1));
    if(o && typeof o==='object' && !Array.isArray(o) && ('front' in o || 'question' in o)){ salvaged.push(o); i=end; }
  }
  return salvaged.length ? salvaged : null;
}
async function requestCards(model, promptText, images, tokenBudget=4000){
  const userContent = images.length
    ? [{type:'text', text:promptText}, ...images.map(u=>({type:'image_url', image_url:{url:u}}))]
    : promptText;
  let messages=[{role:'system', content:GEN_SYSTEM},{role:'user', content:userContent}];
  let jsonMode = images.length===0;   // JSON mode is only used for text-only requests
  let lastRaw='';
  const maxTok=fitBudget(promptText, tokenBudget);
  for(let attempt=0; attempt<2; attempt++){
    const body={ model, messages, temperature:0.2, max_completion_tokens:maxTok, ...(model==='openai/gpt-oss-20b'||model==='openai/gpt-oss-120b' ? {reasoning_effort:'low',include_reasoning:false} : {}) };
    if(jsonMode) body.response_format={type:'json_object'};
    const resp = await fetch('/api/generate', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body) });
    const data = await resp.json().catch(()=>({}));
    if(!resp.ok){
      // Model/endpoint rejected JSON mode (or its JSON check) -> retry without it.
      if(resp.status===400 && jsonMode){ jsonMode=false; continue; }
      const msg = typeof data.error==='string' ? data.error : (data.error && data.error.message) || ('API error '+resp.status);
      const detail = (data.details && (data.details.error && data.details.error.message || data.details.error)) || '';
      const err=genError('api', msg); err.status=resp.status;
      err.retryAfterMs=parseRetryMs(resp.headers.get('retry-after') ?? data.retry_after_seconds, msg+' '+(typeof detail==='string'?detail:JSON.stringify(detail)));

      if(resp.status===429 && err.retryAfterMs>120000){

        err.retryable=false; err.kind='limit';
        err.message=`the Groq usage limit was reached (it resets in about ${Math.ceil(err.retryAfterMs/60000)} min). Your cards so far are kept; run again later, or use a paid/other-organization key`;
      } else if(resp.status===413){
        err.retryable=false; err.kind='limit';
        err.message='a request was larger than your Groq per-minute token limit. Try a smaller card count or a paid Groq tier';
      }
      throw err;
    }
    lastRaw = data.choices?.[0]?.message?.content || '';
    const parsed = parseCardsJson(lastRaw);
    if(parsed) return parsed;
    // Model answered in prose. Show it what went wrong and ask again.
    messages = [
      {role:'system', content:GEN_SYSTEM},
      {role:'user', content:userContent},
      {role:'assistant', content:String(lastRaw).slice(0,600) || '(empty)'},
      {role:'user', content:'That was not valid JSON. Reply again with ONLY the JSON object {"cards":[...]} — no sentences, no questions, no markdown. If the material is just a topic, write the cards from your own knowledge of it.'}
    ];
  }
  throw genError('parse', 'The AI kept replying with text instead of cards.');
}
async function extractImageSourceOnce(images){

// ---------- Smart generation engine ----------
// Term lists (e.g. 1,000 vocabulary words) are split into numbered batches where every term is
// assigned to exactly one request, so cards cannot repeat by construction. Anything the model
// skips is detected and re-requested. Prose sources are split into sections with per-section quotas.
const normKey=v=>String(v||'').normalize('NFKC').toLowerCase().replace(/[^a-z0-9\u00C0-\u024F\u4E00-\u9FFF]+/gi,' ').trim();
const termKeyOf=t=>normKey(String(t||'').replace(/\([^)]*\)/g,' ').replace(/\s+(?:n|v|adj|adv)\.?\s*$/i,''));
const dedupeTokens=k=>k.split(' ').filter(w=>w.length>2 || /\d/.test(w));
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const estTokens=s=>Math.ceil(String(s||'').length/3.6);
function shuffled(arr){ const a=arr.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }

// Groq counts prompt + max output against the per-minute limit, so keep the two together under ~7.6k.
function fitBudget(promptText, desired){
  const room=7600-(estTokens(promptText)+150);
  return Math.max(800, Math.min(8192, desired, room));
}
function parseRetryMs(headerVal, message){
  const h=parseFloat(headerVal);
  if(Number.isFinite(h) && h>=0) return Math.ceil(h*1000);
  const m=/try again in\s+((?:\d+(?:\.\d+)?\s*(?:ms|h|m|s)\s*)+)/i.exec(String(message||''));
  if(!m) return 0;
  let total=0, x; const re=/(\d+(?:\.\d+)?)\s*(ms|h|m|s)/gi;
  while((x=re.exec(m[1]))){ const v=parseFloat(x[1]), u=x[2].toLowerCase(); total+= u==='h'?v*3600000 : u==='m'?v*60000 : u==='s'?v*1000 : v; }
  return Math.ceil(total);
}

// ---- rate-limit aware requests ----
let rlUntil=0;   // shared "do not send before" timestamp after a 429
async function requestWithBackoff(model, promptText, images, budget, shouldStop, pace){
  let delay=2500;
  for(let attempt=0; attempt<5; attempt++){
    if(shouldStop && shouldStop()) throw genError('stopped','Stopped');
    const wait=rlUntil-Date.now(); if(wait>0) await sleep(wait);
    try{ return await requestCards(model, promptText, images, budget); }
    catch(err){
      const retryable = err.retryable===true || !err.kind;   // 429 / 5xx / network errors
      if(!retryable || attempt===4) throw err;
      if(err.status===429 && pace) pace.limit=1;               // free-tier limits: stop running in parallel
      const waitMs=Math.min(60000, err.retryAfterMs || delay) + Math.random()*400;
      rlUntil=Math.max(rlUntil, Date.now()+waitMs);
      delay=Math.min(30000, delay*2);
    }
  }
}
// Runs async tasks with a concurrency limit that can shrink while running (pace.limit).
async function runPool(tasks, pace, halt){
  let next=0;
  const worker=async idx=>{
    while(true){
      if(halt()) return;
      if(idx>=pace.limit) return;
      const i=next++; if(i>=tasks.length) return;
      await tasks[i]();
    }
  };
  await Promise.all(Array.from({length:Math.min(pace.limit,tasks.length)},(_,i)=>worker(i)));
  // if the limit shrank mid-run, worker 0 has already drained the queue
}

// ---- normalising model output into cards ----
function normalizeCards(cardType, parsed){
  const arr=Array.isArray(parsed) ? parsed : [];
  const term=c=>c && c.term!=null ? String(c.term).trim() : '';
  if(cardType==='mcq'){
    return arr.map(c=>{
      if(!c || typeof c!=='object') return null;
      let options=Array.isArray(c.options) ? c.options.map(o=>String(o).trim()).filter(Boolean) : [];
      if(options.length===4 && options.every((o,i)=>new RegExp('^\\(?'+'ABCD'[i]+'[.)]\\s','i').test(o))) options=options.map(o=>o.replace(/^\(?[A-Da-d][.)]\s+/,''));
      if(options.length!==4 || new Set(options.map(o=>o.toLowerCase())).size!==4) return null;
      const ans=String(c.answer||'').trim();
      let ci=options.findIndex(o=>o.toLowerCase()===ans.toLowerCase());
      if(ci<0){ const stripped=ans.replace(/^\(?[A-Da-d][.)]\s*/,'').toLowerCase(); ci=options.findIndex(o=>o.toLowerCase()===stripped); }
      if(ci<0 && /^[A-Da-d]$/.test(ans)) ci='abcd'.indexOf(ans.toLowerCase());
      if(ci<0) return null;
      let opts=options, idx=ci;
      // models like to put the right answer in the same slot; shuffle unless options refer to each other
      if(!options.some(o=>/\b(all|none|both)\b.*\b(above|these|options)\b/i.test(o))){ const order=shuffled([0,1,2,3]); opts=order.map(i=>options[i]); idx=order.indexOf(ci); }
      const front=String(c.question||'').trim();
      return front ? { type:'mcq', front, options:opts, correctIndex:idx, term:term(c) } : null;
    }).filter(Boolean);
  }
  if(cardType==='fitb'){
    return arr.map(c=>{
      if(!c || typeof c!=='object') return null;
      const front=String(c.question||'').replace(/\[\s*(?:blank)?\s*\]|\(\s*blank\s*\)|\.{4,}|…{2,}/gi,'___').trim();
      const answers=Array.isArray(c.answers) ? c.answers.map(a=>String(a).trim()).filter(Boolean) : (c.answer ? [String(c.answer).trim()] : []);
      return front && /_{2,}/.test(front) && answers.length ? { type:'fitb', front, answers, term:term(c) } : null;
    }).filter(Boolean);
  }
  return arr.map(c=>{
    if(!c || typeof c!=='object') return null;
    const front=String(c.front||'').trim(), back=String(c.back||'').trim();
    return front && back ? { type:'basic', front, back, term:term(c) } : null;
  }).filter(Boolean);
}

// ---- duplicate removal ----
// existing = {keys:Set<string>, toks:Array<Set<string>>}. Exact normalised-front match always counts;
// near-duplicate (word overlap >= 85%) is checked for free-form cards but not for term-list cards.
function dedupeCards(list, existing){
  const seen=new Set(existing ? existing.keys : []);
  const toks=existing ? existing.toks.slice() : [];
  const out=[];
  for(const c of list){
    const fk=normKey(c.front);
    if(!fk || seen.has(fk)) continue;
    let tk=null;
    if(!c.key){
      tk=new Set(dedupeTokens(fk));
      if(tk.size>=4){
        let dup=false;
        for(const t of toks){
          if(t.size<4) continue;
          let inter=0; for(const w of tk) if(t.has(w)) inter++;
          if(inter/(tk.size+t.size-inter)>=0.85){ dup=true; break; }
        }
        if(dup) continue;
      }
    }
    seen.add(fk); if(tk && tk.size>=4) toks.push(tk);
    out.push(c);
  }
  return out;
}

// ---- term-list detection ----
function splitTermLine(raw){
  let s=String(raw||'').trim();
  s=s.replace(/^(?:[-*•·▪◦►]+\s+|\(?\d{1,4}[.):]\s+|\(?[a-zA-Z][.)]\s+)/,'');
  if(!s) return null;
  let term=s, def='', m;
  const tab=s.indexOf('\t');
  if(tab>0){ term=s.slice(0,tab); def=s.slice(tab+1); }
  else if(s[0]==='"' && (m=/^"([^"]*)"\s*,\s*"?([\s\S]*?)"?$/.exec(s))){ term=m[1]; def=m[2]; }
  else if((m=/^(.{1,60}?)\s+[-–—|]\s+(.+)$/.exec(s))){ term=m[1]; def=m[2]; }
  else if((m=/^([^:=]{1,60}?)\s*[:=]\s+(.+)$/.exec(s))){ term=m[1]; def=m[2]; }
  else if((s.match(/,/g)||[]).length===1 && (m=/^([^,]{1,40}),\s*(.+)$/.exec(s))){ term=m[1]; def=m[2]; }
  const clean=x=>String(x||'').replace(/^["'“”‘’]+|["'“”‘’]+$/g,'').replace(/\s+/g,' ').trim();
  term=clean(term); def=clean(def);
  if(!term) return null;
  const tw=term.split(/\s+/).length;
  if(tw>5 || term.length>60) return null;
  if(def){ if(def.split(/\s+/).length>40) return null; }
  else { if(tw>4) return null; if(tw>=3 && /[.?!]$/.test(term)) return null; }
  const key=termKeyOf(term); if(!key) return null;
  return { term, def, key };
}
// a title or instruction typed above/below a list ("SSAT vocabulary", "Make one question per word:")
function looksLikeInstruction(l){
  const wc=l.split(/\s+/).length;
  if(/[:：]\s*$/.test(l)) return true;
  return wc>=2 && wc<=14 && !/[-–—|=]|:\s/.test(l) &&
    /\b(vocab(?:ulary)?|words?|list|terms?|questions?|flashcards?|cards?|quiz|make|create|generate|write|study|ssat|isee|sat|act|gre|toefl|unit|chapter|lesson|practice|each|every|per)\b/i.test(l);
}
function parseOneList(text){
  const raw=String(text||'').replace(/\r/g,'').split('\n').map(l=>l.trim());
  let lines=raw.filter(Boolean);
  if(!lines.length) return null;
  const context=[];
  // a short heading block followed by a blank line and then a solid block of lines is a title, not terms
  const bi=raw.findIndex((l,i)=>!l && raw.slice(0,i).some(Boolean));
  if(bi>0){
    const head=raw.slice(0,bi).filter(Boolean), nextBlock=[]; 
    for(let i=bi+1;i<raw.length && raw[i];i++) nextBlock.push(raw[i]);
    if(head.length<=3 && nextBlock.length>=4){ context.push(...head); lines=lines.slice(head.length); }
  }
  const edge=new Set([...lines.slice(0,3), ...lines.slice(-2)].filter(looksLikeInstruction));
  let entries=null;
  if(lines.length>=8){
    const e=[], ctx=[];
    for(const l of lines){ const it=edge.has(l) ? null : splitTermLine(l); if(it) e.push(it); else ctx.push(l); }
    if(e.length>=8 && e.length>=lines.length*0.7){ entries=e; context.push(...ctx); }
  }
  if(!entries){
    // one paragraph / a few lines of comma- or semicolon-separated terms
    const segs=lines.filter(l=>!edge.has(l)).join(',').split(/[,;•·|]+/).map(x=>x.replace(/^\s*\(?\d{1,4}[.)]\s*/,'').trim()).filter(Boolean);
    if(segs.length>=10 && segs.filter(x=>x.split(/\s+/).length<=4).length>=segs.length*0.9){
      context.push(...lines.filter(l=>edge.has(l)));
      entries=segs.map(x=>{ const key=termKeyOf(x); return key ? {term:x,def:'',key} : null; }).filter(Boolean);
    }
  }
  if(!entries) return null;
  if(entries.length && /^(word|words|term|terms|vocab|vocabulary)$/i.test(entries[0].term) && /^(definition|meaning|definitions|meanings)$/i.test(entries[0].def||'')) entries.shift();
  return { entries, context };
}
// sources: [{kind:'notes'|'file'|'image', text}] -> {items, context, dupRemoved, truncated} or null (not a term list)
function detectTermList(sources){
  const lists=[], ctx=[]; let proseChars=0;
  for(const s of sources){
    const r=parseOneList(s.text);
    if(r){ lists.push(r); ctx.push(...r.context); }
    else if(s.kind==='notes') ctx.push(String(s.text||'').trim());
    else proseChars+=String(s.text||'').length;
  }
  if(!lists.length || proseChars>1500) return null;
  const byKey=new Map(); let dupRemoved=0;
  for(const l of lists) for(const it of l.entries){
    const prev=byKey.get(it.key);
    if(prev){ dupRemoved++; if(!prev.def && it.def) prev.def=it.def; } else byKey.set(it.key,{...it});
  }
  let items=[...byKey.values()], truncated=0;
  if(items.length>3000){ truncated=items.length-3000; items=items.slice(0,3000); }
  const context=ctx.filter(Boolean).join(' ').replace(/\s+/g,' ').slice(0,600);
  return items.length>=8 ? { items, context, dupRemoved, truncated } : null;
}

// ---- term-list generation (one card per term, verified coverage) ----
const LIST_TOKENS={ basic:55, fitb:80, mcq:120 };
function termPrompt(cardType, batchItems, perTerm, context){
  const list=batchItems.map((it,i)=>`${i+1}. ${it.def ? it.term+' — '+it.def : it.term}`).join('\n');
  const k=perTerm;
  const common=`Create study cards for EACH term in the numbered list below: exactly ${k} card${k>1?'s':''} per term, in the same order as the list.
Never skip a term, never repeat a term, and never add terms that are not in the list. Copy each term into the "term" field exactly as listed (no number, no definition).
If the list gives a definition for a term, base the card on it. If a term has no definition, use its standard, well-established dictionary meaning (the most common meaning for a student-level vocabulary list); do not invent obscure senses.
${k>1?'With more than one card per term, each card must test a different angle (meaning, use in a sentence, synonym/antonym) and have a different front.\n':''}${context?`Extra instructions from the student: ${context}\n`:''}`;
  const tail=`\nTerms:\n${list}\n`;
  if(cardType==='mcq') return `${common}Each card is one multiple-choice question testing the term's meaning. Vary the stems naturally (e.g. "What does X mean?", "Which word means ...?", or a short sentence-completion). Exactly 4 options and exactly one correct answer. Distractors must be plausible real meanings or words (not nonsense) with similar length and style; do not label options with letters; avoid "all/none of the above"; do not always make the correct option the longest.${tail}Return ONLY JSON: {"cards":[{"term":"...","question":"...","options":["...","...","...","..."],"answer":"must exactly equal one option"}]}.`;
  if(cardType==='fitb') return `${common}Each card is a sentence that uses the term, with the term replaced by ___ (three underscores). The sentence context must make the meaning clear without being a giveaway. "answers" lists the term plus any inflected form that would also fit grammatically.${tail}Return ONLY JSON: {"cards":[{"term":"...","question":"... ___ ...","answers":["..."]}]}.`;
  return `${common}Front = the term. Back = a concise definition that starts with the part of speech in parentheses, for example "(adj.) tending to ...".${tail}Return ONLY JSON: {"cards":[{"term":"...","front":"...","back":"..."}]}.`;
}
// Assigns returned cards to the terms of one batch. Returns Map(batchIndex -> cards[]).
function mapToItems(batchItems, cards, perTerm){
  const byKey=new Map(batchItems.map((it,i)=>[it.key,i]));
  const out=new Map(), left=[];
  for(const c of cards){
    const k=termKeyOf(c.term||'');
    let idx=byKey.has(k) ? byKey.get(k) : -1;
    if(idx<0 && k){ for(const [bk,bi] of byKey){ if(bk && (k.startsWith(bk+' ')||bk.startsWith(k+' '))){ idx=bi; break; } } }
    if(idx<0){ left.push(c); continue; }
    if(!out.has(idx)) out.set(idx,[]);
    out.get(idx).push(c);
  }
  // model garbled/omitted some "term" fields: align the leftovers with the still-uncovered terms in order
  const open=batchItems.map((_,i)=>i).filter(i=>!out.has(i));
  if(left.length && perTerm===1 && left.length===open.length) left.forEach((c,j)=>out.set(open[j],[c]));
  for(const [i,cs] of out){
    const it=batchItems[i];
    out.set(i, cs.slice(0,perTerm).map(c=>({...c, term:it.term, key:it.key})));
  }
  return out;
}
async function generateForTerms(items, o){
  const k=o.perTerm||1, type=o.cardType;
  const got=new Array(items.length).fill(null);
  const pace={limit:o.concurrency||3};
  let fatal=null, soft=null;
  const halt=()=>!!fatal || !!(o.shouldStop && o.shouldStop());
  const report=phase=>{ if(!o.onProgress) return; let done=0, cards=0; for(const g of got) if(g){ done++; cards+=g.length; } o.onProgress({phase, done, total:items.length, cards}); };
  const runBatches=async(idxs,size)=>{
    const groups=[]; for(let i=0;i<idxs.length;i+=size) groups.push(idxs.slice(i,i+size));
    const tasks=groups.map(g=>async()=>{
      if(halt()) return;
      const batchItems=g.map(i=>items[i]);
      const prompt=termPrompt(type, batchItems, k, o.context);
      const budget=Math.min(7000, batchItems.length*k*LIST_TOKENS[type]+900);
      try{
        const parsed=await o.request(prompt, budget, pace);
        const m=mapToItems(batchItems, normalizeCards(type, parsed), k);
        for(const [bi,cs] of m) if(cs.length) got[g[bi]]=cs;
      }catch(err){
        if(err.kind==='stopped') return;
        if(err.kind==='parse'){ soft=err; }                      // retried below with smaller batches
        else { fatal=err; }                                       // limits / auth / too-large: no point continuing
      }
      report('generating');
    });
    await runPool(tasks, pace, halt);
  };
  const sizes=[o.batchSize, Math.max(6,Math.floor(o.batchSize/3)), 3];
  for(let pass=0; pass<sizes.length; pass++){
    const pending=items.map((_,i)=>i).filter(i=>!got[i]);
    if(!pending.length || halt()) break;
    if(pass===2 && pending.length>30) break;                      // systematic failure: don't burn tokens
    if(pass>0 && o.onProgress) o.onProgress({phase:'repair', pending:pending.length, done:items.length-pending.length, total:items.length});
    await runBatches(pending, sizes[pass]);
  }
  const cards=[], missing=[];
  items.forEach((it,i)=>{ if(got[i]) cards.push(...got[i]); else missing.push(it); });
  return { cards, missing, fatal, soft, stopped: !!(o.shouldStop && o.shouldStop()) };
}

// ---- prose generation (sections with quotas, targeted top-ups) ----
function allocateQuotas(total, weights){
  const sum=weights.reduce((a,b)=>a+b,0)||1;
  const raw=weights.map(w=>total*w/sum), base=raw.map(Math.floor);
  let left=total-base.reduce((a,b)=>a+b,0);
  const order=raw.map((r,i)=>[r-Math.floor(r),i]).sort((a,b)=>b[0]-a[0]);
  for(let j=0; left>0 && j<order.length; j++, left--) base[order[j][1]]++;
  return base;
}
const PROSE_TOKENS={ basic:70, fitb:90, mcq:130 };
async function generateFromSections(text, o){
  // o: {count, cardType, noun, allowExpansion, batchCap, makePrompt(countText, avoidText, material), request(prompt,budget,pace), normalize, dedupe, onProgress, shouldStop}
  const auto=o.count.mode==='auto';
  const target=auto ? Infinity : o.count.max, need=auto ? 0 : o.count.min;
  const len=text.length;
  const wanted=Math.max(1, Math.ceil(len/7000));
  const nSec=Math.max(1, auto ? wanted : Math.min(wanted, target));
  let chunks=splitSourceIntoChunks(text, Math.ceil(len/nSec*1.05)+50);
  if(!chunks.length) chunks=['(No source text.)'];
  const quotas=auto ? chunks.map(()=>0) : allocateQuotas(target, chunks.map(c=>c.length));
  const sec=chunks.map(()=>[]);        // normalised cards per section (deduped inside the section)
  const pace={limit:2};
  let fatal=null, soft=null;
  const halt=()=>!!fatal || !!(o.shouldStop && o.shouldStop());
  const total=()=>sec.reduce((a,s)=>a+s.length,0);
  const report=phase=>{ if(o.onProgress) o.onProgress({phase, done:total(), total:auto?null:target, sections:chunks.length}); };
  const budgetFor=n=>Math.min(7000, Math.max(1500, n*PROSE_TOKENS[o.cardType]+900));
  // asks for up to n more cards from one section; returns how many new ones survived de-duplication
  const ask=async(i, n, lo)=>{
    const have=sec[i];
    const avoid=have.length ? `Cards already written for this section. Do NOT repeat or rephrase any of them:\n${have.slice(-40).map(c=>'- '+c.front).join('\n').slice(-2500)}\n` : '';
    const countText=auto ? `${autoCountInstruction(o.noun, o.allowExpansion)} Return at most ${n}.` : countInstruction(o.noun, lo, n, o.allowExpansion);
    try{
      const parsed=await o.request(o.makePrompt(countText, avoid, chunks[i]), budgetFor(n), pace);
      const fresh=dedupeCards(o.normalize(parsed));
      const merged=dedupeCards(have.concat(fresh));
      const added=merged.length-have.length;
      sec[i]=merged; report('generating');
      return added;
    }catch(err){
      if(err.kind==='stopped') return 0;
      if(err.kind==='parse'){ soft=err; return 0; }
      fatal=err; return 0;
    }
  };
  // pass 1: every section once, in parallel (sections are independent so they cannot repeat each other)
  const tasks=chunks.map((_,i)=>async()=>{
    if(halt()) return;
    if(auto){
      for(let r=0; r<3 && !halt(); r++){ const added=await ask(i, o.batchCap, 1); if(added<o.batchCap*0.9) break; }
      return;
    }
    const q=quotas[i]; if(q<=0) return;
    let remaining=q;
    while(remaining>0 && !halt()){
      const n=Math.min(o.batchCap, remaining);
      const lo=o.count.min===o.count.max ? n : Math.max(1, Math.floor(need*n/target));
      const added=await ask(i, n, lo);
      if(!added) break;
      remaining-=added;
    }
  });
  await runPool(tasks, pace, halt);
  const mergeAll=()=>dedupeCards(o.dedupe(sec.flat()));
  let merged=mergeAll();
  // pass 2: if short of the minimum, ask the sections that still have material for more (with their own avoid-lists)
  if(!auto && merged.length<need){
    const exhausted=new Set();
    const guardMax=Math.ceil((need-merged.length)/o.batchCap)+chunks.length*2+2;
    for(let g=0; g<guardMax && merged.length<need && !halt(); g++){
      const cand=chunks.map((_,i)=>i).filter(i=>!exhausted.has(i));
      if(!cand.length) break;
      const i=cand[g%cand.length];
      const missing=need-merged.length, n=Math.min(o.batchCap, missing);
      const before=merged.length;
      await ask(i, n, n);
      merged=mergeAll();
      if(merged.length===before) exhausted.add(i);
      if(o.onProgress) o.onProgress({phase:'topup', done:merged.length, total:target, sections:chunks.length});
    }
  }
  return { cards: auto ? merged : merged.slice(0,target), fatal, soft, stopped: !!(o.shouldStop && o.shouldStop()), sections: chunks.length };
}

// ---- final status line ----
function doneMessage(c){
  const n=c.n.toLocaleString();
  const parts=[];
  if(c.mode==='list'){
    const t=c.info.total;
    if(!c.info.missing.length && !c.stopped && !c.fatal) parts.push(c.info.perTerm>1 ? `Generated ${n} cards covering all ${t.toLocaleString()} terms (up to ${c.info.perTerm} per term), with no repeats.` : `Generated ${n} cards: exactly one for each of your ${t.toLocaleString()} terms, with no repeats.`);
    else parts.push(`Generated ${n} cards for ${(t-c.info.missing.length).toLocaleString()} of ${t.toLocaleString()} terms.`);
    if(c.info.dupRemoved) parts.push(`${c.info.dupRemoved} duplicate term${c.info.dupRemoved===1?'':'s'} in your list ${c.info.dupRemoved===1?'was':'were'} merged.`);
    if(c.info.skippedExisting) parts.push(`${c.info.skippedExisting} term${c.info.skippedExisting===1?'':'s'} already in this set ${c.info.skippedExisting===1?'was':'were'} skipped.`);
    if(c.info.limited) parts.push(`Only the first ${c.info.limited.toLocaleString()} terms were used because of the requested card count.`);
    if(c.info.truncated) parts.push(`${c.info.truncated} terms beyond the 3,000-term limit were ignored.`);
    if(c.info.missing.length){
      const names=c.info.missing.slice(0,6).map(x=>x.term).join(', ');
      parts.push(`Couldn't complete: ${names}${c.info.missing.length>6?`, and ${c.info.missing.length-6} more`:''}. Save these, then run the same list again into the same set: terms already saved are skipped, so only the missing ones are retried.`);
    }
  } else {
    const k=c.count;
    if(k.mode==='auto') parts.push(`Generated ${c.n===1?'1 card':n+' cards'}.`);
    else if(k.mode==='exact' && c.n<k.max) parts.push(c.allowExpansion
      ? `Generated ${n} of ${k.max.toLocaleString()} requested cards. The model stopped producing enough distinct cards. You can save these or retry.`
      : `Generated ${n} of ${k.max.toLocaleString()} requested cards using only supported source facts. To include related knowledge and try to fill the rest, enable “Allow related knowledge to fill the requested count.”`);
    else if(c.n<k.min) parts.push(`Generated ${n} cards; the requested minimum is ${k.min.toLocaleString()}. ${c.allowExpansion?'The model could not complete the quota.':'Only distinct source-supported facts were included; no outside facts were guessed.'}`);
    else parts.push(k.min===k.max ? `Generated exactly ${c.n===1?'1 card':n+' cards'}.` : `Generated ${c.n===1?'1 card':n+' cards'} (range ${k.min}–${k.max}).`);
    if(c.topicOnly) parts.push('Your input looked like a topic rather than notes, so general subject knowledge was used.');
  }
  if(c.stopped) parts.push('Stopped early at your request.');
  else if(c.fatal) parts.push(`Stopped early: ${c.fatal.message||'a request failed'}.`);
  return parts.join(' ')+' Review below, then save.';
}

function renderAI(){
  const el=document.getElementById('tab-ai'), decks=Object.values(state.decks);
  el.innerHTML=`<div class="panel-header-row">${panelHeader('sparkle','Create with AI','Turn notes, files, or a topic into study cards, then review them before saving.')}</div>
  <div class="ai-layout">
    <section class="card ai-source">
      <h3 class="block-title">Source</h3>
      <label>Files <span class="label-hint">.txt, .md, .csv, .docx, PDF, or images</span></label>
      <div class="dropzone" id="aiDropzone">${ICONS.file}<button type="button" class="dropzone-btn" id="aiChooseBtn">Choose files</button><span class="dropzone-label" id="aiFileLabel">No file chosen</span></div>

    </section>
    <section class="card">
      <h3 class="block-title">Cards</h3>
      <label>Format</label>
      <div class="type-toggle">
        <button type="button" class="typeBtn active" data-type="basic">${ICONS.list}<span>Basic</span></button>
        <button type="button" class="typeBtn" data-type="mcq">${ICONS.check}<span>Multiple choice</span></button>
        <button type="button" class="typeBtn" data-type="fitb">${ICONS.pencil}<span>Fill in the blank</span></button>
      </div>
      <input type="hidden" id="aiCardType" value="basic">
      <label>Number of cards</label>
      <div class="type-toggle count-toggle">
        <button type="button" class="countBtn" data-mode="exact"><span>Exact</span></button>
        <button type="button" class="countBtn" data-mode="range"><span>Range</span></button>
        <button type="button" class="countBtn active" data-mode="auto"><span>AI decides</span></button>
      </div>
      <input type="hidden" id="aiCountMode" value="auto">
      <div class="count-fields hidden" id="aiCountExactWrap">
        <div><label for="aiCountExact">Exactly</label><input type="number" id="aiCountExact" min="${MIN_CARDS}" max="${MAX_CARDS}" step="1" value="20" inputmode="numeric"></div>
      </div>
      <div class="count-fields hidden" id="aiCountRangeWrap">
        <div><label for="aiCountMin">Minimum</label><input type="number" id="aiCountMin" min="${MIN_CARDS}" max="${MAX_CARDS}" step="1" value="10" inputmode="numeric"></div>
        <div><label for="aiCountMax">Maximum</label><input type="number" id="aiCountMax" min="${MIN_CARDS}" max="${MAX_CARDS}" step="1" value="20" inputmode="numeric"></div>
      </div>
      <p class="count-hint" id="aiCountHint"></p>
      <label class="check-card"><input type="checkbox" id="aiExplain"><span><strong>Add an explanation to every card</strong><span class="hint" style="display:block;">Takes a little longer. Each card gets a short “why”, shown after you answer.</span></span></label>
      <label class="check-card"><input type="checkbox" id="aiAllowExpansion"><span><strong>Allow related knowledge to fill the requested count</strong><span class="hint" style="display:block;">Off by default: cards must be supported by your notes or files. Turn it on for extra facts from general subject knowledge. Exact counts can’t be guaranteed from a short source without repetition or unsupported claims.</span></span></label>

      <h3 class="block-title sep">Destination</h3>
      <label for="aiSetSel">Add to set</label>
      <select id="aiSetSel"></select>
      <input id="aiNewName" class="hidden" placeholder="New set name" style="margin-top:8px;">
      <label for="aiChunkSel">Cards per deck</label>
      <select id="aiChunkSel"><option value="20" selected>Up to 20 cards</option><option value="10">Up to 10 cards</option><option value="30">Up to 30 cards</option><option value="50">Up to 50 cards</option></select>
      <p class="hint">New cards are split evenly into decks of this size inside the set, so you can study one deck at a time. Cards already in the set are skipped.</p>

    </section>
  </div>
  <div id="aiPreview"></div>`;
  const sel=document.getElementById('aiSetSel');
  const chunkSel=document.getElementById('aiChunkSel');
  const nameInput=document.getElementById('aiNewName');
  let readyCards=[];
  const setLabel=st=>{ const ds=setDeckIds(st); return `${st.name} · ${ds.length} deck${ds.length===1?'':'s'} · ${cardCountForDeckIds(ds)} cards`; };
  const fillSetOptions=selectedId=>{
    sel.innerHTML='<option value="__new">+ New set</option>'+Object.values(state.sets).map(st=>`<option value="${st.id}">${escapeHtml(setLabel(st))}</option>`).join('');
    sel.value=(selectedId && state.sets[selectedId]) ? selectedId : '__new';
  };
  // what the selected set already contains (empty when making a new set)
  const existingState=()=>{
    const keys=new Set(), toks=[], st=state.sets[sel.value];
    if(st) setDeckIds(st).forEach(id=>state.decks[id].cards.forEach(c=>{
      const k=normKey(c.front); if(!k) return;
      keys.add(k);
      const t=new Set(dedupeTokens(k)); if(t.size>=4) toks.push(t);
    }));
    return {keys, toks};
  };
  const existingTermKeys=()=>{
    const keys=new Set(), st=state.sets[sel.value];
    if(st) setDeckIds(st).forEach(id=>state.decks[id].cards.forEach(c=>{
      if(c.key) keys.add(c.key);
      const f=String(c.front||''); if(f && f.split(/\s+/).length<=4) keys.add(termKeyOf(f));
    }));
    return keys;
  };
  const freshFrom=list=>dedupeCards(list, existingState());
  const updateSaveLabel=()=>{
    const b=document.getElementById('aiSaveBtn'); if(!b) return;
    const fresh=freshFrom(readyCards);
    const per=parseInt(chunkSel.value,10)||20, n=Math.ceil(fresh.length/per);
    if(!fresh.length) b.textContent='Nothing new to add';
    else if(sel.value==='__new') b.textContent = n>1 ? `Save as a set of ${n} decks` : 'Save as a new set';
    else b.textContent=`Add ${fresh.length} card${fresh.length===1?'':'s'} to set (${n} new deck${n===1?'':'s'})`;
  };
  const syncNewUI=()=>{ nameInput.classList.toggle('hidden', sel.value!=='__new'); updateSaveLabel(); };
  fillSetOptions('__new');
  sel.onchange=syncNewUI; chunkSel.onchange=updateSaveLabel; syncNewUI();
  const aiFileInput=document.getElementById('aiFileInput');
  document.getElementById('aiChooseBtn').onclick=()=>aiFileInput.click();
  aiFileInput.onchange=e=>updateAIFileList(Array.from(e.target.files||[]));
  bindDropzone('aiDropzone','aiFileInput',updateAIFileList);
  el.querySelectorAll('.typeBtn').forEach(b=>b.onclick=()=>{
    el.querySelectorAll('.typeBtn').forEach(x=>x.classList.toggle('active', x===b));
    document.getElementById('aiCardType').value=b.dataset.type;
  });

  // "Number of cards" controls: mode toggle + live hint + validation styling
  const countIds=['aiCountExact','aiCountMin','aiCountMax'];
  const refreshCount=()=>{
    const s=readCountSetting();
    document.getElementById('aiCountExactWrap').classList.toggle('hidden', s.mode!=='exact');
    document.getElementById('aiCountRangeWrap').classList.toggle('hidden', s.mode!=='range');
    countIds.forEach(id=>document.getElementById(id).classList.toggle('invalid', !!(s.bad && s.bad.includes(id))));
    const hint=document.getElementById('aiCountHint');
    hint.classList.toggle('error', !!s.error);
    hint.textContent = s.error || describeCount(s);
  };
  el.querySelectorAll('.countBtn').forEach(b=>b.onclick=()=>{
    el.querySelectorAll('.countBtn').forEach(x=>x.classList.toggle('active', x===b));
    document.getElementById('aiCountMode').value=b.dataset.mode;
    refreshCount();
  });
  countIds.forEach(id=>{
    const inp=document.getElementById(id);
    inp.oninput=refreshCount;
    // when leaving a field, pull out-of-bounds numbers back into the allowed range
    inp.onchange=()=>{
      const v=parseInt(inp.value,10);
      if(Number.isFinite(v)) inp.value=Math.min(MAX_CARDS, Math.max(MIN_CARDS, v));
      refreshCount();
    };
  });
  refreshCount();

  document.getElementById('aiBtn').onclick=async ()=>{
    const count=readCountSetting();
    if(count.error){ toast(count.error); refreshCount(); return; }
    const notes=document.getElementById('aiInput').value.trim();
    const cardType=document.getElementById('aiCardType').value;
    const btn=document.getElementById('aiBtn'), stopBtn=document.getElementById('aiStopBtn');
    const statusEl=document.getElementById('aiStatus');
    const fmt=n=>Number(n).toLocaleString();
    let stopped=false;
    stopBtn.disabled=false;
    stopBtn.onclick=()=>{ stopped=true; stopBtn.disabled=true; statusEl.textContent='Stopping after the current requests finish…'; };
    const shouldStop=()=>stopped;
    btn.disabled=true; statusEl.innerHTML='<span class="spinner"></span> Reading files…';
    document.getElementById('aiPreview').innerHTML='';
    try{
      const sources=[];   // {kind:'notes'|'file'|'image', text}
      if(notes) sources.push({kind:'notes', text:notes});
      let images=[];
      for(const f of aiFiles){
        const fileName=f.name.toLowerCase();
        if(f.type.startsWith('image/')) images.push(await readAsDataURL(f));
        else if(f.type==='application/pdf' || fileName.endsWith('.pdf')) sources.push({kind:'file', text:await extractPdfText(f)});
        else if(fileName.endsWith('.docx') || f.type==='application/vnd.openxmlformats-officedocument.wordprocessingml.document') sources.push({kind:'file', text:await extractDocxText(f)});
        else sources.push({kind:'file', text:await readAsText(f)});
      }
      if(!sources.some(s=>s.text.trim()) && !images.length){ toast('Add notes or attach at least one file first.'); btn.disabled=false; statusEl.textContent=''; return; }
      stopBtn.classList.remove('hidden');
      if(images.length){
        statusEl.innerHTML=`<span class="spinner"></span> Reading image content once…`;
        const imageSource=await extractImageSourceOnce(images);
        sources.push({kind:'image', text:imageSource});
        images=[];
      }
      const combinedText=sources.map(s=>String(s.text||'').trim()).filter(Boolean).join('\n\n');
      const sourceWordCount=combinedText ? combinedText.split(/\s+/).filter(Boolean).length : 0;
      const model=MODEL;
      const noun=cardType==='basic' ? 'card' : 'question';
      const batchCap=batchSizeFor(cardType);
      const request=(prompt,budget,pace)=>requestWithBackoff(model, prompt, [], budget, shouldStop, pace);
      const userExpansion=document.getElementById('aiAllowExpansion').checked;

      let cards=[], run={mode:'prose'}, topicOnly=false, allowExpansion=userExpansion;
      const listInfo=detectTermList(sources);

      if(listInfo){
        // ---- term list (e.g. vocabulary): every term goes to exactly one request, so nothing can repeat ----
        const existing=existingTermKeys();
        let items=listInfo.items.filter(it=>!existing.has(it.key));
        const skippedExisting=listInfo.items.length-items.length;
        if(!items.length) throw genError('empty','Every term in your list is already in that set, so there is nothing new to add.');
        let perTerm=1, limited=0;
        if(count.mode!=='auto'){
          if(count.max<items.length){ limited=count.max; items=items.slice(0,count.max); }
          else if(count.max>items.length) perTerm=Math.min(3, Math.ceil(count.max/items.length));
        }
        statusEl.innerHTML=`<span class="spinner"></span> Found a list of ${fmt(items.length)} terms. Writing ${perTerm>1?perTerm+' '+noun+'s':'one '+noun} per term in ${fmt(Math.ceil(items.length/batchCap))} batches…`;
        const res=await generateForTerms(items,{
          cardType, perTerm, context:listInfo.context, request, shouldStop, batchSize:batchCap, concurrency:3,
          onProgress:p=>{
            statusEl.innerHTML = p.phase==='repair'
              ? `<span class="spinner"></span> Retrying ${fmt(p.pending)} skipped term${p.pending===1?'':'s'}… ${fmt(p.done)} / ${fmt(p.total)} terms done`
              : `<span class="spinner"></span> Building your deck… ${fmt(p.done)} / ${fmt(p.total)} terms · ${fmt(p.cards)} cards`;
          }
        });
        cards=freshFrom(res.cards);
        if(count.mode!=='auto') cards=cards.slice(0,count.max);
        run={ mode:'list', fatal:res.fatal, stopped:res.stopped,
              info:{ total:items.length, missing:res.missing, dupRemoved:listInfo.dupRemoved, skippedExisting, perTerm, limited, truncated:listInfo.truncated } };
      } else {
        // ---- free-form notes / documents / topics ----
        // A few words with no files is a topic ("photosynthesis"), not source notes, so allow general knowledge.
        topicOnly = !aiFiles.length && sourceWordCount>0 && sourceWordCount<30;
        allowExpansion = userExpansion || topicOnly;
        const targetSet=state.sets[sel.value];
        const targetIds=new Set(targetSet ? setDeckIds(targetSet) : []);
        const destinationFronts=targetSet ? [...targetIds].flatMap(id=>state.decks[id].cards.map(c=>c.front)).slice(-12) : [];
        const destHint=destinationFronts.length ? `Recent destination-set fronts to avoid: ${destinationFronts.join(' | ').slice(0,1200)}\n` : '';
        const contentPolicy=allowExpansion
          ? 'When the supplied material is insufficient, you may include accurate, well-established related subject facts. Avoid obscure or uncertain claims.'
          : 'SOURCE-ONLY MODE: every answer must be directly supported by the Material below. Do not rely on background knowledge, make assumptions, or infer facts not stated. Prefer fewer grounded cards over invented cards.';
        const makePrompt=(countText, existingText, material)=> cardType==='mcq' ? `Create high-quality multiple-choice questions from the material below.
${countText}
${contentPolicy}
Each question needs exactly 4 answer options with exactly one correct answer. Make distractors plausible and ensure the answer exactly matches one option. Each question must test a distinct fact.
${destHint}${existingText||''}${TOPIC_RULE}
Material:
${material}
Return ONLY JSON: {"cards":[{"question":"...","options":["...","...","...","..."],"answer":"..."}]}.`
        : cardType==='fitb' ? `Create high-quality fill-in-the-blank questions from the material below.
${countText}
${contentPolicy}
Use a sentence supported by the source with the key term replaced by ___ (three underscores). Include accepted answers that are actually equivalent; do not invent synonyms.
${destHint}${existingText||''}${TOPIC_RULE}
Material:
${material}
Return ONLY JSON: {"cards":[{"question":"...___...","answers":["..."]}]}.`
        : `Create high-quality flashcards from the material below.
${countText}
${contentPolicy}
Each card must test a distinct fact. Keep backs concise${allowExpansion?'':' and directly supported by the source'}.
${destHint}${existingText||''}${TOPIC_RULE}
Material:
${material}
Return ONLY JSON: {"cards":[{"front":"...","back":"..."}]}.`;
        statusEl.innerHTML=`<span class="spinner"></span> Generating cards…${sourceWordCount?` using ${fmt(sourceWordCount)} source words`:''}`;
        const res=await generateFromSections(combinedText || '(No source text.)',{
          count, cardType, noun, allowExpansion, batchCap, makePrompt, request, shouldStop,
          normalize:parsed=>normalizeCards(cardType, parsed), dedupe:freshFrom,
          onProgress:p=>{
            statusEl.innerHTML=`<span class="spinner"></span> ${p.phase==='topup'?'Looking for more distinct cards…':'Building your deck…'} ${fmt(p.done)}${p.total?' / '+fmt(p.total):''} cards${p.sections>1?` · ${p.sections} source sections`:''}`;
          }
        });
        cards=res.cards;
        run={ mode:'prose', fatal:res.fatal, stopped:res.stopped };
      }
      if(!cards.length && run.fatal) throw run.fatal;
      if(!cards.length) throw genError('empty');

      if(document.getElementById('aiExplain')?.checked){ try{ await explainCards(cards,(a,b)=>{ document.getElementById('aiStatus').textContent=`Writing explanations ${a}/${b}…`; }); }catch(e){ toast('Cards are ready, but explanations stopped early: '+e.message); } }
      document.getElementById('aiStatus').textContent=doneMessage({ mode:run.mode, n:cards.length, count, allowExpansion, topicOnly, info:run.info, stopped:run.stopped, fatal:run.fatal });
      const preview = document.getElementById('aiPreview');
      preview.innerHTML = cardType==='mcq'
        ? `<div class="overflow-x"><table><tr><th>Question</th><th>Options</th><th>Correct</th></tr>${cards.map(c=>`<tr><td>${escapeHtml(c.front)}</td><td>${c.options.map(o=>escapeHtml(o)).join('<br>')}</td><td>${escapeHtml(c.options[c.correctIndex])}</td></tr>`).join('')}</table></div><button class="btn" id="aiSaveBtn" style="margin-top:10px;">Save all to deck</button>`
        : cardType==='fitb'
        ? `<div class="overflow-x"><table><tr><th>Question</th><th>Accepted answers</th></tr>${cards.map(c=>`<tr><td>${escapeHtml(c.front)}</td><td>${c.answers.map(a=>escapeHtml(a)).join(', ')}</td></tr>`).join('')}</table></div><button class="btn" id="aiSaveBtn" style="margin-top:10px;">Save all to deck</button>`
        : `<div class="overflow-x"><table><tr><th>Front</th><th>Back</th></tr>${cards.map(c=>`<tr><td>${escapeHtml(c.front)}</td><td>${escapeHtml(c.back)}</td></tr>`).join('')}</table></div><button class="btn" id="aiSaveBtn" style="margin-top:10px;">Save all to deck</button>`;

      readyCards=cards; updateSaveLabel();
      const makeCard=c=>{
        const base= c.type==='mcq'
          ? {id:uid(), type:'mcq', front:c.front, options:c.options, correctIndex:c.correctIndex, back:c.options[c.correctIndex], interval:0, ease:2.5, due:0, reps:0}
          : c.type==='fitb'
          ? {id:uid(), type:'fitb', front:c.front, answers:c.answers, back:c.answers[0], interval:0, ease:2.5, due:0, reps:0}
          : {id:uid(), type:'basic', front:c.front, back:c.back, interval:0, ease:2.5, due:0, reps:0};
        if(c.explain) base.explain=c.explain;
        if(c.key) base.key=c.key;
        return base;
      };
      // Adds the cards to the selected set (or a brand-new one) as new decks, split evenly.
      const commitAdd=newSetName=>{
        const isNew=sel.value==='__new';
        const fresh=freshFrom(cards);
        if(!fresh.length){ const m='Nothing new to add — every card is already in this set.'; document.getElementById('aiStatus').textContent=m; toast(m); return; }
        const per=parseInt(chunkSel.value,10)||20, n=Math.ceil(fresh.length/per), size=Math.ceil(fresh.length/n);
        const setId=isNew ? ensureSet(newSetName) : sel.value;
        const st=state.sets[setId];
        const used=new Set(Object.values(state.decks).map(d=>d.name));
        let part=setDeckIds(st).length;
        for(let i=0;i<n;i++){
          let name; do{ part++; name=`${st.name} · Part ${part}`; }while(used.has(name));
          used.add(name);
          const deckId=ensureDeck(name);
          state.decks[deckId].cards.push(...fresh.slice(i*size,(i+1)*size).map(makeCard));
          st.deckIds.push(deckId);
        }
        saveDecks();
        const skipped=cards.length-fresh.length;
        const m=`Added ${fresh.length} card(s) to "${st.name}" in ${n} new deck${n===1?'':'s'}${skipped?` (${skipped} duplicate${skipped===1?'':'s'} skipped)`:''}.`;
        document.getElementById('aiStatus').textContent=m; toast(m);
        readyCards=[]; nameInput.value=''; fillSetOptions(setId); syncNewUI();
        preview.innerHTML=''; renderDecks();
      };
      document.getElementById('aiSaveBtn').onclick=()=>{
        if(sel.value!=='__new'){ commitAdd(); return; }
        const typed=nameInput.value.trim();
        if(typed){ commitAdd(typed); return; }
        showPrompt('Name your new set','Give the set a name. Its decks will be called "Name · Part 1", "Name · Part 2" and so on.','e.g. Spanish Verbs','Save', commitAdd);
      };
    }catch(e){
      const msgs={
        parse:"The AI didn't return valid cards after a few tries. Try again, or add a bit more detail in the notes.",
        empty:"The AI didn't find anything new to turn into cards. Try adding more material or a different topic.",
        api:'Could not generate cards ('+e.message+'). Make sure GROQ_API_KEY is set on your host and try again.',
        limit:'Could not finish: '+e.message+'.'
      };
      document.getElementById('aiStatus').textContent = (e.kind==='empty' && e.message && e.message!=='empty') ? e.message : (msgs[e.kind] || ('Could not generate cards ('+e.message+').'));
    }
    stopBtn.classList.add('hidden');
    btn.disabled=false;
  };
}

/* ===== v2: smarter scheduling, XP/fun, AI Coach ===== */
const DAYMS=864e5, NEW_PER_DECK=10;
state.xp=state.xp||0;
function levelOf(xp){ return Math.floor(Math.sqrt(xp/40))+1; }
function cardOf(p){ const d=state.decks[p.deckId]; return d&&d.cards.find(c=>c.id===p.cardId); }
function schedule(card, rating, dry){
  const MIN=6e4,HR=36e5,DAY=DAYMS, old=card.interval||0;
  let ease=card.ease==null?2.5:card.ease, iv=old;
  if(rating===0){
    ease=Math.max(1.3,ease-0.2); card.lapses=(card.lapses||0)+1;
    if(old>=DAY) card.rl=Math.round(old*0.4);   // remember most of what you knew
    iv=10*MIN;
  } else if(card.rl){ iv=Math.round(card.rl*(rating===1?0.8:rating===2?1:1.5)); card.rl=0; }
  else if(old<DAY){ iv= rating===1?(old?DAY:8*HR) : rating===2?(old?2*DAY:DAY) : 4*DAY; }
  else iv=Math.round(old*(rating===1?1.2:rating===2?ease:ease*1.3));
  if(rating===1) ease=Math.max(1.3,ease-0.15);
  if(rating===3) ease=Math.min(3.0,ease+0.15);
  if(!dry && iv>3*DAY) iv=Math.round(iv*(0.95+Math.random()*0.1)); // fuzz so cards don't clump
  if(!dry && !(card.reps>0)) card.introDay=dayStr(new Date());
  card.ease=ease; card.interval=iv; card.due=Date.now()+iv; card.reps=(card.reps||0)+1;
}
function gradeIntervalLabel(card, rating){
  const c={...card}; schedule(c,rating,true); const ms=c.interval, MIN=6e4,HR=36e5;
  if(ms<HR) return `${Math.max(1,Math.round(ms/MIN))}m`;
  if(ms<DAYMS) return `${Math.max(1,Math.round(ms/HR))}h`;
  return `${Math.max(1,Math.round(ms/DAYMS))}d`;
}
// Brand-new cards are rationed (10 per deck per day) so a big import never means a giant "due" pile.
function dueCards(d){
  const now=Date.now(), today=dayStr(new Date());
  let room=Math.max(0,NEW_PER_DECK-d.cards.filter(c=>c.introDay===today).length);
  return d.cards.filter(c=>{ if(c.reps>0||c.due>now&&c.due) return c.due<=now; if(room>0){ room--; return true; } return false; });
}
function weakness(c){ const od=c.due?Math.max(0,Date.now()-c.due)/Math.max(c.interval||DAYMS,DAYMS):0.5; return od+(2.5-(c.ease==null?2.5:c.ease))+(c.lapses||0)*0.3; }

function buildAssignment(deckIds, count){

const _advance=advanceCard;
advanceCard=function(card, rating){

state.plans=state.plans||[];

function daysSince(day){ return Math.max(0,Math.round((new Date(dayStr(new Date())+'T00:00')-new Date(day+'T00:00'))/DAYMS)); }
function planDeck(p){ return state.decks[p.deckId]; }
function planOfDeck(d){ return (state.plans||[]).find(p=>p.deckId===d.id); }
// New cards per day = what's left divided by days left, so missing a day spreads the work out instead of piling it up.
function planPerDay(p){
