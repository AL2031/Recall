      <p class="sub">${intro} of ${p.total} cards learned · about ${planPerDay(p)} new today. Miss a day and the rest spreads out automatically.</p>
      ${intro>=p.total?'<p>🎉 Plan complete! Keep reviewing to lock it in.</p>':''}
      <div class="today-actions">${busy?'<button class="btn" disabled>Preparing today’s cards…</button>':`<button class="btn btn-lg" data-plan-go="${p.id}">Start today</button><button class="btn secondary" data-plan-go="${p.id}" data-lim="10">Just 10 cards</button><button class="btn secondary" data-plan-del="${p.id}">Delete</button>`}</div></section>`;
  }).join('');
}
/* ===== v4: custom time + reliable month-long plans over one or many decks ===== */
function parseMins(t){ const m=String(t).toLowerCase().trim().match(/^(\d+(?:\.\d+)?)\s*(h|hr|hrs|hour|hours|m|min|mins|minute|minutes)?$/); if(!m) return 0; let n=+m[1]; if((m[2]||'')[0]==='h') n*=60; return Math.max(1,Math.min(600,Math.round(n))); }
function fmtMins(m){ return m<60?`${m} min`:m%60?`${Math.floor(m/60)} hr ${m%60} min`:`${m/60} hr`; }
function coachMins(){ return state.coachMins||10; }
function detectDays(g){
  g=g.toLowerCase(); const u={day:1,week:7,month:30,year:365}, w={a:1,one:1,two:2,three:3,four:4,five:5,six:6,couple:2,few:3};
  let m=g.match(/(\d+(?:\.\d+)?)\s*[- ]?(day|week|month|year)s?/); if(m) return Math.round(+m[1]*u[m[2]]);
  m=g.match(/\b(a|one|two|three|four|five|six|couple of|few)\s+(day|week|month)s?\b/); if(m) return (w[m[1].split(' ')[0]]||1)*u[m[2]];
  if(/\bmonth\b/.test(g)) return 30; if(/\bweek\b/.test(g)) return 7; return 0;
}
function planDecks(p){ return (p.deckIds||[p.deckId]).map(id=>state.decks[id]).filter(Boolean); }
function planDeck(p){ return planDecks(p)[0]; }
function planOfDeck(d){ return (state.plans||[]).find(p=>(p.deckIds||[p.deckId]).includes(d.id)); }
function planTotal(p){ return p.topics?p.total:planDecks(p).reduce((n,d)=>n+d.cards.length,0); }
function planPerDay(p){
  const ds=planDecks(p); if(!ds.length) return 0; const today=dayStr(new Date());
  const before=ds.reduce((n,d)=>n+d.cards.filter(c=>c.reps>0&&c.introDay!==today).length,0);
  return Math.max(0,Math.min(p.topics?60:200,Math.ceil((planTotal(p)-before)/Math.max(1,p.days-daysSince(p.start)))));
}
function dueCards(d){
  const now=Date.now(), today=dayStr(new Date()), p=planOfDeck(d);
  const lim=p?Math.ceil(planPerDay(p)*d.cards.length/Math.max(1,planDecks(p).reduce((n,x)=>n+x.cards.length,0))):NEW_PER_DECK;
  let room=Math.max(0,lim-d.cards.filter(c=>c.introDay===today).length);
  return d.cards.filter(c=>{ if(c.reps>0||(c.due&&c.due>now)) return c.due<=now; if(room>0){ room--; return true; } return false; });
}
async function coachAsk(goal, minutes, span){
  return aiJson(`Student goal: "${goal}"\nTime available per session: ${fmtMins(minutes)} (about ${minutes*3} cards).\nTheir decks: ${JSON.stringify(coachDecksSummary())}\n\nReturn {"title":"short assignment name","message":"1-2 encouraging sentences","deckIds":["ids of existing decks that fit the goal, or []"],"count":cards for one session (${Math.max(5,minutes*2)}-${minutes*3}),"newDeck":null or {"name":"","cards":[{"front":"","back":""${state.coachExplain?',"explain":"1-2 sentence why"':''}}]},"plan":null}.\n${span?`The student wants a PLAN spanning ${span} days. Set newDeck null and plan = {"name":"plan name","days":${span},"totalCards":number,"deckIds":["existing deck ids to spread over the days; [] if the goal needs new material"],"topics":["one short topic per day, easy to hard, up to 60 items (only needed when deckIds is [])"]}. Use existing decks whenever they fit the goal.`:'If the goal is a topic their decks don\'t cover, set newDeck with 10 beginner cards and deckIds []. If it spans several days or weeks, set plan as {"name","days","totalCards","deckIds":[],"topics":[]}, otherwise keep plan null.'}`, 3500);
}
function createPlan(pl, goal){
  let ids=(pl.deckIds||[pl.deckId]).filter(id=>id&&state.decks[id]); const gen=!ids.length||!ids.some(id=>state.decks[id].cards.length);
  const days=Math.max(2,Math.min(90,Math.round(+pl.days)||30));
  const total=gen?Math.max(10,Math.min(2000,Math.round(+pl.totalCards)||days*10)):0;
  if(gen) ids=[ensureDeck(pl.name||goal.slice(0,40))];
  let topics=gen?(pl.topics||[]).map(String).filter(Boolean):null; if(gen&&!topics.length) topics=[goal];
  const p={id:uid(),name:pl.name||goal.slice(0,40),goal,deckId:ids[0],deckIds:ids,total,days,start:dayStr(new Date()),topics,next:0};
  state.plans.push(p); saveDecks(); return p;
}
async function makeAssignment(goal, minutes){
  const btn=document.getElementById('coachGo'); if(btn){ btn.disabled=true; btn.textContent='Planning…'; }
  try{
    const span=detectDays(goal), r=await coachAsk(goal,minutes,span);
    if(span>1||(r.plan&&+r.plan.days>1)){
      const pl=r.plan&&+r.plan.days>1?r.plan:{name:r.title,deckIds:r.deckIds,totalCards:span*Math.max(10,minutes*2)};
      if(span>1) pl.days=span; if(!pl.deckIds&&pl.deckId) pl.deckIds=[pl.deckId]; if(!(pl.deckIds||[]).length&&r.deckIds&&span>1&&!r.newDeck) pl.deckIds=r.deckIds;
      const p=createPlan(pl,goal); planBusy=p.id; renderCoach();
      await ensurePlanCards(p).catch(e=>toast('Plan saved, but today’s cards didn’t generate: '+e.message));
      planBusy=null; const est=Math.ceil(planPerDay(p)/3);
      toast(`Plan ready: ${planTotal(p)} cards over ${p.days} days (about ${fmtMins(est)} a day).`+(est>minutes*1.5?' That’s more than your chosen time. Try more days or fewer cards.':''),'success'); renderCoach(); return;
    }
    let ids=(r.deckIds||[]).filter(id=>state.decks[id]);
    if(r.newDeck&&Array.isArray(r.newDeck.cards)&&r.newDeck.cards.length){
      const id=ensureDeck(r.newDeck.name||goal.slice(0,40));
      r.newDeck.cards.forEach(c=>{ if(c.front&&c.back) state.decks[id].cards.push({id:uid(),type:'basic',front:String(c.front),back:String(c.back),...(c.explain?{explain:String(c.explain)}:{}),interval:0,ease:2.5,due:0,reps:0}); });
      saveDecks(); ids=[id];
    }
    if(!ids.length) ids=Object.keys(state.decks);
    setAssignment(r.title||'Today’s assignment', r.message||'Let’s do a few cards.', buildAssignment(ids,Math.max(3,Math.min(minutes*3,400,Number(r.count)||minutes*2))));
  }catch(e){ planBusy=null; toast('Couldn’t reach the coach: '+(e.message||'error')); renderCoach(); }
}
async function startPlan(id, limit){
  const p=state.plans.find(x=>x.id===id); if(!p||!planDeck(p)) return;
  planBusy=id; renderCoach();
  try{ await ensurePlanCards(p); }catch(e){ toast('Couldn’t make today’s cards: '+e.message); }
  planBusy=null; renderCoach();
  const items=planDecks(p).flatMap(d=>dueCards(d).map(c=>({cardId:c.id,deckId:d.id}))); smartSort(items);
  if(!items.length){ toast('You’re finished for today. Nice work! 🎉'); return; }
  startQueue(items.slice(0,limit||Math.max(80,planPerDay(p)+50)), p.name);
}
function plansHtml(){
  return state.plans.map(p=>{
    const ds=planDecks(p); if(!ds.length) return '';
    const total=planTotal(p), intro=ds.reduce((n,d)=>n+d.cards.filter(c=>c.reps>0).length,0), pct=Math.min(100,Math.round(100*intro/Math.max(1,total))), di=daysSince(p.start), busy=planBusy===p.id;
    const base=Math.ceil(total/p.days), rows=Array.from({length:p.days},(_,i)=>{ const dt=new Date(p.start+'T00:00'); dt.setDate(dt.getDate()+i);
      const t=p.topics?p.topics[Math.min(p.topics.length-1,Math.floor(i*p.topics.length/p.days))]:`about ${base} new cards`;
      return `<li${i===di?' style="font-weight:700"':''}>${i<di?'✓ ':''}${dt.toLocaleDateString(undefined,{month:'short',day:'numeric'})} · ${escapeHtml(t)}</li>`; }).join('');
    return `<section class="card plan"><div class="block-title">Plan · day ${Math.min(p.days,di+1)} of ${p.days}</div><h3>${escapeHtml(p.name)}</h3><div class="xp-bar"><span style="width:${pct}%"></span></div>
      <p class="sub">${intro} of ${total} cards learned · about ${planPerDay(p)} new today (≈${fmtMins(Math.max(1,Math.ceil(planPerDay(p)/3)))}). Miss a day and the rest spreads out automatically.</p>
      ${intro>=total&&total?'<p>🎉 Plan complete! Keep reviewing to lock it in.</p>':''}
      <div class="today-actions">${busy?'<button class="btn" disabled>Preparing today’s cards…</button>':`<button class="btn btn-lg" data-plan-go="${p.id}">Start today</button><button class="btn secondary" data-plan-go="${p.id}" data-lim="10">Just 10 cards</button><button class="btn secondary" data-plan-del="${p.id}">Delete</button>`}</div>
      <details class="plan-days"><summary>See the whole schedule</summary><ol>${rows}</ol></details></section>`;
  }).join('');
}

/* ===== v5: explanations (generate with a checkbox, add to existing decks/sets, show while studying) ===== */
let explaining=false;
async function explainCards(cards, onProgress){
  const todo=cards.filter(c=>!c.explain); let done=0;
  for(let i=0;i<todo.length;i+=15){
    const batch=todo.slice(i,i+15), items=batch.map((c,k)=>({i:k,q:c.front,a:cardAnswerText(c)}));
    let r=null;
    for(let t=0;t<3&&!r;t++){
      try{ r=await aiJson(`For each flashcard, write a clear 1-2 sentence explanation of WHY the answer is correct or the idea behind it, in plain language a student can learn from. Stay general if you are unsure of a detail. Cards: ${JSON.stringify(items)}\nReturn {"explanations":[{"i":number,"e":"text"}]}`,3000,'You are a clear, accurate tutor. Reply with ONLY a JSON object, no markdown.'); }
      catch(e){ if(t===2){ e.done=done; throw e; } await new Promise(res=>setTimeout(res,6000*(t+1))); }
    }
    (r.explanations||[]).forEach(x=>{ const c=batch[x.i]; if(c&&x.e){ c.explain=String(x.e).trim(); done++; } });
    if(onProgress) onProgress(Math.min(i+15,todo.length),todo.length);
  }
  return done;
}
// id may be a deck or a whole set
async function addExplanations(id){
  if(explaining){ toast('Already writing explanations. Hang tight.'); return; }
  const todo=exportSource(id).cards.filter(c=>!c.explain);
  if(!todo.length){ toast('Every card already has an explanation.'); return; }
  explaining=true; toast(`Writing explanations for ${todo.length} card${todo.length===1?'':'s'}…`);
  try{ const n=await explainCards(todo,(a,b)=>{ saveDecks(); toast(`Explaining ${a}/${b}…`); }); saveDecks(); toast(`Added ${n} explanation${n===1?'':'s'}.`,'success'); }
  catch(e){ saveDecks(); toast(`Stopped after ${e.done||0} (${e.message}). Press the button again to continue.`); }
  explaining=false; renderDecks();
}
const _renderStudy2=renderStudy;
renderStudy=function(){
  _renderStudy2();
  const s=studySession; if(!s||!s.showBack||s.pos>=s.queue.length) return;
  const qi=s.queue[s.pos], d=state.decks[qi.deckId], c=d&&d.cards.find(x=>x.id===qi.cardId), gr=document.getElementById('gradeRow'); if(!c||!gr) return;
  gr.insertAdjacentHTML('beforebegin', c.explain?`<div class="explain-box"><b>💡 Why</b><p>${escapeHtml(c.explain)}</p></div>`:`<button class="btn secondary explain-btn" id="explainOne">💡 Explain this card</button>`);
  const b=document.getElementById('explainOne');
  if(b) b.onclick=async()=>{ b.disabled=true; b.textContent='Thinking…'; try{ await explainCards([c]); saveDecks(); renderStudy(); }catch(e){ b.disabled=false; b.textContent='💡 Explain this card'; toast('Couldn’t explain that: '+e.message); } };
};

const _renderCoach=renderCoach;
renderCoach=function(){
  _renderCoach();
  const el=document.getElementById('tab-coach'), html=plansHtml();
  if(html) el.querySelectorAll('.coach > section')[1].insertAdjacentHTML('afterend',html);
  el.querySelectorAll('[data-plan-go]').forEach(b=>b.onclick=()=>startPlan(b.dataset.planGo,b.dataset.lim?+b.dataset.lim:null));
  el.querySelectorAll('[data-plan-del]').forEach(b=>b.onclick=()=>showConfirm('Delete this plan?','Your cards and progress stay in the deck. Only the schedule is removed.',()=>{ state.plans=state.plans.filter(p=>p.id!==b.dataset.planDel); saveDecks(); renderCoach(); }));
};

const renderers={coach:renderCoach, study:renderStudy, decks:renderDecks, import:renderImport, ai:renderAI};
document.getElementById('tabs').addEventListener('click', e=>{
  const b=e.target.closest('button[data-tab]'); if(!b) return;
