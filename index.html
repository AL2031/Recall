<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Recall — Flashcards</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.9.0/mammoth.browser.min.js"></script>
<style>
:root{--bg:#eeede9;--panel:#fff;--text:#1a1917;--sub:#69675f;--border:#dedcd4;--accent:#81b64c;--accent-dark:#6a9c3f;--accent-soft:rgba(129,182,76,.15);--ink:#fff;--danger:#c2392f;--hard:#d9a23b;--easy:#4c8bf5;--header-bg:#262421;--header-ink:#e9e8e4;--header-sub:#9c9a94;}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#171614;--panel:#211f1c;--text:#eae9e5;--sub:#a3a099;--border:#33312c;--header-bg:#1a1917;--accent-soft:rgba(129,182,76,.18);}}
:root[data-theme="dark"]{--bg:#171614;--panel:#211f1c;--text:#eae9e5;--sub:#a3a099;--border:#33312c;--header-bg:#1a1917;--accent-soft:rgba(129,182,76,.18);}
*{box-sizing:border-box;}
body{margin:0;background:var(--bg);color:var(--text);font-family:'Space Grotesk',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;}
header{position:sticky;top:0;padding:12px 16px;background:var(--header-bg);border-bottom:3px solid var(--accent);z-index:5;}
.brand{display:flex;align-items:center;gap:9px;margin-bottom:10px;}
.logo-badge{flex:none;width:26px;height:26px;border-radius:7px;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;}
.logo-badge svg{width:16px;height:16px;}
h1{margin:0;font-size:19px;font-weight:800;letter-spacing:.2px;color:var(--header-ink);}
nav{display:flex;gap:4px;overflow-x:auto;}
nav button{display:inline-flex;align-items:center;gap:6px;border:none;background:transparent;color:var(--header-sub);padding:8px 14px;border-radius:3px;font-size:14px;font-weight:600;white-space:nowrap;cursor:pointer;font-family:inherit;}
nav button svg{width:15px;height:15px;flex:none;}
nav button:hover{background:rgba(255,255,255,.08);color:var(--header-ink);}
nav button.active{background:var(--accent);color:#fff;}
main{padding:16px;max-width:720px;margin:0 auto;padding-bottom:60px;}
.card{background:var(--panel);border:1px solid var(--border);border-radius:4px;padding:16px;margin-bottom:12px;box-shadow:0 1px 2px rgba(0,0,0,.06);}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;}
button.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--accent);color:var(--ink);border:none;border-bottom:3px solid var(--accent-dark);padding:10px 16px;border-radius:3px;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit;}
button.btn svg{width:15px;height:15px;flex:none;}
button.btn:hover{background:var(--accent-dark);}
button.btn.secondary{background:transparent;color:var(--accent-dark);border:1px solid var(--border);border-bottom:1px solid var(--border);}
button.btn.danger{background:transparent;color:var(--danger);border:1px solid var(--danger);border-bottom:1px solid var(--danger);}
button.btn:disabled{opacity:.5;cursor:default;}
button.btn.grade-again{background:var(--danger);border-bottom-color:#8f2a22;}
button.btn.grade-hard{background:var(--hard);border-bottom-color:#a97a1f;}
button.btn.grade-good{background:var(--accent);border-bottom-color:var(--accent-dark);}
button.btn.grade-easy{background:var(--easy);border-bottom-color:#2e63c4;}
input,textarea,select{width:100%;padding:10px;border-radius:3px;border:1px solid var(--border);background:var(--bg);color:var(--text);font-size:14px;font-family:inherit;}
textarea{min-height:100px;resize:vertical;}
label{font-size:13px;color:var(--sub);font-weight:600;display:block;margin:10px 0 4px;}
.sub{color:var(--sub);font-size:13px;}
.hidden{display:none!important;}
.study-card{min-height:220px;display:flex;align-items:center;justify-content:center;text-align:center;font-size:19px;font-weight:600;padding:30px 16px;cursor:pointer;background:var(--bg);border-radius:3px;}
.grade-row{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:14px;}
.grade-row button{padding:12px 4px;font-size:13px;color:#fff;}
.deck-list-item{display:flex;justify-content:space-between;align-items:center;padding:12px 4px;}
.deck-list-item+.deck-list-item{border-top:1px solid var(--border);}
.chip{background:var(--accent);color:#fff;border-radius:3px;padding:2px 8px;font-size:12px;font-weight:700;}
.overflow-x{overflow-x:auto;}
table{width:100%;border-collapse:collapse;font-size:13px;}
td,th{border-bottom:1px solid var(--border);padding:6px;text-align:left;vertical-align:top;}
th{color:var(--sub);font-weight:700;}
.spinner{display:inline-block;width:14px;height:14px;border:2px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .7s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
.filelist{font-size:13px;margin-top:6px;}
.filelist span{display:inline-block;background:var(--bg);border:1px solid var(--border);border-radius:3px;padding:2px 8px;margin:2px 4px 0 0;}
details summary{font-weight:700;color:var(--accent-dark);}
.row{flex-wrap:wrap;}
.mcq-options{display:flex;flex-direction:column;gap:8px;margin-top:14px;}
.mcq-opt{width:100%;text-align:left;padding:12px 14px;border-radius:3px;border:1px solid var(--border);background:var(--panel);color:var(--text);font-size:14px;font-family:inherit;cursor:pointer;}
.mcq-opt:hover:not(:disabled){border-color:var(--accent);}
.mcq-opt:disabled{cursor:default;}
.mcq-opt.correct{background:var(--accent);color:#fff;border-color:var(--accent-dark);}
.mcq-opt.wrong{background:var(--danger);color:#fff;border-color:#8f2a22;}
.type-toggle{display:flex;gap:6px;margin:10px 0;}
.type-toggle button{flex:1;padding:8px;border:1px solid var(--border);background:var(--panel);color:var(--sub);border-radius:3px;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;}
.type-toggle button.active{background:var(--accent);color:#fff;border-color:var(--accent-dark);}
.opt-row{display:flex;align-items:center;gap:8px;margin-bottom:6px;}
.opt-row input[type=radio]{width:auto;flex:none;}
.opt-row input[type=text]{flex:1;}
.fitb-feedback{margin-top:12px;font-weight:700;text-align:center;}
.fitb-feedback.correct{color:var(--accent-dark);}
.fitb-feedback.wrong{color:var(--danger);}
.fitb-answers{font-weight:400;color:var(--sub);font-size:13px;margin-top:2px;}
.panel-header-row{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap;margin-bottom:16px;}
.panel-header{display:flex;align-items:flex-start;gap:13px;}
.panel-icon{flex:none;width:42px;height:42px;border-radius:10px;background:var(--accent-soft);color:var(--accent-dark);display:flex;align-items:center;justify-content:center;}
.panel-icon svg{width:21px;height:21px;}
.panel-title{font-size:17px;font-weight:800;margin:0 0 2px;}
.panel-sub{font-size:13px;color:var(--sub);margin:0;max-width:46ch;}
.back-link{display:inline-flex;align-items:center;gap:6px;background:none;border:none;color:var(--sub);font-size:13px;font-weight:600;cursor:pointer;padding:4px 0;font-family:inherit;}
.back-link:hover{color:var(--accent-dark);}
.back-link svg{width:14px;height:14px;}
.empty-state{display:flex;flex-direction:column;align-items:center;text-align:center;padding:36px 16px 20px;}
.empty-illustration{position:relative;width:110px;height:110px;border-radius:50%;border:2px dashed var(--border);display:flex;align-items:center;justify-content:center;margin-bottom:18px;}
.empty-illustration .ei-card{color:var(--accent);width:44px;height:44px;}
.empty-illustration .ei-spark{position:absolute;color:var(--accent);width:16px;height:16px;}
.empty-illustration .ei-spark.a{top:6px;right:10px;}
.empty-illustration .ei-spark.b{bottom:14px;left:2px;width:11px;height:11px;}
.empty-state h3{margin:0 0 6px;font-size:17px;font-weight:800;}
.empty-state p{margin:0;color:var(--sub);font-size:13px;max-width:34ch;}
.dropzone{border:1.5px dashed var(--border);border-radius:6px;padding:16px;display:flex;align-items:center;gap:12px;background:var(--bg);}
.dropzone svg{flex:none;width:20px;height:20px;color:var(--sub);}
.dropzone-btn{flex:none;background:var(--panel);border:1px solid var(--border);color:var(--text);font-size:13px;font-weight:700;padding:7px 12px;border-radius:3px;cursor:pointer;font-family:inherit;}
.dropzone-label{font-size:13px;color:var(--sub);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.type-toggle button{display:flex;flex-direction:row;align-items:center;justify-content:center;gap:7px;padding:10px 8px;}
.type-toggle button svg{width:16px;height:16px;flex:none;}
.deck-row{display:flex;align-items:center;gap:12px;padding:12px 4px;}
.deck-row+.deck-row{border-top:1px solid var(--border);}
.deck-row-icon{flex:none;width:36px;height:36px;border-radius:8px;background:var(--accent-soft);color:var(--accent-dark);display:flex;align-items:center;justify-content:center;}
.deck-row-icon svg{width:18px;height:18px;}

/* UX refresh */
html{scroll-behavior:smooth;}
body{min-height:100vh;line-height:1.45;}
header{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:18px;padding:10px 18px;border-bottom:2px solid var(--accent);box-shadow:0 4px 18px rgba(0,0,0,.10);}
.brand{margin:0;}
nav{min-width:0;justify-content:center;}
nav button{min-height:38px;padding:8px 12px;border-radius:8px;transition:background .16s ease,color .16s ease,transform .16s ease;}
nav button:active{transform:translateY(1px);}
.header-actions{display:flex;align-items:center;gap:8px;}
.icon-btn{width:38px;height:38px;display:inline-flex;align-items:center;justify-content:center;border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.06);color:var(--header-ink);border-radius:9px;cursor:pointer;font-family:inherit;}
.icon-btn:hover{background:rgba(255,255,255,.12);}
.icon-btn svg{width:18px;height:18px;}
main{max-width:880px;padding:24px 18px 80px;}
.card{border-radius:14px;padding:20px;margin-bottom:14px;box-shadow:0 8px 24px rgba(0,0,0,.045);}
.panel-icon{width:44px;height:44px;border-radius:12px;}
.panel-title{font-size:19px;}
.panel-sub{line-height:1.45;}
button.btn{min-height:42px;border-radius:9px;transition:transform .14s ease,box-shadow .14s ease,background .14s ease;}
button.btn:hover:not(:disabled){transform:translateY(-1px);box-shadow:0 5px 14px rgba(0,0,0,.10);}
button.btn.secondary,button.btn.danger{background:var(--panel);}
input,textarea,select{border-radius:9px;min-height:42px;transition:border-color .15s ease,box-shadow .15s ease,background .15s ease;}
textarea{min-height:120px;}
input:focus,textarea:focus,select:focus,button:focus-visible,.mcq-opt:focus-visible,.dropzone:focus-within{outline:2px solid var(--accent);outline-offset:2px;border-color:var(--accent);box-shadow:0 0 0 4px var(--accent-soft);}
label{margin-top:14px;}
.row{gap:10px;}
.chip{border-radius:999px;padding:4px 9px;}
.study-card{min-height:300px;border-radius:14px;margin-top:12px;padding:42px 26px;font-size:clamp(20px,3vw,28px);line-height:1.35;box-shadow:inset 0 0 0 1px var(--border);transition:transform .15s ease,box-shadow .15s ease,background .15s ease;}
.study-card:hover{transform:translateY(-1px);box-shadow:inset 0 0 0 1px var(--accent),0 10px 24px rgba(0,0,0,.06);}
.study-helper{text-align:center;margin:9px 0 0;}
.study-top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:8px;}
.study-progress{height:7px;background:var(--border);border-radius:999px;overflow:hidden;margin:4px 0 14px;}
.study-progress > span{display:block;height:100%;background:var(--accent);border-radius:999px;transition:width .2s ease;}
.study-meta{display:flex;flex-wrap:wrap;gap:8px;align-items:center;}
.study-exit{font-size:13px;font-weight:700;color:var(--sub);background:none;border:0;padding:6px 0;cursor:pointer;font-family:inherit;}
.study-exit:hover{color:var(--danger);}
.grade-row{gap:9px;margin-top:16px;}
.grade-row button{min-height:58px;border-radius:11px;display:flex;flex-direction:column;line-height:1.15;}
.grade-row .grade-label{font-size:14px;font-weight:800;}
.grade-row .grade-time{opacity:.86;font-size:11px;margin-top:4px;font-weight:600;}
.mcq-options{gap:10px;}
.mcq-opt{min-height:52px;border-radius:10px;padding:13px 15px;font-weight:600;transition:border-color .14s ease,transform .14s ease,background .14s ease;}
.mcq-opt:hover:not(:disabled){transform:translateX(2px);}
.type-toggle{background:var(--bg);padding:4px;border-radius:11px;border:1px solid var(--border);gap:4px;}
.type-toggle button{border:0;border-radius:8px;min-height:42px;}
.type-toggle button.active{box-shadow:0 3px 10px rgba(0,0,0,.10);}
.deck-row{padding:14px 4px;align-items:flex-start;}
.deck-row-icon{width:42px;height:42px;border-radius:11px;}
.deck-actions{display:flex;gap:6px;align-items:center;justify-content:flex-end;flex-wrap:wrap;}
.deck-actions .btn{min-height:36px;padding:8px 10px;font-size:12px;}
.deck-list-item{padding:13px 4px;align-items:flex-start;gap:10px;}
.empty-state{padding:42px 18px 28px;}
.empty-actions{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:18px;}
.dropzone{border-radius:11px;padding:14px;min-height:62px;transition:border-color .15s ease,background .15s ease,transform .15s ease;}
.dropzone.is-dragover{border-color:var(--accent);background:var(--accent-soft);transform:scale(1.005);}
.dropzone-btn{min-height:38px;border-radius:8px;}
.filelist span{border-radius:999px;padding:4px 9px;}
.import-tip{padding:10px 12px;margin-top:10px;border:1px solid var(--border);border-radius:9px;background:var(--accent-soft);}
.deck-filter{display:flex;gap:8px;align-items:center;margin-top:10px;}
.deck-filter input{margin:0;}
.dashboard-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:16px 0;}
.stat-card{padding:14px;border:1px solid var(--border);border-radius:11px;background:var(--bg);}
.stat-value{font-size:24px;font-weight:800;line-height:1.1;}
.stat-label{font-size:12px;color:var(--sub);margin-top:4px;}
.quick-deck{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:13px 0;border-top:1px solid var(--border);}
.quick-deck:first-of-type{border-top:0;}
.toast{position:fixed;left:50%;bottom:24px;z-index:20;transform:translate(-50%,18px);opacity:0;pointer-events:none;background:var(--header-bg);color:var(--header-ink);border:1px solid rgba(255,255,255,.10);box-shadow:0 14px 34px rgba(0,0,0,.22);padding:11px 14px;border-radius:10px;font-size:13px;font-weight:700;transition:opacity .18s ease,transform .18s ease;max-width:min(92vw,520px);text-align:center;}
.toast.show{opacity:1;transform:translate(-50%,0);}
.modal-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.48);z-index:30;display:flex;align-items:center;justify-content:center;padding:18px;}
.modal{width:min(100%,460px);background:var(--panel);border:1px solid var(--border);border-radius:16px;padding:20px;box-shadow:0 24px 60px rgba(0,0,0,.25);}
.modal h3{margin:0 0 6px;font-size:18px;}
.modal p{margin:0;color:var(--sub);font-size:13px;}
.modal-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:18px;}
.modal input{margin-top:14px;}
.modal .modal-error{color:var(--danger);font-size:12px;margin:6px 0 0;min-height:16px;}
.modal #modalConfirm{background:var(--danger);color:#fff;border-color:var(--danger);border-bottom-color:#8f2a22;}
.kbd{display:inline-flex;align-items:center;justify-content:center;min-width:22px;height:22px;padding:0 6px;border:1px solid var(--border);border-bottom-width:2px;border-radius:6px;background:var(--panel);font-size:11px;font-weight:800;color:var(--sub);}
.study-shortcuts{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;color:var(--sub);font-size:11px;margin-top:12px;}
@media (max-width:720px){
  header{grid-template-columns:1fr auto;gap:8px;padding:9px 12px;}
  nav{grid-column:1/-1;grid-row:2;justify-content:flex-start;border-top:1px solid rgba(255,255,255,.08);padding-top:6px;}
  nav button{padding:8px 11px;}
  main{padding:16px 12px 72px;}
  .card{padding:16px;border-radius:12px;}
  .dashboard-grid{grid-template-columns:1fr 1fr;}
  .grade-row{grid-template-columns:1fr 1fr;}
  .study-card{min-height:240px;padding:32px 18px;}
  .deck-actions{width:100%;justify-content:flex-start;margin-top:8px;}
  .panel-header-row{align-items:stretch;}
  .panel-header-row > .btn{width:100%;}
}
@media (max-width:460px){
  .dashboard-grid{grid-template-columns:1fr;}
  .type-toggle{display:grid;grid-template-columns:1fr 1fr;}
  .grade-row button{min-height:54px;}
  .study-top{align-items:flex-start;}
}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important;animation:none!important;}}

/* Card-count control (AI tab) */
.type-toggle.count-toggle{display:flex;}
.count-fields{display:flex;gap:10px;margin-top:10px;}
.count-fields > div{flex:1;min-width:0;}
.count-fields label{margin-top:0;}
.count-hint{margin:8px 0 0;font-size:13px;color:var(--sub);}
.count-hint.error{color:var(--danger);font-weight:600;}
input.invalid{border-color:var(--danger);}


/* ================================================================
   RECALL REDESIGN — calmer surfaces, clearer hierarchy, responsive UI
   ================================================================ */
:root{
  color-scheme:light;
  --bg:#f5f6fb;--panel:#ffffff;--text:#20243a;--sub:#737991;--border:#e5e7f0;
  --accent:#6d5ce8;--accent-dark:#5543cf;--accent-soft:rgba(109,92,232,.11);--ink:#fff;
  --danger:#d94b56;--hard:#e7a23c;--easy:#3887ef;--header-bg:rgba(255,255,255,.92);
  --header-ink:#20243a;--header-sub:#737991;--shadow:0 12px 35px rgba(28,35,71,.055);
}
:root[data-theme="dark"]{
  color-scheme:dark;--bg:#11131c;--panel:#191c29;--text:#f1f2fc;--sub:#a0a6bf;--border:#2d3144;
  --accent:#9b8cff;--accent-dark:#8170f1;--accent-soft:rgba(155,140,255,.15);--ink:#fff;
  --danger:#ff737d;--hard:#edb65f;--easy:#69a8ff;--header-bg:rgba(25,28,41,.94);
  --header-ink:#f1f2fc;--header-sub:#a0a6bf;--shadow:0 12px 35px rgba(0,0,0,.16);
}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){
  color-scheme:dark;--bg:#11131c;--panel:#191c29;--text:#f1f2fc;--sub:#a0a6bf;--border:#2d3144;
  --accent:#9b8cff;--accent-dark:#8170f1;--accent-soft:rgba(155,140,255,.15);--ink:#fff;
  --danger:#ff737d;--hard:#edb65f;--easy:#69a8ff;--header-bg:rgba(25,28,41,.94);
  --header-ink:#f1f2fc;--header-sub:#a0a6bf;--shadow:0 12px 35px rgba(0,0,0,.16);
}}
html{scroll-padding-top:90px;}
body{background:var(--bg);color:var(--text);font-size:14px;line-height:1.55;}
header{position:sticky;top:0;grid-template-columns:auto minmax(0,1fr) auto;gap:clamp(14px,3vw,42px);padding:12px clamp(16px,4vw,48px);background:var(--header-bg);border-bottom:1px solid var(--border);box-shadow:0 5px 22px rgba(25,31,68,.045);backdrop-filter:blur(18px);}
.brand{gap:11px;}
.logo-badge{width:38px;height:38px;border-radius:12px;background:linear-gradient(145deg,#8273ff,#5d4ad4);box-shadow:0 7px 16px rgba(109,92,232,.24);}
.logo-badge svg{width:21px;height:21px;}
h1{color:var(--header-ink);font-size:21px;letter-spacing:-.7px;font-weight:800;}
nav{gap:5px;justify-content:flex-start;}
nav button{min-height:42px;padding:9px 13px;border-radius:12px;color:var(--header-sub);font-size:13px;font-weight:700;}
nav button.active{background:var(--accent-soft);color:var(--accent);box-shadow:inset 0 0 0 1px rgba(109,92,232,.08);}
nav button.active svg{color:var(--accent);}
nav button:hover:not(.active){background:rgba(125,129,155,.09);color:var(--header-ink);}
.header-actions{gap:12px;}
.header-streak{display:flex;align-items:center;gap:5px;padding:8px 11px;border:1px solid #f7d8be;background:#fff7ed;color:#aa5422;border-radius:999px;font-size:12px;font-weight:700;white-space:nowrap;}
.header-streak strong{font-size:14px;color:#9d4318;}
.icon-btn{width:40px;height:40px;color:var(--header-ink);background:var(--bg);border:1px solid var(--border);border-radius:12px;}
.icon-btn:hover{background:var(--accent-soft);border-color:var(--accent);}
main{max-width:1200px;padding:30px clamp(14px,3vw,32px) 88px;margin:0 auto;}
.card{background:var(--panel);border:1px solid var(--border);border-radius:20px;padding:24px;margin:0;box-shadow:var(--shadow);}
.panel-header{align-items:center;gap:14px;margin-bottom:22px;}
.panel-icon{width:48px;height:48px;border-radius:15px;background:var(--accent-soft);color:var(--accent);}
.panel-icon svg{width:23px;height:23px;}
.panel-title{font-size:21px;letter-spacing:-.55px;font-weight:800;color:var(--text);}
.panel-sub{font-size:13px;max-width:54ch;}
button.btn{min-height:43px;padding:10px 16px;border:1px solid transparent;border-radius:12px;background:var(--accent);border-bottom:1px solid var(--accent-dark);font-size:13px;font-weight:800;box-shadow:0 4px 10px rgba(109,92,232,.12);}
button.btn:hover:not(:disabled){background:var(--accent-dark);box-shadow:0 7px 17px rgba(109,92,232,.2);}
button.btn.secondary{background:var(--panel);color:var(--text);border:1px solid var(--border);box-shadow:none;}
button.btn.secondary:hover:not(:disabled){background:var(--accent-soft);color:var(--accent);border-color:rgba(109,92,232,.32);}
button.btn.danger{color:var(--danger);background:var(--panel);border-color:rgba(217,75,86,.28);box-shadow:none;}
button.btn:disabled{box-shadow:none;}
input,textarea,select{min-height:44px;padding:11px 13px;border-radius:11px;border:1px solid var(--border);background:var(--panel);font-size:14px;}
textarea{min-height:145px;line-height:1.6;}
input:focus,textarea:focus,select:focus,button:focus-visible,.mcq-opt:focus-visible,.dropzone:focus-within{outline:none;border-color:var(--accent);box-shadow:0 0 0 4px var(--accent-soft);}
label{font-size:12px;letter-spacing:.01em;font-weight:800;color:var(--text);margin:17px 0 7px;}
.sub{font-size:12px;line-height:1.55;}
.chip{background:var(--accent-soft);color:var(--accent);border-radius:999px;padding:5px 10px;font-size:11px;}
.study-card{min-height:310px;background:linear-gradient(145deg,var(--bg),var(--panel));border:1px solid var(--border);border-radius:20px;box-shadow:none;font-weight:700;}
.study-card:hover{box-shadow:0 12px 30px rgba(38,44,83,.07);}
.study-progress{height:8px;background:var(--bg);border:1px solid var(--border);}
.study-progress>span{background:linear-gradient(90deg,#8172ff,#5c49d8);}
.grade-row button{border-radius:13px;min-height:64px;}
.grade-row button.btn.grade-again{background:var(--danger);border-color:#c73d49;}
.grade-row button.btn.grade-hard{background:var(--hard);border-color:#ca8426;color:#fff;}
.grade-row button.btn.grade-good{background:#2eaa7b;border-color:#16845b;}
.grade-row button.btn.grade-easy{background:var(--easy);border-color:#236bcc;}
.mcq-opt{background:var(--panel);border-radius:12px;border-color:var(--border);}
.mcq-opt:hover:not(:disabled){background:var(--accent-soft);border-color:var(--accent);}
.mcq-opt.correct{background:#2eaa7b;border-color:#16845b;}
.mcq-opt.wrong{background:var(--danger);border-color:#c73d49;}
.type-toggle{gap:7px;padding:5px;background:var(--bg);border:1px solid var(--border);border-radius:14px;}
.type-toggle button{border:1px solid transparent;border-radius:10px;background:transparent;min-height:43px;color:var(--sub);}
.type-toggle button.active{background:var(--panel);color:var(--accent);border-color:rgba(109,92,232,.18);box-shadow:0 3px 10px rgba(28,35,71,.06);}
.dropzone{min-height:82px;border-radius:14px;border:1.5px dashed #c9cce0;background:var(--bg);padding:18px;}
.dropzone.is-dragover{border-color:var(--accent);background:var(--accent-soft);}
.dropzone-btn{border-radius:10px;padding:9px 13px;border-color:var(--border);}
.filelist span{border-radius:999px;padding:5px 10px;}
.import-tip{background:var(--accent-soft);border:1px solid rgba(109,92,232,.14);border-radius:12px;padding:12px 14px;}
.deck-row,.deck-list-item{padding:16px 5px;}
.deck-row+.deck-row,.deck-list-item+.deck-list-item{border-color:var(--border);}
.deck-row-icon{width:44px;height:44px;border-radius:13px;}
.deck-actions .btn{border-radius:10px;}
.stat-card{border-radius:15px;background:var(--bg);border-color:var(--border);padding:16px;}
.stat-value{font-size:28px;letter-spacing:-.7px;}
.quick-deck{padding:15px 0;}
.quick-deck strong{font-size:13px;}
.quick-deck .btn{white-space:nowrap;}
table{font-size:13px;}
td,th{padding:10px 12px;border-color:var(--border);}
th{background:var(--bg);}
.toast{border-radius:14px;padding:13px 17px;}
.modal{border-radius:22px;padding:24px;}
.modal input{margin-top:16px;}
.modal-actions .btn{min-width:90px;}
.empty-illustration{border:1px dashed rgba(109,92,232,.38);background:var(--accent-soft);}
.empty-illustration .ei-card,.empty-illustration .ei-spark{color:var(--accent);}
.empty-state h3{font-size:20px;letter-spacing:-.4px;}
.empty-state p{font-size:13px;line-height:1.6;}
#tab-ai>.card,#tab-import>.card{max-width:920px;margin-left:auto;margin-right:auto;}
#tab-decks>.card{max-width:1120px;margin-left:auto;margin-right:auto;}
/* Main study dashboard */
.study-dashboard{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(290px,.85fr);gap:18px;align-items:start;}
.study-main-column,.study-side-column{display:flex;flex-direction:column;gap:18px;min-width:0;}
.study-main-column>.card,.study-side-column>.card{min-width:0;}
.study-side-column .panel-title{font-size:16px;}
.study-side-column .card{padding:20px;}
.home-study-card{background:linear-gradient(145deg,var(--panel) 70%,var(--accent-soft));}
.streak-card{position:relative;overflow:hidden;background:linear-gradient(145deg,#fff7ee 0%,#fff 72%);border-color:#f4ddc9;box-shadow:0 12px 30px rgba(171,93,42,.07);}
:root[data-theme="dark"] .streak-card{background:linear-gradient(145deg,#35251f,#191c29 75%);border-color:#5c3d34;}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]) .streak-card{background:linear-gradient(145deg,#35251f,#191c29 75%);border-color:#5c3d34;}}
.streak-card:after{content:"";position:absolute;top:-48px;right:-36px;width:150px;height:150px;border-radius:50%;background:rgba(255,161,88,.11);pointer-events:none;}
.streak-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;position:relative;z-index:1;}
.streak-eyebrow{font-size:10px;font-weight:900;letter-spacing:.14em;color:#b66b37;text-transform:uppercase;}
.streak-title{font-size:16px;letter-spacing:-.35px;font-weight:800;margin-top:3px;}
.streak-number{display:flex;align-items:center;gap:7px;font-size:12px;color:#a55220;font-weight:700;white-space:nowrap;}
.streak-number strong{font-size:28px;line-height:1;letter-spacing:-1px;color:#a94718;}
.streak-week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:7px;margin-top:20px;position:relative;z-index:1;}
.streak-day{display:flex;align-items:center;flex-direction:column;gap:7px;min-width:0;color:#8e7766;font-size:10px;font-weight:800;}
.streak-dot{width:30px;height:30px;border:1px solid #f0d5c0;border-radius:11px;background:rgba(255,255,255,.8);display:flex;align-items:center;justify-content:center;color:transparent;font-size:14px;transition:transform .15s ease,background .15s ease;}
.streak-day.is-done .streak-dot{background:#f58a42;border-color:#e67830;color:white;box-shadow:0 4px 9px rgba(232,119,48,.18);}
.streak-day.is-today .streak-dot{outline:2px solid #ed9c65;outline-offset:2px;}
.streak-day.is-today{color:#a55220;}
.streak-footer{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:18px;padding-top:14px;border-top:1px solid #f2e2d6;position:relative;z-index:1;}
.streak-message{font-size:11px;line-height:1.5;color:#936e56;}
.streak-best{display:flex;flex-direction:column;align-items:flex-end;gap:1px;font-size:10px;color:#936e56;white-space:nowrap;}
.streak-best strong{font-size:14px;color:#a55220;}
.streak-target{display:flex;align-items:center;gap:7px;font-size:11px;color:var(--sub);margin-top:12px;}
.streak-target .target-dot{width:7px;height:7px;border-radius:50%;background:#f58a42;}
.dashboard-grid{gap:12px;margin:20px 0;}
@media(max-width:840px){
  header{grid-template-columns:auto minmax(0,1fr) auto;gap:12px;padding:10px 14px;}
  nav{overflow-x:auto;justify-content:flex-start;}
  nav button{padding:9px 10px;}
  main{padding:22px 14px 70px;}
  .study-dashboard{grid-template-columns:minmax(0,1fr);}
  .study-side-column{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));align-items:start;}
  .study-side-column .streak-card{grid-column:1/-1;}
}
@media(max-width:600px){
  header{grid-template-columns:1fr auto;gap:8px;padding:10px 12px;}
  .brand{grid-column:1;grid-row:1;}
  .header-actions{grid-column:2;grid-row:1;}
  nav{grid-column:1/-1;grid-row:2;width:100%;border-top:1px solid var(--border);padding-top:8px;}
  nav button{font-size:12px;min-height:38px;padding:7px 10px;}
  .header-streak{padding:7px 9px;gap:4px;font-size:10px;}
  .header-streak strong{font-size:12px;}
  main{padding:16px 10px 60px;}
  .card{padding:17px;border-radius:17px;}
  .study-dashboard,.study-main-column,.study-side-column{gap:12px;}
  .study-side-column{display:flex;}
  .panel-title{font-size:18px;}
  .study-card{min-height:245px;padding:28px 18px;}
  .grade-row{grid-template-columns:repeat(2,minmax(0,1fr));}
  .count-fields{gap:8px;}
  .type-toggle.count-toggle{gap:3px;}
  .type-toggle.count-toggle button{padding:8px 4px;font-size:12px;}
  .streak-week{gap:4px;}
  .streak-dot{width:28px;height:28px;border-radius:9px;}
  .streak-footer{align-items:flex-start;}
  .deck-filter{flex-wrap:wrap;}
  .dropzone{flex-wrap:wrap;}
}

</style>
</head>
<body>
<header>
  <div class="brand">
    <span class="logo-badge"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2 2 7l10 5 10-5-10-5Z"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/></svg></span>
    <h1>Recall</h1>
  </div>
  <nav id="tabs">
    <button data-tab="study" class="active"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2Z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7Z"/></svg>Study</button>
    <button data-tab="decks"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2 2 7l10 5 10-5-10-5Z"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/></svg>Decks</button>
    <button data-tab="import"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 18a4.6 4.4 0 0 1-1.3-8.9A5 5 0 0 1 15.9 7a4.5 4.5 0 0 1 2.1 8.6"/><polyline points="9 15 12 12 15 15"/><line x1="12" y1="12" x2="12" y2="21"/></svg>Import</button>
    <button data-tab="ai"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2.5c.4 3.2 1.1 5.6 2.2 7.1 1.1 1.5 2.7 2.5 4.8 3.2-2.1.7-3.7 1.7-4.8 3.2-1.1 1.5-1.8 3.9-2.2 7.1-.4-3.2-1.1-5.6-2.2-7.1-1.1-1.5-2.7-2.5-4.8-3.2 2.1-.7 3.7-1.7 4.8-3.2 1.1-1.5 1.8-3.9 2.2-7.1Z"/></svg>AI Create</button>
  </nav>
  <div class="header-actions">
    <div class="header-streak" id="headerStreak" title="Your current study streak"><span aria-hidden="true">🔥</span><strong id="headerStreakCount">0</strong><span>day streak</span></div>
    <button class="icon-btn" id="themeToggle" type="button" title="Toggle theme" aria-label="Toggle theme">
      <svg id="themeIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>
    </button>
  </div>
</header>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<div id="modalRoot"></div>
<main>
  <div id="tab-study"></div>
  <div id="tab-decks" class="hidden"></div>
  <div id="tab-import" class="hidden"></div>
  <div id="tab-ai" class="hidden"></div>
</main>
<script>
const LS_KEY='recall_decks_v1';
const MODEL='openai/gpt-oss-120b', VISION_MODEL='qwen/qwen3.8-27b';
let state = load(LS_KEY, {decks:{}, sets:{}});
if(!state.decks) state.decks={};
if(!state.sets) state.sets={};
let studySession = null;
let aiFiles = [];

function load(key, fallback){ try{ return JSON.parse(localStorage.getItem(key)) || fallback; }catch(e){ return fallback; } }
function saveDecks(){ localStorage.setItem(LS_KEY, JSON.stringify(state)); }
function uid(){ return Math.random().toString(36).slice(2,10); }
function escapeHtml(s){ return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }
function ensureDeck(name){ const id=uid(); state.decks[id]={id,name,cards:[]}; saveDecks(); return id; }
function ensureSet(name){ const id=uid(); state.sets[id]={id,name,deckIds:[]}; saveDecks(); return id; }
function setDeckIds(set){ return (set.deckIds||[]).filter(id=>state.decks[id]); }
function dueCountForDeckIds(deckIds){ return deckIds.reduce((n,id)=>{ const d=state.decks[id]; return n+(d?dueCards(d).length:0); },0); }
function cardCountForDeckIds(deckIds){ return deckIds.reduce((n,id)=>{ const d=state.decks[id]; return n+(d?d.cards.length:0); },0); }

function backupAllData(){
  const deckCount=Object.keys(state.decks).length;
  if(!deckCount){ toast('Nothing to back up yet — create a deck first.'); return; }
  const payload={app:'recall', version:1, exportedAt:new Date().toISOString(), state};
  const stamp=new Date().toISOString().slice(0,10);
  downloadFile(`recall-backup-${stamp}.json`, JSON.stringify(payload,null,2), 'application/json');
  toast('Backup downloaded.');
}
function handleRestoreFile(file){
  const reader=new FileReader();
  reader.onload=()=>{
    let incoming;
    try{
      const parsed=JSON.parse(String(reader.result));
      incoming = parsed && parsed.state && typeof parsed.state.decks==='object' ? parsed.state : parsed;
      if(!incoming || typeof incoming.decks!=='object') throw new Error('bad shape');
      if(!incoming.sets) incoming.sets={};
    }catch(e){ toast("That file doesn't look like a valid Recall backup."); return; }
    const incomingDeckCount=Object.keys(incoming.decks).length;
    showConfirm('Restore this backup?', `This replaces everything currently in Recall with ${incomingDeckCount} deck(s) from the backup file. This can't be undone.`, ()=>{
      state=incoming;
      studySession=null; editingCardId=null; renamingDeckId=null; deckView='list'; deckQuery=''; openDecks=new Set(); deckAddType={};
      setView='list'; renamingSetId=null; managingSetId=null;
      saveDecks();
      toast('Backup restored.');
      renderDecks();
    });
  };
  reader.onerror=()=>toast('Could not read that file.');
  reader.readAsText(file);
}

let deckQuery='';
let toastTimer=null;
function toast(message, tone='info'){
  const el=document.getElementById('toast'); if(!el) return;
  el.textContent=message;
  el.className='toast show '+tone;
  clearTimeout(toastTimer); toastTimer=setTimeout(()=>el.classList.remove('show'),2600);
}
function showConfirm(title, message, onConfirm){
  const root=document.getElementById('modalRoot');
  root.innerHTML=`<div class="modal-backdrop" role="presentation"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <h3 id="modalTitle">${escapeHtml(title)}</h3><p>${escapeHtml(message)}</p>
    <div class="modal-actions"><button class="btn secondary" id="modalCancel">Cancel</button><button class="btn danger" id="modalConfirm">Confirm</button></div>
  </div></div>`;
  const close=()=>root.innerHTML='';
  document.getElementById('modalCancel').onclick=close;
  document.getElementById('modalConfirm').onclick=()=>{ close(); onConfirm(); };
  root.querySelector('.modal-backdrop').onclick=e=>{ if(e.target===e.currentTarget) close(); };
  document.addEventListener('keydown', function esc(ev){ if(ev.key==='Escape'){ close(); document.removeEventListener('keydown',esc); } });
  document.getElementById('modalConfirm').focus();
}
function showPrompt(title, message, placeholder, okLabel, onSubmit){
  const root=document.getElementById('modalRoot');
  root.innerHTML=`<div class="modal-backdrop" role="presentation"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <h3 id="modalTitle">${escapeHtml(title)}</h3><p>${escapeHtml(message)}</p>
    <input id="modalPromptInput" type="text" maxlength="80" placeholder="${escapeHtml(placeholder||'')}" autocomplete="off">
    <p class="modal-error" id="modalPromptError" role="alert"></p>
    <div class="modal-actions"><button class="btn secondary" id="modalPromptCancel">Cancel</button><button class="btn" id="modalPromptOk">${escapeHtml(okLabel||'Save')}</button></div>
  </div></div>`;
  const input=document.getElementById('modalPromptInput'), err=document.getElementById('modalPromptError');
  const onKey=ev=>{ if(ev.key==='Escape') close(); };
  const close=()=>{ root.innerHTML=''; document.removeEventListener('keydown',onKey); };
  const submit=()=>{
    const v=input.value.trim();
    if(!v){ err.textContent='Give it a name.'; input.focus(); return; }
    close(); onSubmit(v);
  };
  document.getElementById('modalPromptCancel').onclick=close;
  document.getElementById('modalPromptOk').onclick=submit;
  input.addEventListener('keydown',ev=>{ if(ev.key==='Enter'){ ev.preventDefault(); submit(); } });
  input.addEventListener('input',()=>{ err.textContent=''; });
  root.querySelector('.modal-backdrop').onclick=e=>{ if(e.target===e.currentTarget) close(); };
  document.addEventListener('keydown',onKey);
  input.focus();
}
function switchTab(tab){ document.querySelector(`#tabs button[data-tab="${tab}"]`)?.click(); }
function buildStudyPool(deckIds, includeAll){
  let pool=[];
  deckIds.forEach(id=>{
    const d=state.decks[id]; if(!d) return;
    const cards=includeAll?d.cards.slice():dueCards(d);
    cards.forEach(c=>pool.push({cardId:c.id, deckId:id, due:c.due||0}));
  });
  return pool;
}
function startSession(deckIds, includeAll=false, limit=null){
  const pool=buildStudyPool(deckIds, includeAll);
  if(!pool.length){ toast(deckIds.length>1?'Nothing is due right now.':'Nothing is due in this deck right now.'); return; }
  pool.sort((a,b)=>a.due-b.due); // most overdue / longest-waiting cards first
  const capped = limit ? pool.slice(0, limit) : pool;
  const queue=shuffle(capped.map(p=>({cardId:p.cardId, deckId:p.deckId})));
  studySession={deckId: deckIds.length===1?deckIds[0]:null, mixed: deckIds.length>1, queue, pos:0, showBack:false, selected:null, optionOrder:null, typed:'', total:queue.length, undo:null};
  switchTab('study');
  renderStudy();
}
function startStudy(deckId, includeAll=false, limit=null){ startSession([deckId], includeAll, limit); }
function startStudyAll(includeAll=false, limit=null){ startSession(Object.keys(state.decks), includeAll, limit); }
function startStudySet(setId, includeAll=false, limit=null){
  const set=state.sets[setId]; if(!set) return;
  startSession(setDeckIds(set), includeAll, limit);
}
function gradeIntervalLabel(card, rating){
  const MIN=60000,HR=60*MIN,DAY=24*HR;
  const current=card.interval||0, ease=card.ease==null?2.5:card.ease;
  let ms;
  if(rating===0) ms=10*MIN;
  else if(current===0) ms=rating===1?8*HR:rating===2?DAY:4*DAY;
  else ms=Math.round(current*(rating===1?1.2:rating===2?ease:ease*1.3));
  if(ms<HR) return `${Math.max(1,Math.round(ms/MIN))}m`;
  if(ms<DAY) return `${Math.max(1,Math.round(ms/HR))}h`;
  return `${Math.max(1,Math.round(ms/DAY))}d`;
}
function initTheme(){
  const saved=localStorage.getItem('recall_theme');
  if(saved==='light'||saved==='dark') document.documentElement.dataset.theme=saved;
  const icon=document.getElementById('themeIcon');
  const dark=document.documentElement.dataset.theme==='dark' || (!document.documentElement.dataset.theme && matchMedia('(prefers-color-scheme: dark)').matches);
  if(icon) icon.innerHTML=dark?'<path d="M21 12.8A8.5 8.5 0 1 1 11.2 3 6.5 6.5 0 0 0 21 12.8Z"/>':'<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/>';
}
function toggleTheme(){
  const current=document.documentElement.dataset.theme;
  const systemDark=matchMedia('(prefers-color-scheme: dark)').matches;
  const next=(current?current:(systemDark?'dark':'light'))==='dark'?'light':'dark';
  document.documentElement.dataset.theme=next; localStorage.setItem('recall_theme',next); initTheme();
}

const ICONS={
  layers:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2 2 7l10 5 10-5-10-5Z"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/></svg>',

function panelHeader(icon, title, sub){

function schedule(card, rating){
  const MIN=60000,HR=60*MIN,DAY=24*HR;
  if(card.interval==null) card.interval=0;
  if(card.ease==null) card.ease=2.5;
  if(rating===0){ card.interval=10*MIN; card.ease=Math.max(1.3,card.ease-0.2); }
  else{
    if(card.interval===0){ card.interval = rating===1?8*HR:rating===2?DAY:4*DAY; }
    else{ const f = rating===1?1.2:rating===2?card.ease:card.ease*1.3; card.interval=Math.round(card.interval*f); }
    if(rating===1) card.ease=Math.max(1.3,card.ease-0.15);
    if(rating===3) card.ease=Math.min(3.0,card.ease+0.15);
  }
  card.due=Date.now()+card.interval; card.reps=(card.reps||0)+1;
}
function dueCards(d){ const now=Date.now(); return d.cards.filter(c=>!c.due||c.due<=now); }
function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]];} return a; }

function advanceCard(card, rating){
  const qi=studySession.queue[studySession.pos];
  studySession.undo={cardId:card.id, deckId:qi.deckId, pos:studySession.pos, prev:{interval:card.interval, ease:card.ease, due:card.due, reps:card.reps}};
  schedule(card, rating); saveDecks();
  bumpStreak();
  studySession.pos++; studySession.showBack=false; studySession.selected=null; studySession.optionOrder=null; studySession.typed='';
  renderStudy();
}
function undoLastGrade(){
  const u=studySession && studySession.undo; if(!u) return;
  const deck=state.decks[u.deckId]; if(!deck){ return; }
  const card=deck.cards.find(c=>c.id===u.cardId); if(!card) return;
  card.interval=u.prev.interval; card.ease=u.prev.ease; card.due=u.prev.due; card.reps=u.prev.reps;
  saveDecks();
  studySession.pos=u.pos; studySession.showBack=false; studySession.selected=null; studySession.optionOrder=null; studySession.typed=''; studySession.undo=null;
  toast('Last answer undone.');
  renderStudy();
}
function pad2(n){ return String(n).padStart(2,'0'); }
function dayStr(d){ return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate()); }
function ensureStreakState(){
  if(!state.streak || typeof state.streak!=='object') state.streak={count:0,lastDay:null,best:0,days:[],reviewsByDay:{}};
  const st=state.streak;
  if(!Array.isArray(st.days)) st.days=[];
  if(!st.reviewsByDay || typeof st.reviewsByDay!=='object') st.reviewsByDay={};
  st.count=Number(st.count)||0;
  st.best=Math.max(Number(st.best)||0,st.count);
  // Migrate the earlier single-date streak format without losing its latest day.
  if(st.lastDay && !st.days.includes(st.lastDay)) st.days.push(st.lastDay);
  return st;
}
function bumpStreak(){
  const today=dayStr(new Date()), st=ensureStreakState();
  if(st.lastDay!==today){
    const y=new Date(); y.setDate(y.getDate()-1);
    st.count=st.lastDay===dayStr(y) ? (st.count||0)+1 : 1;
    st.lastDay=today;
  }
  if(!st.days.includes(today)) st.days.push(today);
  st.days=Array.from(new Set(st.days)).sort().slice(-400);
  st.reviewsByDay[today]=(Number(st.reviewsByDay[today])||0)+1;
  const cutoff=new Date(); cutoff.setDate(cutoff.getDate()-400); const cutoffDay=dayStr(cutoff);
  Object.keys(st.reviewsByDay).forEach(day=>{if(day<cutoffDay) delete st.reviewsByDay[day];});
  st.best=Math.max(Number(st.best)||0,Number(st.count)||0);
  saveDecks();
  updateHeaderStreak();
}
function currentStreakCount(){
  const st=ensureStreakState(); if(!st.lastDay) return 0;
  const today=dayStr(new Date()), y=new Date(); y.setDate(y.getDate()-1);
  return (st.lastDay===today || st.lastDay===dayStr(y)) ? (Number(st.count)||0) : 0;
}
function updateHeaderStreak(){
  const countEl=document.getElementById('headerStreakCount');
  const pill=document.getElementById('headerStreak');
  if(!countEl||!pill) return;
  const count=currentStreakCount(); countEl.textContent=count;
  pill.title=`${count}-day current streak. Best: ${ensureStreakState().best} days.`;
  pill.setAttribute('aria-label',`${count} day study streak`);
}
function streakOverviewHtml(){
  const st=ensureStreakState(), today=new Date(), todayKey=dayStr(today), current=currentStreakCount();
  const done=new Set(st.days||[]), todayReviews=Number((st.reviewsByDay||{})[todayKey])||0;
  const week=Array.from({length:7},(_,i)=>{const d=new Date(today);d.setDate(today.getDate()-(6-i));return d;});
  const weekHtml=week.map(d=>{
    const key=dayStr(d), active=done.has(key), isToday=key===todayKey;
    const label=d.toLocaleDateString(undefined,{weekday:'short'}).slice(0,2);
    return `<div class="streak-day ${active?'is-done':''} ${isToday?'is-today':''}" title="${key}${active?` · ${(Number((st.reviewsByDay||{})[key])||0)} review(s)`:''}"><span>${label}</span><span class="streak-dot">${active?'✓':(isToday?'·':'')}</span></div>`;
  }).join('');
  const message=todayReviews>0?`Nice work — ${todayReviews} review${todayReviews===1?'':'s'} logged today. Streak secured!`:current>0&&st.lastDay===todayKey?'You studied today. Come back tomorrow to keep the chain alive.':'Study at least one card today to keep your streak going.';
  return `<section class="card streak-card" aria-label="Study streak">
    <div class="streak-head"><div><div class="streak-eyebrow">Your momentum</div><div class="streak-title">Build your daily habit</div></div><div class="streak-number"><span aria-hidden="true">🔥</span><strong>${current}</strong><span>day streak</span></div></div>
    <div class="streak-week" aria-label="Study activity over the last seven days">${weekHtml}</div>
    <div class="streak-footer"><div class="streak-message">${message}</div><div class="streak-best"><span>PERSONAL BEST</span><strong>🏆 ${Math.max(Number(st.best)||0,Number(st.count)||0)} days</strong></div></div>
    <div class="streak-target"><span class="target-dot"></span>${todayReviews>0?'Daily goal complete':'Daily goal: review one or more cards'}</div>
  </section>`;
}

function fitbMatch(card, guess){
  const norm=s=>String(s||'').trim().toLowerCase().replace(/\s+/g,' ');
  const g=norm(guess);
  return !!g && card.answers.some(a=>norm(a)===g);
}
function renderStudyFITB(el, deck, card){

    <button class="btn grade-good" data-r="2"><span class="grade-label">Good</span><span class="grade-time">${gradeIntervalLabel(card,2)}</span></button><button class="btn grade-easy" data-r="3"><span class="grade-label">Easy</span><span class="grade-time">${gradeIntervalLabel(card,3)}</span></button></div>

  if(!revealed){

    const submit=()=>{ studySession.typed=input.value; studySession.showBack=true; renderStudy(); };

}

}
function cardAnswerText(c){
  if(c.type==='mcq') return c.options[c.correctIndex]||'';

}
function exportDeckCSV(id){

function exportDeckGimkit(id){
  const d=state.decks[id];

  const rows=d.cards.map(c=>{
    let opts, correct;
    if(c.type==='mcq'){ opts=c.options.slice(0,4); while(opts.length<4) opts.push(''); correct=c.options[c.correctIndex]||''; }
    else if(c.type==='fitb'){ const a=(c.answers&&c.answers[0])||''; opts=[a,'','','']; correct=a; }
    else{ opts=[c.back,'','','']; correct=c.back; }
    return [c.front, ...opts, correct].map(csvQuote).join(',');
  });
  downloadFile(d.name+'-gimkit.csv', [header, ...rows].join('\n'));
}

function countImportableLines(text){
  return text.split('\n').map(l=>l.trim()).filter(Boolean).filter(line=>{
    const parts=line.includes('\t')?line.split('\t'):splitCsvLine(line);
    return parts.length>=2 && parts[0].trim() && parts[1].trim();
  }).length;
}
function splitCsvLine(line){
  const out=[]; let cur='',inQ=false;
  for(let i=0;i<line.length;i++){ const ch=line[i];
    if(ch==='"'){ if(inQ&&line[i+1]==='"'){cur+='"';i++;} else inQ=!inQ; }
    else if(ch===','&&!inQ){ out.push(cur); cur=''; } else cur+=ch; }
  out.push(cur); return out;
}

async function extractPdfText(file){
  if(!window.pdfjsLib) throw new Error('PDF reader did not load. Check your connection and try again.');
  pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
  const buf = await file.arrayBuffer();
  const pdf = await pdfjsLib.getDocument({data:buf}).promise;
  let text='';
  for(let p=1;p<=pdf.numPages;p++){
    const page=await pdf.getPage(p);
    const content=await page.getTextContent();
    let line='', lastY=null;
    for(const it of content.items){
      const y=it.transform ? it.transform[5] : null;
      if(lastY!==null && y!==null && Math.abs(y-lastY)>2 && line){ text+=line.trim()+'\n'; line=''; }
      line += it.str + (it.hasEOL ? '\n' : ' ');
      if(it.hasEOL){ text+=line.replace(/\s+$/,'')+'\n'; line=''; }
      if(y!==null) lastY=y;
    }
    text += line.trim() + '\n';
  }
  return text;
}
async function extractDocxText(file){
  if(!window.mammoth) throw new Error('DOCX reader did not load. Check your connection and try again.');
  const result=await mammoth.extractRawText({arrayBuffer:await file.arrayBuffer()});
  return String(result.value||'').trim();
}

function readAsDataURL(file){ return new Promise((res,rej)=>{ const r=new FileReader(); r.onload=()=>res(r.result); r.onerror=rej; r.readAsDataURL(file); }); }

const GEN_SYSTEM = 'You are a flashcard generator that only outputs valid JSON. Never write sentences, greetings, questions, or explanations outside the JSON.';
const TOPIC_RULE = 'Make each card test a distinct learning objective; vary definitions, mechanisms, examples, applications, causes, effects, comparisons, exceptions, and implications when supported. Never pad with meaningless wording changes or present uncertain claims as facts. Output only the requested JSON object.';
function genError(kind, message){ const e=new Error(message||kind); e.kind=kind; return e; }

// ---- Card-count settings ----
// Larger but bounded batches reduce request overhead. MCQ cards have longer outputs.
const MIN_CARDS=1, MAX_CARDS=1000, BATCH_BASIC=40, BATCH_MCQ=25, BATCH_FITB=35;
function batchSizeFor(type){ return type==='mcq' ? BATCH_MCQ : type==='fitb' ? BATCH_FITB : BATCH_BASIC; }
function splitSourceIntoChunks(text, maxChars=9000){
  const source=String(text||'').replace(/\r/g,'').trim();
  if(!source) return [];
  if(source.length<=maxChars) return [source];
  const chunks=[]; let current='';
  const paragraphs=source.split(/\n{2,}/);
  const pushPiece=(piece)=>{
    let rest=piece.trim();
    if(!rest) return;
    if(rest.length>maxChars && current){ chunks.push(current); current=''; }
    while(rest.length>maxChars){
      let cut=rest.lastIndexOf(' ',maxChars);
      if(cut<Math.floor(maxChars*0.6)) cut=maxChars;
      chunks.push(rest.slice(0,cut).trim()); rest=rest.slice(cut).trim();
    }
    if(!rest) return;
    if(current && current.length+rest.length+2>maxChars){ chunks.push(current); current=''; }
    current += (current?'\n\n':'')+rest;
  };
  for(const paragraph of paragraphs) pushPiece(paragraph);
  if(current) chunks.push(current);
  return chunks.filter(Boolean);
}
const cardWord=k=>`${k} card${k===1?'':'s'}`;
// Reads and validates the "Number of cards" controls -> {mode, min, max} or {mode, error, bad:[ids]}
function readCountSetting(){
  const mode=document.getElementById('aiCountMode').value;
  if(mode==='auto') return {mode, min:0, max:Infinity};
  const num=id=>parseInt(document.getElementById(id).value,10);
  const ok=v=>Number.isInteger(v) && v>=MIN_CARDS && v<=MAX_CARDS;
  const rangeMsg=`Enter a whole number from ${MIN_CARDS} to ${MAX_CARDS}.`;
  if(mode==='exact'){
    const n=num('aiCountExact');
    return ok(n) ? {mode, min:n, max:n} : {mode, error:rangeMsg, bad:['aiCountExact']};
  }
  const lo=num('aiCountMin'), hi=num('aiCountMax');
  const bad=[]; if(!ok(lo)) bad.push('aiCountMin'); if(!ok(hi)) bad.push('aiCountMax');
  if(bad.length) return {mode, error:rangeMsg, bad};
  if(lo>hi) return {mode, error:"Minimum can't be more than maximum.", bad:['aiCountMin','aiCountMax']};
  return {mode, min:lo, max:hi};
}
function describeCount(s){
  if(s.mode==='auto') return 'The AI picks a sensible number based on how much your material covers.';
  if(s.min===s.max) return `The AI will aim for exactly ${cardWord(s.min)}.`;
  return `The AI will make between ${s.min} and ${cardWord(s.max)}, depending on how much your material covers.`;

// The sentence dropped into the prompt that tells the AI how many to write.
function countInstruction(noun, lo, hi, allowExpansion=false){
  if(allowExpansion){
    if(lo===hi) return `Aim for EXACTLY ${lo} ${noun}${lo===1?'':'s'}. Use accurate, well-established related subject knowledge if the supplied material alone is too limited. Do not repeat or pad with trivial ${noun}s.`;
    return `Write up to ${hi} ${noun}s and try to reach at least ${lo}. You may use accurate, well-established related subject knowledge if the material is too limited; never repeat or pad with trivial ${noun}s.`;
  }
  if(lo===hi) return `Aim for ${lo} ${noun}${lo===1?'':'s'}, but source fidelity is more important than the count: use ONLY facts explicitly supported by the supplied material. If there are not ${lo} distinct supported items, return only the distinct supported items. Never guess, add outside facts, or disguise repetition as a new card.`;
  return `Write up to ${hi} ${noun}s, aiming for at least ${lo}, using ONLY facts explicitly supported by the supplied material. Source fidelity is more important than the count. If fewer distinct supported items exist, return only those; never guess, add outside facts, or disguise repetition as a new card.`;
}
function autoCountInstruction(noun, allowExpansion=false){
  return allowExpansion
    ? `Decide a sensible number of distinct, useful ${noun}s from the supplied material and accurate related subject knowledge. Never pad with repetition.`
    : `Create as many distinct, useful ${noun}s as the supplied material explicitly supports. Do not use outside knowledge or guess; never pad with repetition.`;
}
function findBalanced(t, start){
  const open=t[start], close=open==='['?']':'}';
  let depth=0, inStr=false, esc=false;
  for(let i=start;i<t.length;i++){
    const c=t[i];
    if(inStr){ if(esc) esc=false; else if(c==='\\') esc=true; else if(c==='"') inStr=false; continue; }
    if(c==='"'){ inStr=true; continue; }
    if(c===open) depth++;
    else if(c===close){ depth--; if(depth===0) return i; }
  }
  return -1;
}
function unwrapCards(v){
  const ok=a=>Array.isArray(a) && a.every(x=>x && typeof x==='object' && !Array.isArray(x));
  if(ok(v)) return v;
  if(v && typeof v==='object'){
    if(ok(v.cards)) return v.cards;
    for(const k of Object.keys(v)) if(Array.isArray(v[k]) && v[k].length && ok(v[k])) return v[k];
  }
  return null;
}
// Pulls the cards out of a model reply even if it wrapped the JSON in prose,
// markdown fences, or <think> blocks. Returns an array, or null if none found.
function parseCardsJson(raw){
  let t=String(raw||'').replace(/<think>[\s\S]*?<\/think>/gi,'').trim();
  t=t.replace(/^```(?:json)?\s*/i,'').replace(/\s*```$/,'').trim();
  const tryParse=x=>{ try{ return JSON.parse(x); }catch(e){ return undefined; } };
  let r=unwrapCards(tryParse(t));
  if(r) return r;
  for(let i=0;i<t.length;i++){
    if(t[i]!=='[' && t[i]!=='{') continue;
    const end=findBalanced(t,i); if(end<0) continue;
    r=unwrapCards(tryParse(t.slice(i,end+1)));
    if(r && r.length) return r;
  }
  // truncated reply: keep every complete card object that was written before the cut-off
  const salvaged=[];
  for(let i=0;i<t.length;i++){
    if(t[i]!=='{') continue;
    const end=findBalanced(t,i); if(end<0) continue;
    const o=tryParse(t.slice(i,end+1));
    if(o && typeof o==='object' && !Array.isArray(o) && ('front' in o || 'question' in o)){ salvaged.push(o); i=end; }
  }
  return salvaged.length ? salvaged : null;
}
async function requestCards(model, promptText, images, tokenBudget=4000){
  const userContent = images.length
    ? [{type:'text', text:promptText}, ...images.map(u=>({type:'image_url', image_url:{url:u}}))]
    : promptText;
  let messages=[{role:'system', content:GEN_SYSTEM},{role:'user', content:userContent}];
  let jsonMode = images.length===0;   // JSON mode is only used for text-only requests
  let lastRaw='';
  const maxTok=fitBudget(promptText, tokenBudget);
  for(let attempt=0; attempt<2; attempt++){
    const body={ model, messages, temperature:0.2, max_completion_tokens:maxTok, ...(model==='openai/gpt-oss-20b'||model==='openai/gpt-oss-120b' ? {reasoning_effort:'low',include_reasoning:false} : {}) };
    if(jsonMode) body.response_format={type:'json_object'};
    const resp = await fetch('/api/generate', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body) });
    const data = await resp.json().catch(()=>({}));
    if(!resp.ok){
      // Model/endpoint rejected JSON mode (or its JSON check) -> retry without it.
      if(resp.status===400 && jsonMode){ jsonMode=false; continue; }
      const msg = typeof data.error==='string' ? data.error : (data.error && data.error.message) || ('API error '+resp.status);
      const detail = (data.details && (data.details.error && data.details.error.message || data.details.error)) || '';
      const err=genError('api', msg); err.status=resp.status;
      err.retryAfterMs=parseRetryMs(resp.headers.get('retry-after') ?? data.retry_after_seconds, msg+' '+(typeof detail==='string'?detail:JSON.stringify(detail)));

      if(resp.status===429 && err.retryAfterMs>120000){

      } else if(resp.status===413){

      }
      throw err;
    }
    lastRaw = data.choices?.[0]?.message?.content || '';
    const parsed = parseCardsJson(lastRaw);
    if(parsed) return parsed;
    // Model answered in prose. Show it what went wrong and ask again.
    messages = [
      {role:'system', content:GEN_SYSTEM},
      {role:'user', content:userContent},
      {role:'assistant', content:String(lastRaw).slice(0,600) || '(empty)'},
      {role:'user', content:'That was not valid JSON. Reply again with ONLY the JSON object {"cards":[...]} — no sentences, no questions, no markdown. If the material is just a topic, write the cards from your own knowledge of it.'}
    ];
  }
  throw genError('parse', 'The AI kept replying with text instead of cards.');
}
async function extractImageSourceOnce(images){
