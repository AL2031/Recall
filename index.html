// ---------- Smart generation engine ----------
// Term lists (e.g. 1,000 vocabulary words) are split into numbered batches where every term is
// assigned to exactly one request, so cards cannot repeat by construction. Anything the model
// skips is detected and re-requested. Prose sources are split into sections with per-section quotas.
const normKey=v=>String(v||'').normalize('NFKC').toLowerCase().replace(/[^a-z0-9\u00C0-\u024F\u4E00-\u9FFF]+/gi,' ').trim();
const termKeyOf=t=>normKey(String(t||'').replace(/\([^)]*\)/g,' ').replace(/\s+(?:n|v|adj|adv)\.?\s*$/i,''));
const dedupeTokens=k=>k.split(' ').filter(w=>w.length>2 || /\d/.test(w));
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const estTokens=s=>Math.ceil(String(s||'').length/3.6);
function shuffled(arr){ const a=arr.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }

// Groq counts prompt + max output against the per-minute limit, so keep the two together under ~7.6k.
function fitBudget(promptText, desired){
  const room=7600-(estTokens(promptText)+150);
  return Math.max(800, Math.min(8192, desired, room));
}
function parseRetryMs(headerVal, message){
  const h=parseFloat(headerVal);
  if(Number.isFinite(h) && h>=0) return Math.ceil(h*1000);
  const m=/try again in\s+((?:\d+(?:\.\d+)?\s*(?:ms|h|m|s)\s*)+)/i.exec(String(message||''));
  if(!m) return 0;
  let total=0, x; const re=/(\d+(?:\.\d+)?)\s*(ms|h|m|s)/gi;
  while((x=re.exec(m[1]))){ const v=parseFloat(x[1]), u=x[2].toLowerCase(); total+= u==='h'?v*3600000 : u==='m'?v*60000 : u==='s'?v*1000 : v; }
  return Math.ceil(total);
}

// ---- rate-limit aware requests ----
let rlUntil=0;   // shared "do not send before" timestamp after a 429
async function requestWithBackoff(model, promptText, images, budget, shouldStop, pace){
  let delay=2500;
  for(let attempt=0; attempt<5; attempt++){
    if(shouldStop && shouldStop()) throw genError('stopped','Stopped');
    const wait=rlUntil-Date.now(); if(wait>0) await sleep(wait);
    try{ return await requestCards(model, promptText, images, budget); }
    catch(err){
      const retryable = err.retryable===true || !err.kind;   // 429 / 5xx / network errors
      if(!retryable || attempt===4) throw err;
      if(err.status===429 && pace) pace.limit=1;               // free-tier limits: stop running in parallel
      const waitMs=Math.min(60000, err.retryAfterMs || delay) + Math.random()*400;
      rlUntil=Math.max(rlUntil, Date.now()+waitMs);
      delay=Math.min(30000, delay*2);
    }
  }
}
// Runs async tasks with a concurrency limit that can shrink while running (pace.limit).
async function runPool(tasks, pace, halt){
  let next=0;
  const worker=async idx=>{
    while(true){
      if(halt()) return;
      if(idx>=pace.limit) return;
      const i=next++; if(i>=tasks.length) return;
      await tasks[i]();
    }
  };
  await Promise.all(Array.from({length:Math.min(pace.limit,tasks.length)},(_,i)=>worker(i)));
  // if the limit shrank mid-run, worker 0 has already drained the queue
}

// ---- normalising model output into cards ----
function normalizeCards(cardType, parsed){
  const arr=Array.isArray(parsed) ? parsed : [];
  const term=c=>c && c.term!=null ? String(c.term).trim() : '';
  if(cardType==='mcq'){
    return arr.map(c=>{
      if(!c || typeof c!=='object') return null;
      let options=Array.isArray(c.options) ? c.options.map(o=>String(o).trim()).filter(Boolean) : [];
      if(options.length===4 && options.every((o,i)=>new RegExp('^\\(?'+'ABCD'[i]+'[.)]\\s','i').test(o))) options=options.map(o=>o.replace(/^\(?[A-Da-d][.)]\s+/,''));
      if(options.length!==4 || new Set(options.map(o=>o.toLowerCase())).size!==4) return null;
      const ans=String(c.answer||'').trim();
      let ci=options.findIndex(o=>o.toLowerCase()===ans.toLowerCase());
      if(ci<0){ const stripped=ans.replace(/^\(?[A-Da-d][.)]\s*/,'').toLowerCase(); ci=options.findIndex(o=>o.toLowerCase()===stripped); }
      if(ci<0 && /^[A-Da-d]$/.test(ans)) ci='abcd'.indexOf(ans.toLowerCase());
      if(ci<0) return null;
      let opts=options, idx=ci;
      // models like to put the right answer in the same slot; shuffle unless options refer to each other
      if(!options.some(o=>/\b(all|none|both)\b.*\b(above|these|options)\b/i.test(o))){ const order=shuffled([0,1,2,3]); opts=order.map(i=>options[i]); idx=order.indexOf(ci); }
      const front=String(c.question||'').trim();
      return front ? { type:'mcq', front, options:opts, correctIndex:idx, term:term(c) } : null;
    }).filter(Boolean);
  }
  if(cardType==='fitb'){
    return arr.map(c=>{
      if(!c || typeof c!=='object') return null;
      const front=String(c.question||'').replace(/\[\s*(?:blank)?\s*\]|\(\s*blank\s*\)|\.{4,}|…{2,}/gi,'___').trim();
      const answers=Array.isArray(c.answers) ? c.answers.map(a=>String(a).trim()).filter(Boolean) : (c.answer ? [String(c.answer).trim()] : []);
      return front && /_{2,}/.test(front) && answers.length ? { type:'fitb', front, answers, term:term(c) } : null;
    }).filter(Boolean);
  }
  return arr.map(c=>{
    if(!c || typeof c!=='object') return null;
    const front=String(c.front||'').trim(), back=String(c.back||'').trim();
    return front && back ? { type:'basic', front, back, term:term(c) } : null;
  }).filter(Boolean);
}

// ---- duplicate removal ----
// existing = {keys:Set<string>, toks:Array<Set<string>>}. Exact normalised-front match always counts;
// near-duplicate (word overlap >= 85%) is checked for free-form cards but not for term-list cards.
function dedupeCards(list, existing){
  const seen=new Set(existing ? existing.keys : []);
  const toks=existing ? existing.toks.slice() : [];
  const out=[];
  for(const c of list){
    const fk=normKey(c.front);
    if(!fk || seen.has(fk)) continue;
    let tk=null;
    if(!c.key){
      tk=new Set(dedupeTokens(fk));
      if(tk.size>=4){
        let dup=false;
        for(const t of toks){
          if(t.size<4) continue;
          let inter=0; for(const w of tk) if(t.has(w)) inter++;
          if(inter/(tk.size+t.size-inter)>=0.85){ dup=true; break; }
        }
        if(dup) continue;
      }
    }
    seen.add(fk); if(tk && tk.size>=4) toks.push(tk);
    out.push(c);
  }
  return out;
}

// ---- term-list detection ----
function splitTermLine(raw){
  let s=String(raw||'').trim();
  s=s.replace(/^(?:[-*•·▪◦►]+\s+|\(?\d{1,4}[.):]\s+|\(?[a-zA-Z][.)]\s+)/,'');
  if(!s) return null;
  let term=s, def='', m;
  const tab=s.indexOf('\t');
  if(tab>0){ term=s.slice(0,tab); def=s.slice(tab+1); }
  else if(s[0]==='"' && (m=/^"([^"]*)"\s*,\s*"?([\s\S]*?)"?$/.exec(s))){ term=m[1]; def=m[2]; }
  else if((m=/^(.{1,60}?)\s+[-–—|]\s+(.+)$/.exec(s))){ term=m[1]; def=m[2]; }
  else if((m=/^([^:=]{1,60}?)\s*[:=]\s+(.+)$/.exec(s))){ term=m[1]; def=m[2]; }
  else if((s.match(/,/g)||[]).length===1 && (m=/^([^,]{1,40}),\s*(.+)$/.exec(s))){ term=m[1]; def=m[2]; }
  const clean=x=>String(x||'').replace(/^["'“”‘’]+|["'“”‘’]+$/g,'').replace(/\s+/g,' ').trim();
  term=clean(term); def=clean(def);
  if(!term) return null;
  const tw=term.split(/\s+/).length;
  if(tw>5 || term.length>60) return null;
  if(def){ if(def.split(/\s+/).length>40) return null; }
  else { if(tw>4) return null; if(tw>=3 && /[.?!]$/.test(term)) return null; }
  const key=termKeyOf(term); if(!key) return null;
  return { term, def, key };
}
// a title or instruction typed above/below a list ("SSAT vocabulary", "Make one question per word:")
function looksLikeInstruction(l){
  const wc=l.split(/\s+/).length;
  if(/[:：]\s*$/.test(l)) return true;
  return wc>=2 && wc<=14 && !/[-–—|=]|:\s/.test(l) &&
    /\b(vocab(?:ulary)?|words?|list|terms?|questions?|flashcards?|cards?|quiz|make|create|generate|write|study|ssat|isee|sat|act|gre|toefl|unit|chapter|lesson|practice|each|every|per)\b/i.test(l);
}
function parseOneList(text){
  const raw=String(text||'').replace(/\r/g,'').split('\n').map(l=>l.trim());
  let lines=raw.filter(Boolean);
  if(!lines.length) return null;
  const context=[];
  // a short heading block followed by a blank line and then a solid block of lines is a title, not terms
  const bi=raw.findIndex((l,i)=>!l && raw.slice(0,i).some(Boolean));
  if(bi>0){
    const head=raw.slice(0,bi).filter(Boolean), nextBlock=[]; 
    for(let i=bi+1;i<raw.length && raw[i];i++) nextBlock.push(raw[i]);
    if(head.length<=3 && nextBlock.length>=4){ context.push(...head); lines=lines.slice(head.length); }
  }
  const edge=new Set([...lines.slice(0,3), ...lines.slice(-2)].filter(looksLikeInstruction));
  let entries=null;
  if(lines.length>=8){
    const e=[], ctx=[];
    for(const l of lines){ const it=edge.has(l) ? null : splitTermLine(l); if(it) e.push(it); else ctx.push(l); }
    if(e.length>=8 && e.length>=lines.length*0.7){ entries=e; context.push(...ctx); }
  }
  if(!entries){
    // one paragraph / a few lines of comma- or semicolon-separated terms
    const segs=lines.filter(l=>!edge.has(l)).join(',').split(/[,;•·|]+/).map(x=>x.replace(/^\s*\(?\d{1,4}[.)]\s*/,'').trim()).filter(Boolean);
    if(segs.length>=10 && segs.filter(x=>x.split(/\s+/).length<=4).length>=segs.length*0.9){
      context.push(...lines.filter(l=>edge.has(l)));
      entries=segs.map(x=>{ const key=termKeyOf(x); return key ? {term:x,def:'',key} : null; }).filter(Boolean);
    }
  }
  if(!entries) return null;
  if(entries.length && /^(word|words|term|terms|vocab|vocabulary)$/i.test(entries[0].term) && /^(definition|meaning|definitions|meanings)$/i.test(entries[0].def||'')) entries.shift();
  return { entries, context };
}
// sources: [{kind:'notes'|'file'|'image', text}] -> {items, context, dupRemoved, truncated} or null (not a term list)
function detectTermList(sources){
  const lists=[], ctx=[]; let proseChars=0;
  for(const s of sources){
    const r=parseOneList(s.text);
    if(r){ lists.push(r); ctx.push(...r.context); }
    else if(s.kind==='notes') ctx.push(String(s.text||'').trim());
    else proseChars+=String(s.text||'').length;
  }
  if(!lists.length || proseChars>1500) return null;
  const byKey=new Map(); let dupRemoved=0;
  for(const l of lists) for(const it of l.entries){
    const prev=byKey.get(it.key);
    if(prev){ dupRemoved++; if(!prev.def && it.def) prev.def=it.def; } else byKey.set(it.key,{...it});
  }
  let items=[...byKey.values()], truncated=0;
  if(items.length>3000){ truncated=items.length-3000; items=items.slice(0,3000); }
  const context=ctx.filter(Boolean).join(' ').replace(/\s+/g,' ').slice(0,600);
  return items.length>=8 ? { items, context, dupRemoved, truncated } : null;
}

// ---- term-list generation (one card per term, verified coverage) ----
const LIST_TOKENS={ basic:55, fitb:80, mcq:120 };
function termPrompt(cardType, batchItems, perTerm, context){
  const list=batchItems.map((it,i)=>`${i+1}. ${it.def ? it.term+' — '+it.def : it.term}`).join('\n');
  const k=perTerm;
  const common=`Create study cards for EACH term in the numbered list below: exactly ${k} card${k>1?'s':''} per term, in the same order as the list.
Never skip a term, never repeat a term, and never add terms that are not in the list. Copy each term into the "term" field exactly as listed (no number, no definition).
If the list gives a definition for a term, base the card on it. If a term has no definition, use its standard, well-established dictionary meaning (the most common meaning for a student-level vocabulary list); do not invent obscure senses.
${k>1?'With more than one card per term, each card must test a different angle (meaning, use in a sentence, synonym/antonym) and have a different front.\n':''}${context?`Extra instructions from the student: ${context}\n`:''}`;
  const tail=`\nTerms:\n${list}\n`;
  if(cardType==='mcq') return `${common}Each card is one multiple-choice question testing the term's meaning. Vary the stems naturally (e.g. "What does X mean?", "Which word means ...?", or a short sentence-completion). Exactly 4 options and exactly one correct answer. Distractors must be plausible real meanings or words (not nonsense) with similar length and style; do not label options with letters; avoid "all/none of the above"; do not always make the correct option the longest.${tail}Return ONLY JSON: {"cards":[{"term":"...","question":"...","options":["...","...","...","..."],"answer":"must exactly equal one option"}]}.`;
  if(cardType==='fitb') return `${common}Each card is a sentence that uses the term, with the term replaced by ___ (three underscores). The sentence context must make the meaning clear without being a giveaway. "answers" lists the term plus any inflected form that would also fit grammatically.${tail}Return ONLY JSON: {"cards":[{"term":"...","question":"... ___ ...","answers":["..."]}]}.`;
  return `${common}Front = the term. Back = a concise definition that starts with the part of speech in parentheses, for example "(adj.) tending to ...".${tail}Return ONLY JSON: {"cards":[{"term":"...","front":"...","back":"..."}]}.`;
}
// Assigns returned cards to the terms of one batch. Returns Map(batchIndex -> cards[]).
function mapToItems(batchItems, cards, perTerm){
  const byKey=new Map(batchItems.map((it,i)=>[it.key,i]));
  const out=new Map(), left=[];
  for(const c of cards){
    const k=termKeyOf(c.term||'');
    let idx=byKey.has(k) ? byKey.get(k) : -1;
    if(idx<0 && k){ for(const [bk,bi] of byKey){ if(bk && (k.startsWith(bk+' ')||bk.startsWith(k+' '))){ idx=bi; break; } } }
    if(idx<0){ left.push(c); continue; }
    if(!out.has(idx)) out.set(idx,[]);
    out.get(idx).push(c);
  }
  // model garbled/omitted some "term" fields: align the leftovers with the still-uncovered terms in order
  const open=batchItems.map((_,i)=>i).filter(i=>!out.has(i));
  if(left.length && perTerm===1 && left.length===open.length) left.forEach((c,j)=>out.set(open[j],[c]));
  for(const [i,cs] of out){
    const it=batchItems[i];
    out.set(i, cs.slice(0,perTerm).map(c=>({...c, term:it.term, key:it.key})));
  }
  return out;
}
async function generateForTerms(items, o){
  const k=o.perTerm||1, type=o.cardType;
  const got=new Array(items.length).fill(null);
  const pace={limit:o.concurrency||3};
  let fatal=null, soft=null;
  const halt=()=>!!fatal || !!(o.shouldStop && o.shouldStop());
  const report=phase=>{ if(!o.onProgress) return; let done=0, cards=0; for(const g of got) if(g){ done++; cards+=g.length; } o.onProgress({phase, done, total:items.length, cards}); };
  const runBatches=async(idxs,size)=>{
    const groups=[]; for(let i=0;i<idxs.length;i+=size) groups.push(idxs.slice(i,i+size));
    const tasks=groups.map(g=>async()=>{
      if(halt()) return;
      const batchItems=g.map(i=>items[i]);
      const prompt=termPrompt(type, batchItems, k, o.context);
      const budget=Math.min(7000, batchItems.length*k*LIST_TOKENS[type]+900);
      try{
        const parsed=await o.request(prompt, budget, pace);
        const m=mapToItems(batchItems, normalizeCards(type, parsed), k);
        for(const [bi,cs] of m) if(cs.length) got[g[bi]]=cs;
      }catch(err){
        if(err.kind==='stopped') return;
        if(err.kind==='parse'){ soft=err; }                      // retried below with smaller batches
        else { fatal=err; }                                       // limits / auth / too-large: no point continuing
      }
      report('generating');
    });
    await runPool(tasks, pace, halt);
  };
  const sizes=[o.batchSize, Math.max(6,Math.floor(o.batchSize/3)), 3];
  for(let pass=0; pass<sizes.length; pass++){
    const pending=items.map((_,i)=>i).filter(i=>!got[i]);
    if(!pending.length || halt()) break;
    if(pass===2 && pending.length>30) break;                      // systematic failure: don't burn tokens
    if(pass>0 && o.onProgress) o.onProgress({phase:'repair', pending:pending.length, done:items.length-pending.length, total:items.length});
    await runBatches(pending, sizes[pass]);
  }
  const cards=[], missing=[];
  items.forEach((it,i)=>{ if(got[i]) cards.push(...got[i]); else missing.push(it); });
  return { cards, missing, fatal, soft, stopped: !!(o.shouldStop && o.shouldStop()) };
}

// ---- prose generation (sections with quotas, targeted top-ups) ----
function allocateQuotas(total, weights){
  const sum=weights.reduce((a,b)=>a+b,0)||1;
  const raw=weights.map(w=>total*w/sum), base=raw.map(Math.floor);
  let left=total-base.reduce((a,b)=>a+b,0);
  const order=raw.map((r,i)=>[r-Math.floor(r),i]).sort((a,b)=>b[0]-a[0]);
  for(let j=0; left>0 && j<order.length; j++, left--) base[order[j][1]]++;
  return base;
}
const PROSE_TOKENS={ basic:70, fitb:90, mcq:130 };
async function generateFromSections(text, o){
  // o: {count, cardType, noun, allowExpansion, batchCap, makePrompt(countText, avoidText, material), request(prompt,budget,pace), normalize, dedupe, onProgress, shouldStop}
  const auto=o.count.mode==='auto';
  const target=auto ? Infinity : o.count.max, need=auto ? 0 : o.count.min;
  const len=text.length;
  const wanted=Math.max(1, Math.ceil(len/7000));
  const nSec=Math.max(1, auto ? wanted : Math.min(wanted, target));
  let chunks=splitSourceIntoChunks(text, Math.ceil(len/nSec*1.05)+50);
  if(!chunks.length) chunks=['(No source text.)'];
  const quotas=auto ? chunks.map(()=>0) : allocateQuotas(target, chunks.map(c=>c.length));
  const sec=chunks.map(()=>[]);        // normalised cards per section (deduped inside the section)
  const pace={limit:2};
  let fatal=null, soft=null;
  const halt=()=>!!fatal || !!(o.shouldStop && o.shouldStop());
  const total=()=>sec.reduce((a,s)=>a+s.length,0);
  const report=phase=>{ if(o.onProgress) o.onProgress({phase, done:total(), total:auto?null:target, sections:chunks.length}); };
  const budgetFor=n=>Math.min(7000, Math.max(1500, n*PROSE_TOKENS[o.cardType]+900));
  // asks for up to n more cards from one section; returns how many new ones survived de-duplication
  const ask=async(i, n, lo)=>{
    const have=sec[i];
    const avoid=have.length ? `Cards already written for this section. Do NOT repeat or rephrase any of them:\n${have.slice(-40).map(c=>'- '+c.front).join('\n').slice(-2500)}\n` : '';
    const countText=auto ? `${autoCountInstruction(o.noun, o.allowExpansion)} Return at most ${n}.` : countInstruction(o.noun, lo, n, o.allowExpansion);
    try{
      const parsed=await o.request(o.makePrompt(countText, avoid, chunks[i]), budgetFor(n), pace);
      const fresh=dedupeCards(o.normalize(parsed));
      const merged=dedupeCards(have.concat(fresh));
      const added=merged.length-have.length;
      sec[i]=merged; report('generating');
      return added;
    }catch(err){
      if(err.kind==='stopped') return 0;
      if(err.kind==='parse'){ soft=err; return 0; }
      fatal=err; return 0;
    }
  };
  // pass 1: every section once, in parallel (sections are independent so they cannot repeat each other)
  const tasks=chunks.map((_,i)=>async()=>{
    if(halt()) return;
    if(auto){
      for(let r=0; r<3 && !halt(); r++){ const added=await ask(i, o.batchCap, 1); if(added<o.batchCap*0.9) break; }
      return;
    }
    const q=quotas[i]; if(q<=0) return;
    let remaining=q;
    while(remaining>0 && !halt()){
      const n=Math.min(o.batchCap, remaining);
      const lo=o.count.min===o.count.max ? n : Math.max(1, Math.floor(need*n/target));
      const added=await ask(i, n, lo);
      if(!added) break;
      remaining-=added;
    }
  });
  await runPool(tasks, pace, halt);
  const mergeAll=()=>dedupeCards(o.dedupe(sec.flat()));
  let merged=mergeAll();
  // pass 2: if short of the minimum, ask the sections that still have material for more (with their own avoid-lists)
  if(!auto && merged.length<need){
    const exhausted=new Set();
    const guardMax=Math.ceil((need-merged.length)/o.batchCap)+chunks.length*2+2;
    for(let g=0; g<guardMax && merged.length<need && !halt(); g++){
      const cand=chunks.map((_,i)=>i).filter(i=>!exhausted.has(i));
      if(!cand.length) break;
      const i=cand[g%cand.length];
      const missing=need-merged.length, n=Math.min(o.batchCap, missing);
      const before=merged.length;
      await ask(i, n, n);
      merged=mergeAll();
      if(merged.length===before) exhausted.add(i);
      if(o.onProgress) o.onProgress({phase:'topup', done:merged.length, total:target, sections:chunks.length});
    }
  }
  return { cards: auto ? merged : merged.slice(0,target), fatal, soft, stopped: !!(o.shouldStop && o.shouldStop()), sections: chunks.length };
}

// ---- final status line ----
function doneMessage(c){
  const n=c.n.toLocaleString();
  const parts=[];
  if(c.mode==='list'){
    const t=c.info.total;
    if(!c.info.missing.length && !c.stopped && !c.fatal) parts.push(c.info.perTerm>1 ? `Generated ${n} cards covering all ${t.toLocaleString()} terms (up to ${c.info.perTerm} per term), with no repeats.` : `Generated ${n} cards: exactly one for each of your ${t.toLocaleString()} terms, with no repeats.`);
    else parts.push(`Generated ${n} cards for ${(t-c.info.missing.length).toLocaleString()} of ${t.toLocaleString()} terms.`);
    if(c.info.dupRemoved) parts.push(`${c.info.dupRemoved} duplicate term${c.info.dupRemoved===1?'':'s'} in your list ${c.info.dupRemoved===1?'was':'were'} merged.`);
    if(c.info.skippedExisting) parts.push(`${c.info.skippedExisting} term${c.info.skippedExisting===1?'':'s'} already in this set ${c.info.skippedExisting===1?'was':'were'} skipped.`);
    if(c.info.limited) parts.push(`Only the first ${c.info.limited.toLocaleString()} terms were used because of the requested card count.`);
    if(c.info.truncated) parts.push(`${c.info.truncated} terms beyond the 3,000-term limit were ignored.`);
    if(c.info.missing.length){
      const names=c.info.missing.slice(0,6).map(x=>x.term).join(', ');
      parts.push(`Couldn't complete: ${names}${c.info.missing.length>6?`, and ${c.info.missing.length-6} more`:''}. Save these, then run the same list again into the same set: terms already saved are skipped, so only the missing ones are retried.`);
    }
  } else {
    const k=c.count;
    if(k.mode==='auto') parts.push(`Generated ${c.n===1?'1 card':n+' cards'}.`);
    else if(k.mode==='exact' && c.n<k.max) parts.push(c.allowExpansion
      ? `Generated ${n} of ${k.max.toLocaleString()} requested cards. The model stopped producing enough distinct cards. You can save these or retry.`
      : `Generated ${n} of ${k.max.toLocaleString()} requested cards using only supported source facts. To include related knowledge and try to fill the rest, enable “Allow related knowledge to fill the requested count.”`);
    else if(c.n<k.min) parts.push(`Generated ${n} cards; the requested minimum is ${k.min.toLocaleString()}. ${c.allowExpansion?'The model could not complete the quota.':'Only distinct source-supported facts were included; no outside facts were guessed.'}`);
    else parts.push(k.min===k.max ? `Generated exactly ${c.n===1?'1 card':n+' cards'}.` : `Generated ${c.n===1?'1 card':n+' cards'} (range ${k.min}–${k.max}).`);
    if(c.topicOnly) parts.push('Your input looked like a topic rather than notes, so general subject knowledge was used.');
  }
  if(c.stopped) parts.push('Stopped early at your request.');
  else if(c.fatal) parts.push(`Stopped early: ${c.fatal.message||'a request failed'}.`);
  return parts.join(' ')+' Review below, then save.';
}

function renderAI(){
  const el=document.getElementById('tab-ai'), decks=Object.values(state.decks);
  el.innerHTML=`<div class="card">${panelHeader('sparkle','Create with AI','Let AI turn your notes, files, or ideas into a set of study decks.')}

    <div class="filelist" id="aiFileList"></div>
    <label>Extra notes (optional)</label>

    <label>Number of cards</label>
    <div class="type-toggle count-toggle">
      <button type="button" class="countBtn" data-mode="exact"><span>Exact</span></button>
      <button type="button" class="countBtn" data-mode="range"><span>Range</span></button>
      <button type="button" class="countBtn active" data-mode="auto"><span>AI decides</span></button>
    </div>
    <input type="hidden" id="aiCountMode" value="auto">
    <div class="count-fields hidden" id="aiCountExactWrap">
      <div><label for="aiCountExact">Exactly</label><input type="number" id="aiCountExact" min="${MIN_CARDS}" max="${MAX_CARDS}" step="1" value="20" inputmode="numeric"></div>
    </div>
    <div class="count-fields hidden" id="aiCountRangeWrap">
      <div><label for="aiCountMin">Minimum</label><input type="number" id="aiCountMin" min="${MIN_CARDS}" max="${MAX_CARDS}" step="1" value="10" inputmode="numeric"></div>
      <div><label for="aiCountMax">Maximum</label><input type="number" id="aiCountMax" min="${MIN_CARDS}" max="${MAX_CARDS}" step="1" value="20" inputmode="numeric"></div>
    </div>
    <p class="count-hint" id="aiCountHint"></p>
    <div class="import-tip" style="margin-top:10px;">
      <label style="margin:0;display:flex;align-items:flex-start;gap:9px;font-size:13px;font-weight:600;">
        <input type="checkbox" id="aiAllowExpansion" style="width:auto;min-height:0;margin-top:3px;flex:0 0 auto;">
        Allow related knowledge to fill the requested count
      </label>
      <p class="sub" style="margin:6px 0 0 24px;font-size:12px;">Off by default: cards must be supported by your notes/files. Turn on only when you want extra facts from general subject knowledge. Exact counts cannot be guaranteed without repetition or unsupported claims if the source is too short.</p>
    </div>
    <p class="sub import-tip"><b>Word or term lists</b> (one per line, or <code>word - definition</code>) are detected automatically: every term gets its own card, so nothing repeats and nothing is skipped. A short topic with no files uses general knowledge automatically. Cards already in the set you're adding to are skipped. Review the generated cards before saving.</p>
    <label>Add to set</label>
    <select id="aiSetSel"></select>
    <input id="aiNewName" class="hidden" placeholder="New set name" style="margin-top:8px;">
    <label>Cards per deck</label>
    <select id="aiChunkSel"><option value="20" selected>Up to 20 cards</option><option value="10">Up to 10 cards</option><option value="30">Up to 30 cards</option><option value="50">Up to 50 cards</option></select>
    <p class="sub import-tip" style="margin-top:6px;">New cards are split evenly into decks of this size and added to the set, so you can study one deck at a time.</p>
    <button class="btn" id="aiBtn" style="margin-top:10px;">${ICONS.sparkle} Generate cards</button> <button type="button" class="btn secondary hidden" id="aiStopBtn" style="margin-top:10px;">Stop</button>
    <p class="sub" id="aiStatus"></p><div id="aiPreview"></div></div>`;
  const sel=document.getElementById('aiSetSel');
  const chunkSel=document.getElementById('aiChunkSel');
  const nameInput=document.getElementById('aiNewName');
  let readyCards=[];
  const setLabel=st=>{ const ds=setDeckIds(st); return `${st.name} · ${ds.length} deck${ds.length===1?'':'s'} · ${cardCountForDeckIds(ds)} cards`; };
  const fillSetOptions=selectedId=>{
    sel.innerHTML='<option value="__new">+ New set</option>'+Object.values(state.sets).map(st=>`<option value="${st.id}">${escapeHtml(setLabel(st))}</option>`).join('');
    sel.value=(selectedId && state.sets[selectedId]) ? selectedId : '__new';
  };
  // what the selected set already contains (empty when making a new set)
  const existingState=()=>{
    const keys=new Set(), toks=[], st=state.sets[sel.value];
    if(st) setDeckIds(st).forEach(id=>state.decks[id].cards.forEach(c=>{
      const k=normKey(c.front); if(!k) return;
      keys.add(k);
      const t=new Set(dedupeTokens(k)); if(t.size>=4) toks.push(t);
    }));
    return {keys, toks};
  };
  const existingTermKeys=()=>{
    const keys=new Set(), st=state.sets[sel.value];
    if(st) setDeckIds(st).forEach(id=>state.decks[id].cards.forEach(c=>{
      if(c.key) keys.add(c.key);
      const f=String(c.front||''); if(f && f.split(/\s+/).length<=4) keys.add(termKeyOf(f));
    }));
    return keys;
  };
  const freshFrom=list=>dedupeCards(list, existingState());
  const updateSaveLabel=()=>{
    const b=document.getElementById('aiSaveBtn'); if(!b) return;
    const fresh=freshFrom(readyCards);
    const per=parseInt(chunkSel.value,10)||20, n=Math.ceil(fresh.length/per);
    if(!fresh.length) b.textContent='Nothing new to add';
    else if(sel.value==='__new') b.textContent = n>1 ? `Save as a set of ${n} decks` : 'Save as a new set';
    else b.textContent=`Add ${fresh.length} card${fresh.length===1?'':'s'} to set (${n} new deck${n===1?'':'s'})`;
  };
  const syncNewUI=()=>{ nameInput.classList.toggle('hidden', sel.value!=='__new'); updateSaveLabel(); };
  fillSetOptions('__new');
  sel.onchange=syncNewUI; chunkSel.onchange=updateSaveLabel; syncNewUI();
  const aiFileInput=document.getElementById('aiFileInput');
  document.getElementById('aiChooseBtn').onclick=()=>aiFileInput.click();
  aiFileInput.onchange=e=>updateAIFileList(Array.from(e.target.files||[]));
  bindDropzone('aiDropzone','aiFileInput',updateAIFileList);
  el.querySelectorAll('.typeBtn').forEach(b=>b.onclick=()=>{
    el.querySelectorAll('.typeBtn').forEach(x=>x.classList.toggle('active', x===b));
    document.getElementById('aiCardType').value=b.dataset.type;
  });

  // "Number of cards" controls: mode toggle + live hint + validation styling
  const countIds=['aiCountExact','aiCountMin','aiCountMax'];
  const refreshCount=()=>{
    const s=readCountSetting();
    document.getElementById('aiCountExactWrap').classList.toggle('hidden', s.mode!=='exact');
    document.getElementById('aiCountRangeWrap').classList.toggle('hidden', s.mode!=='range');
    countIds.forEach(id=>document.getElementById(id).classList.toggle('invalid', !!(s.bad && s.bad.includes(id))));
    const hint=document.getElementById('aiCountHint');
    hint.classList.toggle('error', !!s.error);
    hint.textContent = s.error || describeCount(s);
  };
  el.querySelectorAll('.countBtn').forEach(b=>b.onclick=()=>{
    el.querySelectorAll('.countBtn').forEach(x=>x.classList.toggle('active', x===b));
    document.getElementById('aiCountMode').value=b.dataset.mode;
    refreshCount();
  });
  countIds.forEach(id=>{
    const inp=document.getElementById(id);
    inp.oninput=refreshCount;
    // when leaving a field, pull out-of-bounds numbers back into the allowed range
    inp.onchange=()=>{
      const v=parseInt(inp.value,10);
      if(Number.isFinite(v)) inp.value=Math.min(MAX_CARDS, Math.max(MIN_CARDS, v));
      refreshCount();
    };
  });
  refreshCount();

  document.getElementById('aiBtn').onclick=async ()=>{
    const count=readCountSetting();
    if(count.error){ toast(count.error); refreshCount(); return; }
    const notes=document.getElementById('aiInput').value.trim();
    const cardType=document.getElementById('aiCardType').value;
    const btn=document.getElementById('aiBtn'), stopBtn=document.getElementById('aiStopBtn');
    const statusEl=document.getElementById('aiStatus');
    const fmt=n=>Number(n).toLocaleString();
    let stopped=false;
    stopBtn.disabled=false;
    stopBtn.onclick=()=>{ stopped=true; stopBtn.disabled=true; statusEl.textContent='Stopping after the current requests finish…'; };
    const shouldStop=()=>stopped;
    btn.disabled=true; statusEl.innerHTML='<span class="spinner"></span> Reading files…';
    document.getElementById('aiPreview').innerHTML='';
    try{
      const sources=[];   // {kind:'notes'|'file'|'image', text}
      if(notes) sources.push({kind:'notes', text:notes});
      let images=[];
      for(const f of aiFiles){
        const fileName=f.name.toLowerCase();
        if(f.type.startsWith('image/')) images.push(await readAsDataURL(f));
        else if(f.type==='application/pdf' || fileName.endsWith('.pdf')) sources.push({kind:'file', text:await extractPdfText(f)});
        else if(fileName.endsWith('.docx') || f.type==='application/vnd.openxmlformats-officedocument.wordprocessingml.document') sources.push({kind:'file', text:await extractDocxText(f)});
        else sources.push({kind:'file', text:await readAsText(f)});
      }
      if(!sources.some(s=>s.text.trim()) && !images.length){ toast('Add notes or attach at least one file first.'); btn.disabled=false; statusEl.textContent=''; return; }
      stopBtn.classList.remove('hidden');
      if(images.length){
        statusEl.innerHTML=`<span class="spinner"></span> Reading image content once…`;
        const imageSource=await extractImageSourceOnce(images);
        sources.push({kind:'image', text:imageSource});
        images=[];
      }
      const combinedText=sources.map(s=>String(s.text||'').trim()).filter(Boolean).join('\n\n');
      const sourceWordCount=combinedText ? combinedText.split(/\s+/).filter(Boolean).length : 0;
      const model=MODEL;
      const noun=cardType==='basic' ? 'card' : 'question';
      const batchCap=batchSizeFor(cardType);
      const request=(prompt,budget,pace)=>requestWithBackoff(model, prompt, [], budget, shouldStop, pace);
      const userExpansion=document.getElementById('aiAllowExpansion').checked;

      let cards=[], run={mode:'prose'}, topicOnly=false, allowExpansion=userExpansion;
      const listInfo=detectTermList(sources);

      if(listInfo){
        // ---- term list (e.g. vocabulary): every term goes to exactly one request, so nothing can repeat ----
        const existing=existingTermKeys();
        let items=listInfo.items.filter(it=>!existing.has(it.key));
        const skippedExisting=listInfo.items.length-items.length;
        if(!items.length) throw genError('empty','Every term in your list is already in that set, so there is nothing new to add.');
        let perTerm=1, limited=0;
        if(count.mode!=='auto'){
          if(count.max<items.length){ limited=count.max; items=items.slice(0,count.max); }
          else if(count.max>items.length) perTerm=Math.min(3, Math.ceil(count.max/items.length));
        }
        statusEl.innerHTML=`<span class="spinner"></span> Found a list of ${fmt(items.length)} terms. Writing ${perTerm>1?perTerm+' '+noun+'s':'one '+noun} per term in ${fmt(Math.ceil(items.length/batchCap))} batches…`;
        const res=await generateForTerms(items,{
          cardType, perTerm, context:listInfo.context, request, shouldStop, batchSize:batchCap, concurrency:3,
          onProgress:p=>{
            statusEl.innerHTML = p.phase==='repair'
              ? `<span class="spinner"></span> Retrying ${fmt(p.pending)} skipped term${p.pending===1?'':'s'}… ${fmt(p.done)} / ${fmt(p.total)} terms done`
              : `<span class="spinner"></span> Building your deck… ${fmt(p.done)} / ${fmt(p.total)} terms · ${fmt(p.cards)} cards`;
          }
        });
        cards=freshFrom(res.cards);
        if(count.mode!=='auto') cards=cards.slice(0,count.max);
        run={ mode:'list', fatal:res.fatal, stopped:res.stopped,
              info:{ total:items.length, missing:res.missing, dupRemoved:listInfo.dupRemoved, skippedExisting, perTerm, limited, truncated:listInfo.truncated } };
      } else {
        // ---- free-form notes / documents / topics ----
        // A few words with no files is a topic ("photosynthesis"), not source notes, so allow general knowledge.
        topicOnly = !aiFiles.length && sourceWordCount>0 && sourceWordCount<30;
        allowExpansion = userExpansion || topicOnly;
        const targetSet=state.sets[sel.value];
        const targetIds=new Set(targetSet ? setDeckIds(targetSet) : []);
        const destinationFronts=targetSet ? [...targetIds].flatMap(id=>state.decks[id].cards.map(c=>c.front)).slice(-12) : [];
        const destHint=destinationFronts.length ? `Recent destination-set fronts to avoid: ${destinationFronts.join(' | ').slice(0,1200)}\n` : '';
        const contentPolicy=allowExpansion
          ? 'When the supplied material is insufficient, you may include accurate, well-established related subject facts. Avoid obscure or uncertain claims.'
          : 'SOURCE-ONLY MODE: every answer must be directly supported by the Material below. Do not rely on background knowledge, make assumptions, or infer facts not stated. Prefer fewer grounded cards over invented cards.';
        const makePrompt=(countText, existingText, material)=> cardType==='mcq' ? `Create high-quality multiple-choice questions from the material below.
${countText}
${contentPolicy}
Each question needs exactly 4 answer options with exactly one correct answer. Make distractors plausible and ensure the answer exactly matches one option. Each question must test a distinct fact.
${destHint}${existingText||''}${TOPIC_RULE}
Material:
${material}
Return ONLY JSON: {"cards":[{"question":"...","options":["...","...","...","..."],"answer":"..."}]}.`
        : cardType==='fitb' ? `Create high-quality fill-in-the-blank questions from the material below.
${countText}
${contentPolicy}
Use a sentence supported by the source with the key term replaced by ___ (three underscores). Include accepted answers that are actually equivalent; do not invent synonyms.
${destHint}${existingText||''}${TOPIC_RULE}
Material:
${material}
Return ONLY JSON: {"cards":[{"question":"...___...","answers":["..."]}]}.`
        : `Create high-quality flashcards from the material below.
${countText}
${contentPolicy}
Each card must test a distinct fact. Keep backs concise${allowExpansion?'':' and directly supported by the source'}.
${destHint}${existingText||''}${TOPIC_RULE}
Material:
${material}
Return ONLY JSON: {"cards":[{"front":"...","back":"..."}]}.`;
        statusEl.innerHTML=`<span class="spinner"></span> Generating cards…${sourceWordCount?` using ${fmt(sourceWordCount)} source words`:''}`;
        const res=await generateFromSections(combinedText || '(No source text.)',{
          count, cardType, noun, allowExpansion, batchCap, makePrompt, request, shouldStop,
          normalize:parsed=>normalizeCards(cardType, parsed), dedupe:freshFrom,
          onProgress:p=>{
            statusEl.innerHTML=`<span class="spinner"></span> ${p.phase==='topup'?'Looking for more distinct cards…':'Building your deck…'} ${fmt(p.done)}${p.total?' / '+fmt(p.total):''} cards${p.sections>1?` · ${p.sections} source sections`:''}`;
          }
        });
        cards=res.cards;
        run={ mode:'prose', fatal:res.fatal, stopped:res.stopped };
      }
      if(!cards.length && run.fatal) throw run.fatal;
      if(!cards.length) throw genError('empty');

      document.getElementById('aiStatus').textContent=doneMessage({ mode:run.mode, n:cards.length, count, allowExpansion, topicOnly, info:run.info, stopped:run.stopped, fatal:run.fatal });
      const preview = document.getElementById('aiPreview');
      preview.innerHTML = cardType==='mcq'
        ? `<div class="overflow-x"><table><tr><th>Question</th><th>Options</th><th>Correct</th></tr>${cards.map(c=>`<tr><td>${escapeHtml(c.front)}</td><td>${c.options.map(o=>escapeHtml(o)).join('<br>')}</td><td>${escapeHtml(c.options[c.correctIndex])}</td></tr>`).join('')}</table></div><button class="btn" id="aiSaveBtn" style="margin-top:10px;">Save all to deck</button>`
        : cardType==='fitb'
        ? `<div class="overflow-x"><table><tr><th>Question</th><th>Accepted answers</th></tr>${cards.map(c=>`<tr><td>${escapeHtml(c.front)}</td><td>${c.answers.map(a=>escapeHtml(a)).join(', ')}</td></tr>`).join('')}</table></div><button class="btn" id="aiSaveBtn" style="margin-top:10px;">Save all to deck</button>`
        : `<div class="overflow-x"><table><tr><th>Front</th><th>Back</th></tr>${cards.map(c=>`<tr><td>${escapeHtml(c.front)}</td><td>${escapeHtml(c.back)}</td></tr>`).join('')}</table></div><button class="btn" id="aiSaveBtn" style="margin-top:10px;">Save all to deck</button>`;

      readyCards=cards; updateSaveLabel();
      const makeCard=c=>{
        const base= c.type==='mcq'
          ? {id:uid(), type:'mcq', front:c.front, options:c.options, correctIndex:c.correctIndex, back:c.options[c.correctIndex], interval:0, ease:2.5, due:0, reps:0}
          : c.type==='fitb'
          ? {id:uid(), type:'fitb', front:c.front, answers:c.answers, back:c.answers[0], interval:0, ease:2.5, due:0, reps:0}
          : {id:uid(), type:'basic', front:c.front, back:c.back, interval:0, ease:2.5, due:0, reps:0};
        if(c.key) base.key=c.key;
        return base;
      };
      // Adds the cards to the selected set (or a brand-new one) as new decks, split evenly.
      const commitAdd=newSetName=>{
        const isNew=sel.value==='__new';
        const fresh=freshFrom(cards);
        if(!fresh.length){ const m='Nothing new to add — every card is already in this set.'; document.getElementById('aiStatus').textContent=m; toast(m); return; }
        const per=parseInt(chunkSel.value,10)||20, n=Math.ceil(fresh.length/per), size=Math.ceil(fresh.length/n);
        const setId=isNew ? ensureSet(newSetName) : sel.value;
        const st=state.sets[setId];
        const used=new Set(Object.values(state.decks).map(d=>d.name));
        let part=setDeckIds(st).length;
        for(let i=0;i<n;i++){
          let name; do{ part++; name=`${st.name} · Part ${part}`; }while(used.has(name));
          used.add(name);
          const deckId=ensureDeck(name);
          state.decks[deckId].cards.push(...fresh.slice(i*size,(i+1)*size).map(makeCard));
          st.deckIds.push(deckId);
        }
        saveDecks();
        const skipped=cards.length-fresh.length;
        const m=`Added ${fresh.length} card(s) to "${st.name}" in ${n} new deck${n===1?'':'s'}${skipped?` (${skipped} duplicate${skipped===1?'':'s'} skipped)`:''}.`;
        document.getElementById('aiStatus').textContent=m; toast(m);
        readyCards=[]; nameInput.value=''; fillSetOptions(setId); syncNewUI();
        preview.innerHTML=''; renderDecks();
      };
      document.getElementById('aiSaveBtn').onclick=()=>{
        if(sel.value!=='__new'){ commitAdd(); return; }
        const typed=nameInput.value.trim();
        if(typed){ commitAdd(typed); return; }
        showPrompt('Name your new set','Give the set a name. Its decks will be called "Name · Part 1", "Name · Part 2" and so on.','e.g. Spanish Verbs','Save', commitAdd);
      };
    }catch(e){
      const msgs={
        parse:"The AI didn't return valid cards after a few tries. Try again, or add a bit more detail in the notes.",
        empty:"The AI didn't find anything new to turn into cards. Try adding more material or a different topic.",
        api:'Could not generate cards ('+e.message+'). Make sure GROQ_API_KEY is set on your host and try again.',
        limit:'Could not finish: '+e.message+'.'
      };
      document.getElementById('aiStatus').textContent = (e.kind==='empty' && e.message && e.message!=='empty') ? e.message : (msgs[e.kind] || ('Could not generate cards ('+e.message+').'));
    }
    stopBtn.classList.add('hidden');
    btn.disabled=false;
  };
}

function bindDropzone(zoneId, inputId, onFiles){
  const zone=document.getElementById(zoneId), input=document.getElementById(inputId);
  if(!zone||!input) return;
  ['dragenter','dragover'].forEach(ev=>zone.addEventListener(ev,e=>{e.preventDefault();zone.classList.add('is-dragover');}));
  ['dragleave','drop'].forEach(ev=>zone.addEventListener(ev,e=>{e.preventDefault();zone.classList.remove('is-dragover');}));
  zone.addEventListener('drop',e=>{ const files=Array.from(e.dataTransfer.files||[]); if(files.length) onFiles(files); });
}
function updateAIFileList(files){
  aiFiles=files;
  const label=document.getElementById('aiFileLabel'); const list=document.getElementById('aiFileList');
  if(label) label.textContent=files.length?(files.length===1?files[0].name:files.length+' files chosen'):'No file chosen';
  if(list) list.innerHTML=files.map(f=>`<span>${escapeHtml(f.name)}</span>`).join('');
}
function setupGlobalUX(){
  initTheme();
  updateHeaderStreak();
  document.getElementById('themeToggle').onclick=toggleTheme;
  document.addEventListener('keydown',e=>{
    if(e.key==='Escape' && studySession && !document.getElementById('modalRoot').innerHTML){
      e.preventDefault();
      if(studySession.pos>0) showConfirm('Exit this session?','Your completed reviews are already saved. The remaining cards will stay due.',()=>{studySession=null;renderStudy();});
      else {studySession=null;renderStudy();}
      return;
    }
    if(!studySession || ['INPUT','TEXTAREA','SELECT'].includes(document.activeElement?.tagName)) return;
    const k=e.key;
    if(k===' '){ e.preventDefault(); if(!studySession.showBack){studySession.showBack=true;renderStudy();} return; }
    if(['1','2','3','4'].includes(k)){
      if(!studySession.showBack && studySession.optionOrder){
        e.preventDefault();
        const idx=Number(k)-1;
        if(idx<studySession.optionOrder.length){ const btn=document.querySelector(`.mcq-opt[data-i="${studySession.optionOrder[idx]}"]`); if(btn) btn.click(); }
        return;
      }
      if(studySession.showBack){ e.preventDefault(); const btn=document.querySelector(`#gradeRow button[data-r="${Number(k)-1}"]`); if(btn) btn.click(); }
    }
  });
}
const renderers={study:renderStudy, decks:renderDecks, import:renderImport, ai:renderAI};
document.getElementById('tabs').addEventListener('click', e=>{
  const b=e.target.closest('button[data-tab]'); if(!b) return;
  document.querySelectorAll('#tabs button').forEach(x=>x.classList.remove('active')); b.classList.add('active');
  Object.keys(renderers).forEach(k=>document.getElementById('tab-'+k).classList.toggle('hidden', k!==b.dataset.tab));
  localStorage.setItem('recall_tab', b.dataset.tab);
  renderers[b.dataset.tab]();
});
setupGlobalUX();
const initialTab=localStorage.getItem('recall_tab') || 'study';
const initialBtn=document.querySelector(`#tabs button[data-tab="${initialTab}"]`) || document.querySelector('#tabs button[data-tab="study"]');
initialBtn.click();
</script>
